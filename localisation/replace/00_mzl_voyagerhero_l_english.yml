 borg_crisis.360.name:0 "Return of the U.S.S. Voyager"
 borg_crisis.360.desc:0 "Our military specialists dedicated to countering the impending Borg threat have been contacted by §HCaptain Kathryn Janeway§! from the §HFederation§! starship, §HU.S.S. Voyager§!.\n\n§HCaptain Janeway§! has returned from her time in the §HDelta Quadrant§!, and is offering to share classified information with us and other galactic leaders in the hope of averting all-out war with the §GBorg Collective§!.\n\nJaneway offers this help freely, to anyone who could be attacked by §Gthe Borg§!. If her proposed mission is approved, she will arrive shortly to assist us with the §HU.S.S. Voyager§!."
