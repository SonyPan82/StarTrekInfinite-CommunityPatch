l_english:
 orion_syndicate:0 "Orion Syndicate"
 orion_syndicate_desc:0 "The Orion Syndicate operates from the shadows of the quadrant's major powers, controlling vast criminal networks, smuggling routes, and mercenary forces. From their homeworld, the Syndicate brokers deals with anyone willing to pay — and punishes, quietly, those who refuse.\n\nThe Orions do not wage war openly when subtlety serves better. They manipulate, trade, and expand through leverage rather than raw strength — but when pressed, their fleets are formidable and their resolve unforgiving."
