cp26_vassalization.1.name:0 "Occupied State Proposal"
cp26_vassalization.1.desc:0 "§H[event_target:cp26_vassalization_actor.GetName]§! proposes that we become an occupied state under their control."
 cp26_vassalization.1.accept:0 "Accept the proposal"
 cp26_vassalization.1.decline:0 "Refuse the proposal"
cp26_vassalization.2.name:0 "Occupied State Accepted"
cp26_vassalization.2.desc:0 "§H[event_target:cp26_vassalization_recipient.GetName]§! accepted our proposal and is now our occupied state."
 cp26_vassalization.2.ok:0 "Excellent."
cp26_vassalization.3.name:0 "Occupied State Refused"
cp26_vassalization.3.desc:0 "§H[event_target:cp26_vassalization_recipient.GetName]§! refused our occupied state proposal.\n\nWe gain a temporary casus belli to enforce it by war."
 cp26_vassalization.3.ok:0 "They will regret this."
cp26_vassalization.5.name:0 "Occupied State"
cp26_vassalization.5.desc:0 "§H[event_target:cp26_vassalization_subject.GetName]§! is now an occupied state of §H[event_target:cp26_vassalization_overlord.GetName]§!."
 cp26_vassalization.5.ok:0 "OK"
 cp26_vassalization.6.name:0 "Peace Proposal"
 cp26_vassalization.6.desc:0 "§H[event_target:cp26_wargoal_peace_actor.GetName]§! asks us to accept their war goal and end the conflict."
