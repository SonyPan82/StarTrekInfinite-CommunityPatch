 cp26_vassalization.6.decline:0 "Refuse"
 cp26_vassalization.7.name:0 "War Goal Accepted"
 cp26_vassalization.7.desc:0 "§H[event_target:cp26_wargoal_peace_recipient.GetName]§! accepted our peace proposal."
 cp26_vassalization.7.ok:0 "Excellent."
 cp26_vassalization.8.name:0 "Proposal Refused"
 cp26_vassalization.8.desc:0 "§H[event_target:cp26_wargoal_peace_recipient.GetName]§! refused to accept our war goal."
 cp26_vassalization.8.ok:0 "The war continues."
