l_english:
 cp26_minor_mission.43.name:0 "Outbreak Contained"
 cp26_minor_mission.43.desc:0 "Scientists from §H[This.GetName]§! have contained the super-bacteria outbreak.\n\nThe crisis was costly, but the local authorities proved they could respond to a major medical emergency on their own."
 cp26_minor_mission.43.a:0 "Good news."
 cp26_minor_mission.43.a.tt:0 "The local outbreak has been contained. The affected world temporarily gains stability and growth.\n\n"
 cp26_minor_mission.44.name:0 "Containment Failed"
 cp26_minor_mission.44.desc:0 "A super-bacteria outbreak on a world belonging to §H[This.GetName]§! has overwhelmed the local authorities.\n\nTraditional methods failed, and the crisis left a lasting mark on the population."
 cp26_minor_mission.44.a:0 "The galaxy can be cruel."
 cp26_minor_mission.44.a.tt:0 "The local outbreak could not be contained.\n\n"
 cp26_minor_outbreak_contained:0 "Outbreak Contained"
 cp26_minor_outbreak_contained_desc:0 "This world strengthened its medical infrastructure after containing a super-bacteria outbreak."
 cp26_minor_mission.100.name:0 "Mission Succeeded"
 cp26_minor_mission.100.desc:0 "§H[This.GetName]§! brought this mission to a successful end.\n\nEven minor powers can find their own answers when the galaxy tests them."
 cp26_minor_mission.100.a:0 "They handled it."
 cp26_minor_mission.100.a.tt:0 "The minor mission ends successfully.\n\n"
 cp26_minor_mission.101.name:0 "Mission Failed"
 cp26_minor_mission.101.desc:0 "§H[This.GetName]§! failed to bring this mission to a successful end.\n\nThe crisis closes without a decisive result, but the empire now has a valid outcome and the game can continue normally."
 cp26_minor_mission.101.a:0 "Unfortunate."
 cp26_minor_mission.101.a.tt:0 "The minor mission ends in failure.\n\n"
