 START_SCREEN_GORN:0 "The Gorn Hegemony is a hard, territorial power built on hierarchy, survival, and the right of the strong to hold what they can defend. From Gornar, the ruling houses watch the frontier with cold calculation, treating every border as a test of resolve.\n\nThe Hegemony does not seek friendship for its own sake. It respects strength, answers intrusion with force, and expands when weakness opens the way."
 gorn_hegemony:0 "Gorn Hegemony"