 NAME_CP26_VGER_COUNTRY:0 "V'ger"
 NAME_CP26_VGER_FLEET:0 "V'ger"
 NAME_CP26_VGER:0 "V'ger"
 NAME_CP26_VGER_DESIGN:0 "V'ger"
 cp26_vger_probe:0 "V'ger Probe"
 cp26_vger_probe_plural:0 "V'ger Probes"
 cp26_vger_chain_title:0 "V'ger"
 cp26_vger_chain_desc:0 "An enigmatic mechanical entity is holding position above one of our colonies. A science ship in orbit can begin a deeper analysis."
 cp26_vger_arrival_message:0 "An enigmatic presence has appeared within one of our systems."
 cp26_vger.5.title:0 "V'ger"
 cp26_vger.5.desc:0 "A vast mechanical entity has entered orbit around [event_target:cp26_vger_present_world.GetName]. Its trajectories, inertia, and surface scans resemble a methodical survey far more than an attack. Our oldest records speak of a very ancient contact with V'ger, yet this new pass reveals something else: a secondary signal, old and fragmented, whose harmonics faintly echo the whale probe without truly matching it. A thorough analysis may reveal what V'ger has been following all this time."
 cp26_vger.5.a:0 "Begin analysis"
 cp26_vger.5.b:0 "Observe without intervening"
 cp26_vger.6.title:0 "Echoes from the Deep"
 cp26_vger.6.desc:0 "Our teams have finally isolated the logic behind V'ger's trajectory. The entity was not seeking to transform our people: it was following a trail. Somewhere in its encounters with ancient intelligences, V'ger brushed against a call for help bearing signatures that faintly resemble the old whale probe. By tracing that signal, we uncovered forgotten survivors: the Nereens. V'ger now departs, leaving these new arrivals behind along with a treasure of scientific data."
 CP26_VGER_ANALYSIS:0 "Analyze V'ger"
 CP26_VGER_ANALYSIS_DESC:0 "V'ger has settled into prolonged orbit above this colony and is projecting an exceptionally fine lattice of scans. Studying its patterns may reveal the true purpose of its journey."
 cp26_vger_in_orbit:0 "Presence of V'ger"
 cp26_vger_in_orbit_desc:0 "V'ger's silent presence in orbit fuels local scientific curiosity and focuses research efforts."
 cp26_vger_afterglow:0 "V'ger Afterglow"
 cp26_vger_afterglow_desc:0 "The data left behind by V'ger continues to enrich our laboratories long after its departure."
