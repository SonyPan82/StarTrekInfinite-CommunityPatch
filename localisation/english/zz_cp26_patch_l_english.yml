 cp26_minor_mission.177.desc:0 "The inauguration did not go as planned. We can contain the fallout and carry on."
 cp26_minor_mission.177.a:0 "Understood."
 cp26_minor_mission.177.a.tt:0 "The mission fails without blocking the AI."
