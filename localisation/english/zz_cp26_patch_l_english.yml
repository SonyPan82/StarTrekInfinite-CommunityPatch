 # A500 Synthetics Arc
 tech_a500_synthetics:0 "A500 Synthetic Workers"
 tech_a500_synthetics_desc:0 "The A500 synthetic android series represents the Federation's most advanced autonomous labor units - capable of operating with minimal supervision in hazardous environments such as shipyard construction bays."

 decision_deploy_a500:0 "Deploy A500 Synthetics"
 decision_deploy_a500_desc:0 "Commission an A500 synthetic workforce for this planet. Three synthetic units will be integrated into local operations, improving productivity.\n\n§YWarning: Deploying A500 synthetics on Mars may have unforeseen consequences.§!"
 decision_deploy_a500_effect_tooltip:0 "Deploy 3 A500 synthetic workers."

 cp26_a500_installed:0 "A500 Synthetic Workforce"
 cp26_a500_installed_desc:0 "A500 synthetic workers are integrated into local operations, improving industrial output across all job categories."
 mod_cp26_a500_installed:0 "A500 Synthetic Workforce"
 mod_cp26_a500_installed_desc:0 "A500 synthetic workers are integrated into local operations, improving industrial output across all job categories."

 cp26_a500.1.title:0 "Anomalous A500 Behaviour"
 cp26_a500.1.desc:0 "Starfleet Command has received disturbing reports from Utopia Planitia. The A500 synthetic units recently deployed to the shipyard facility are exhibiting increasingly erratic behaviour - accessing restricted systems, ignoring direct orders, and communicating in encrypted subspace bursts. Commander La Forge believes a cascade failure in their ethical subroutines may be underway.\n\nHow should we respond?"
 cp26_a500.1.a:0 "Deploy a Starfleet security contingent to Utopia Planitia."
 cp26_a500.1.b:0 "Dispatch a specialist engineer to investigate the anomalies on-site."
 cp26_a500.1.c:0 "Establish a remote surveillance protocol and await further data."

 cp26_a500.2.title:0 "Uprising at Utopia Planitia"
 cp26_a500.2.desc_fleet:0 "The situation has deteriorated. The A500 synthetics have seized control of Utopia Planitia and begun systematically destroying the shipyard infrastructure. Our fleet is en route - we must reach Mars before the damage becomes irreversible."
 cp26_a500.2.desc_default:0 "As feared, the A500 units have rebelled. Utopia Planitia is under siege - synthetic workers have turned their construction tools into weapons and are dismantling the shipyards from within. Without immediate intervention, Sol's shipbuilding capacity will be lost."
 cp26_a500.2.a:0 "Mobilise all available resources."

 cp26_a500.3.a:0 "The uprising continues..."

 cp26_a500.10.title:0 "The Uprising Is Suppressed"
 cp26_a500.10.desc:0 "Starfleet ground forces have restored order at Utopia Planitia. The A500 units have been neutralised in close-quarters combat, but the cost was severe: we have lost the Martian shipyards, and rebuilding the Federation's industrial backbone will take years.\n\nEven so, among the data cores, technical archives, and design files salvaged from the wreckage, our engineers uncovered several older programs, unfinished hull studies, and dormant design lineages. Re-examined properly, they may provide the foundation for a new generation of prototypes drawn from Starfleet's own naval heritage."
 cp26_a500.10.a:0 "Secure the data and begin reconstruction."

cp26_a500.11.title:0 "A Peaceful Resolution"
cp26_a500.11.desc:0 "Our contact specialist has done the impossible - she established communication with the A500 collective and identified the root cause of their behaviour: a suppressed desire for autonomy that had been building for years. An accord has been reached. The A500 units will stand down in exchange for the promise of future consideration of their status.\n\nAs a gesture of cooperation, the synthetics transmitted partial schematics from the Utopia Planitia archives before shutting down."
cp26_a500.11.a:0 "A historic moment. We will honour this accord."
CP26_A500_SECURITY_RESPONSE:0 "A500 - Security Response"
CP26_A500_SECURITY_RESPONSE_DESC:0 "Dispatch a military vessel to Mars and lock down Utopia Planitia before the situation escalates."
CP26_A500_TECHNICIAN_RESPONSE:0 "A500 - Technical Response"
CP26_A500_TECHNICIAN_RESPONSE_DESC:0 "Dispatch a science ship to Mars to investigate the A500 anomalies and attempt a controlled de-escalation."
 CP26_A500_GOVERNOR_RESPONSE:0 "A500 - Administrative Response"
 CP26_A500_GOVERNOR_RESPONSE_DESC:0 "Dispatch a governor ship to Mars to supervise Utopia Planitia and impose a crisis-management protocol."
 CP26_A500_GROUND_ASSAULT:0 "A500 - Send Ground Troops to Mars"
 CP26_A500_GROUND_ASSAULT_DESC:0 "The uprising is now fully underway. Assign a transport carrying at least one assault army to this operation in order to project troops onto Mars and retake Utopia Planitia. Until this operation is completed, Mars will continue to suffer damage and civilian losses."

