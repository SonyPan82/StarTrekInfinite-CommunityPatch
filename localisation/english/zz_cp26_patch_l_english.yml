 CP26_SOL_SPY_MISSION_DESC:0 "Deploy a Romulan spy ship to the Sol system and extract A500 behavioural data from the Utopia Planitia archives. This operation must be completed within 215 days."
 CP26_PROJET_SYNTH:0 "Projet Synth - Trigger Operation"
 CP26_PROJET_SYNTH_DESC:0 "Use a Romulan spy ship in position to broadcast the A500 trigger signal and ignite a synthetic uprising on the targeted world."
 spy_situation_cp26_projet_synth:0 "Projet Synth"
 spy_situation_cp26_projet_synth_desc:0 "Use the A500 behavioural data stolen from Utopia Planitia to remotely trigger a synthetic rebellion on this world."
 spy_situation_cp26_projet_synth_effect_desc:0 "Triggers a true §HA500§! uprising on the target planet: devastation, lasting unrest, and rebel armies appearing on the surface. This operation requires a Romulan spy ship and can only target a world containing at least one A500 unit.\n\n"

