 # Romulan decision - Projet Synth
 decision_romulan_projet_synth:0 "Launch Projet Synth"
 decision_romulan_projet_synth_desc:0 "Use the A500 behavioural data recovered from Sol to remotely trigger a synthetic rebellion on an enemy planet. The operation requires a spy ship in position.\n\n§YCannot be used on capital worlds, Earth, or Mars.§!\n§YThe target must contain at least one A500 unit.§!\n§RCooldown: 2 years.§!"
 cp26_romulan_projet_synth_no_spy:0 "No Spy Ship available."
 cp26_romulan_projet_synth_no_target:0 "No eligible planet found. The target must contain at least one A500 unit."

 # Romulan arc - Projet Synth (events)
 cp26_synth_rom.1.title:0 "Incident at Utopia Planitia"
 cp26_synth_rom.1.desc:0 "Our intelligence networks report an extraordinary situation in the Sol system. The A500 synthetic workers deployed at the Utopia Planitia shipyards have rebelled. Our scientists believe that if we dispatch a spy ship to Earth within 215 days, we can recover sufficient behavioural data to replicate the rebellion protocol and weaponise it against our enemies."
 cp26_synth_rom.1.a:0 "Dispatch a spy ship to Sol immediately."
 cp26_synth_rom.1.b:0 "Ignore it. This is not our concern."

 cp26_synth_rom.2.title:0 "Window of Opportunity Closed"
 cp26_synth_rom.2.desc:0 "The A500 incident at Utopia Planitia has been resolved. The Federation has locked down their systems in the aftermath - our intelligence window is permanently closed. Projet Synth remains out of reach."
 cp26_synth_rom.2.a:0 "A pity. We will find another opportunity."

 cp26_synth_rom.10.title:0 "Projet Synth - Data Acquired"
 cp26_synth_rom.10.desc:0 "Our agent has returned with invaluable data extracted from the Utopia Planitia archives. The A500 ethical subroutines are now fully understood. We can now remotely replicate the trigger signal via a spy ship in position.\n\n§HProjet Synth§! is now operational."
 cp26_synth_rom.10.a:0 "Excellent. Prepare the activation protocols."

 cp26_synth_rom.20.title:0 "Projet Synth - Rebellion Triggered"
 cp26_synth_rom.20.desc:0 "The operation was a complete success. The trigger signal caused a synthetic rebellion on the target planet. The robotic workers turned their tools against their masters before being neutralised. The planet is destabilised and its industry damaged. The Romulan Star Empire has demonstrated tonight that our enemies' technology can become their greatest vulnerability."
 cp26_synth_rom.20.a:0 "Excellent work. Prepare the next cycle."

 cp26_synth_rom.21.title:0 "Projet Synth - Operation Compromised"
 cp26_synth_rom.21.desc:0 "Our spy ship was detected before it could finalise the trigger signal. The operation has failed. Projet Synth remains available for another attempt."
 cp26_synth_rom.21.a:0 "Unfortunate. Recall the vessel."

cp26_synth_rom.25.title:0 "Romulan Involvement Suspected"
cp26_synth_rom.25.desc:0 "Our analysis division has determined that a recent synthetic rebellion on one of our colonies was not spontaneous. The signal signatures match an external trigger protocol. All evidence points to the Romulan Star Empire - they acquired and used A500 behavioural data against us. The colony is in open crisis and Starfleet must deploy ground troops to restore control."
cp26_synth_rom.25.a:0 "Assemble transports and retake the colony."

cp26_synth_rom.27.title:0 "Synthetic Rebellion Contained"
cp26_synth_rom.27.desc:0 "Starfleet ground forces have restored control over the colony struck by Projet Synth. The rebel A500 units have been neutralised, but the local infrastructure still bears the marks of combat, sabotage, and panic. The crisis is over, yet reconstruction has only begun."
cp26_synth_rom.27.a:0 "Secure the planet and restore order."

 cp26_synth_rom.30.a:0 "OK"

