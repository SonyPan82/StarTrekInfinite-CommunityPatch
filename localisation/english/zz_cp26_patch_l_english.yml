 cp26_minor_mission.145.name:0 "Peace Conference Failed"
 cp26_minor_mission.145.desc:0 "Our delegation failed to secure the desired outcome. The mission ends without success, but the situation remains under control."
 cp26_minor_mission.145.a:0 "We move on."
 cp26_minor_mission.145.a.tt:0 "The mission fails cleanly."
