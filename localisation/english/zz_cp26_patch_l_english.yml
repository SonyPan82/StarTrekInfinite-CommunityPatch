 cp26_bajoran_wormhole:0 "Bajoran Wormhole"
 cp26_bajoran_wormhole_desc:0 "A stable subspace aperture linking the Bajoran system to the Gamma Quadrant. Instruments register traffic through the passage even when ships cannot traverse it physically."
 cp26_bajoran_wormhole.2.name:0 "Bajoran Wormhole Confirmed"
 cp26_bajoran_wormhole.2.desc:0 "Sensor data from the Denorios Belt is unambiguous. A stable spatial anomaly opens a corridor into an unknown region of space - what explorers are already calling the Gamma Quadrant. The passage cannot be physically traversed, but our instruments can detect vessels moving through it."
 cp26_bajoran_wormhole.2.ok:0 "Log the discovery."

 cp26_bajoran_wormhole.300.name:0 "Gamma Quadrant Expedition"
 cp26_bajoran_wormhole.300.desc:0 "A fleet has entered the Bajoran system. The Bajoran Wormhole is active. Command must decide how to proceed - the Gamma Quadrant is vast and its inhabitants unknown."
 cp26_bajoran_wormhole.300.a:0 "Proceed with caution - seek contact."
 cp26_bajoran_wormhole.300.b:0 "Enter with a show of force."
 cp26_bajoran_wormhole.300.c:0 "Hold position. Not yet."

 cp26_bajoran_wormhole.310.name:0 "First Contact in the Gamma Quadrant"
 cp26_bajoran_wormhole.310.desc:0 "Our vessels emerge from the wormhole into an unknown star system. Long-range sensors detect several vessels of unfamiliar design maintaining a safe distance. Their posture is watchful, not hostile - for now."
 cp26_bajoran_wormhole.310.a:0 "Attempt to open a channel."
 cp26_bajoran_wormhole.310.b:0 "Complete sensor sweeps and withdraw."

 cp26_bajoran_wormhole.311.name:0 "Diplomatic Exchange"
 cp26_bajoran_wormhole.311.desc:0 "The exchange is brief but significant. The vessels identify themselves as servants of the Founders - the Dominion. They are curious about the solids who have come from the other side. They withdraw without hostility. For now, the Dominion watches."
 cp26_bajoran_wormhole.311.ok:0 "A fragile peace, but peace nonetheless."

 cp26_bajoran_wormhole.320.name:0 "Confrontation in the Gamma Quadrant"
 cp26_bajoran_wormhole.320.desc:0 "Our fleet emerges through the wormhole in full combat posture. The Jem'Hadar vessels that had been shadowing our approach immediately move to intercept. Their targeting systems are locked. Command must act."
 cp26_bajoran_wormhole.320.a:0 "Press the engagement."
 cp26_bajoran_wormhole.320.b:0 "Stand down and withdraw."

 cp26_bajoran_wormhole.321.name:0 "Dominion Retaliation"
 cp26_bajoran_wormhole.321.desc:0 "Our vessels forced a retreat - but the Dominion does not forget. Intelligence reports confirm a Jem'Hadar strike force has emerged from the Bajoran Wormhole and is operating in the Bajoran system. The Dominion is not content to remain in the Gamma Quadrant."
 cp26_bajoran_wormhole.321.ok:0 "Prepare all defensive positions."

 cp26_bajoran_wormhole.322.name:0 "Withdrawal Noted"
 cp26_bajoran_wormhole.322.desc:0 "Our vessels stood down before combat could begin. The Jem'Hadar hold position at the wormhole exit but do not pursue. A brief transmission is received: §I\"The Founders will be watching.\"§!"
 cp26_bajoran_wormhole.322.ok:0 "Understood. Maintain alert status."

 # --- Wormhole Discovery Arc ---
 CP26_WORMHOLE_SURVEY:0 "Denorios Belt: Neutrino Investigation"
 CP26_WORMHOLE_SURVEY_DESC:0 "Station a science vessel with a scientist at the anomaly site in the Denorios Belt. The neutrino disturbances are extraordinary - and may indicate something far greater than a simple stellar phenomenon."

 cp26_bajoran_wormhole.12.name:0 "Denorios Belt - Anomalous Readings"
 cp26_bajoran_wormhole.12.desc:0 "A fleet entering the Bajoran system has detected unusual neutrino disturbances within the Denorios Belt. The source is unclear, but the readings are unlike anything previously recorded.\n\nA scientific survey mission is recommended. Station a science vessel with a scientist aboard at the anomaly site to begin investigation."
 cp26_bajoran_wormhole.12.ok:0 "Dispatch a science vessel."

 cp26_bajoran_wormhole.21.name:0 "2369 - The Denorios Anomaly Intensifies"
 cp26_bajoran_wormhole.21.desc:0 "Scientific monitors have recorded a sharp increase in neutrino emissions from the Denorios Belt. The readings defy all known stellar models.\n\nThe Bajoran Science Ministry has classified this a priority investigation. A survey mission has been authorized - station a science vessel with a scientist at the anomaly site in the Bajoran system."
 cp26_bajoran_wormhole.21.ok:0 "Dispatch the survey team immediately."
 cp26_minor_mission.ai_fallback:0 "Acknowledge the report."
 cp26_minor_mission.ai_fallback.tt:0 "AI fallback option for mission events without a major-power-specific response."

 tech_warp_speed_increase_3:0 "Transwarp Geometry"
 tech_warp_speed_increase_3_desc:0 "By mapping space-time curvature along established warp corridors, our navigational systems can exploit natural subspace geometries to achieve §Htranswarp-tier velocities§! -- the final frontier of conventional warp propulsion."

