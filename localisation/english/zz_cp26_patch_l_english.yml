 # CP26 major empire personalities
 personality_cp26_starfleet_command:0 "Starfleet Command"
 personality_cp26_starfleet_command_desc:0 "The United Federation of Planets pursues peace through exploration and diplomacy, but stands firm against any threat to its members. Starfleet does not run."
 personality_cp26_klingon_honor_guard:0 "Klingon Honor Guard"
 personality_cp26_klingon_honor_guard_desc:0 "War is the highest calling. The Empire seeks glory in battle, forges bonds through honor, and has no use for those who would sue for peace from weakness."
 personality_cp26_tal_shiar_doctrine:0 "Tal Shiar Doctrine"
 personality_cp26_tal_shiar_doctrine_desc:0 "Romulus does not share power. Every alliance is leverage, every treaty a delay. Intelligence is strength, and strength is survival."
 personality_cp26_central_command:0 "Central Command"
 personality_cp26_central_command_desc:0 "The Cardassian Union expands through military discipline and ruthless pragmatism. Weaker neighbors are resources to be administered, not allies to be courted."

 # Fleet Museum  -  Galaxy integration
 cp26_museum.1.name:0 "A Ship Worth Preserving"
 cp26_museum.1.desc:0 "The Enterprise-D has been decommissioned. She served the Federation for eight years and carried us through our darkest hours. The Fleet Museum at Veridian has a berth ready. Authorise the transfer and dispatch a construction team  -  it will cost 500 minerals, 100 dilithium and 50 influence to prepare the installation."
 cp26_museum.1.a:0 "Authorise the transfer. She belongs in history."
 cp26_museum.1.b:0 "We have more pressing concerns."

 # Fleet Museum  -  Sovereign integration
 cp26_museum.3.name:0 "A Second Legacy"
 cp26_museum.3.desc:0 "The Enterprise-E has been relieved of active duty. She fought at the Battle of Sector 001, stopped the Borg, and carried the Federation through the Dominion War. Authorise the installation  -  500 minerals, 100 dilithium and 50 influence to secure her place beside the Enterprise-D."
 cp26_museum.3.a:0 "Authorise the installation. She earned her place."
 cp26_museum.3.b:0 "Not now."

