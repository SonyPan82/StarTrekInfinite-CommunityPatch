 lunar_one_colony:0 "Lunar One Colony"
 lunar_one_colony_desc:0 "Lunar One is the first deep-space research outpost humanity built on its own moon - a cradle of zero-g science that still draws the Federation's most curious minds."
 tech_ambassador:0 "Ambassador Schematics"
 tech_ambassador_desc:0 "Ambassador-class explorers are capable of operating without support in a variety of mission scenarios."
 tech_constellation:0 "Constellation Schematics"
 tech_constellation_desc:0 "Constellation-class starships are versatile older Federation explorers."
 tech_lantree:0 "Lantree Schematics"
 tech_lantree_desc:0 "Small Federation utility ships that can be produced quickly."
 tech_neworleans:0 "New Orleans Schematics"
 tech_neworleans_desc:0 "New Orleans-class warships are medium support cruisers suited to fleet operations."
 tech_akira:0 "Akira Schematics"
 tech_akira_desc:0 "Akira-class starships are powerful multi-role heavy cruisers."
 tech_luna:0 "Luna Schematics"
 tech_luna_desc:0 "Luna-class starships are advanced long-range explorers designed for scientific missions and independent deep-space operations."
 tech_odyssey:0 "Odyssey Schematics"
 tech_odyssey_desc:0 "Odyssey-class starships are Federation flagships built for command, sustained fleet action, and deep-space force projection."
 tech_california_unlock:0 "California Schematics"
 tech_california_unlock_desc:0 "Unlocks the §HCalifornia§! class - a new dedicated science support ship for Starfleet. Lightly armed, it focuses on second contact, survey assistance, and extended operations beyond the core frontier."
 tech_cp26_california_unlock:0 "California Schematics"
 tech_cp26_california_unlock_desc:0 "Unlocks the §HCalifornia§! class - a new dedicated science support ship for Starfleet. Lightly armed, it focuses on second contact, survey assistance, and extended operations beyond the core frontier."
