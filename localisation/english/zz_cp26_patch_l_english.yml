 CP26_BAJOR_OP_FAIL_TT:0 "The intervention window has closed. The opportunity is lost."
 CP26_BAJOR_TROOPS_SUCCESS_TT:0 "The troop transport has reached Bajor. The garrison is reinforced."
 CP26_BAJOR_TROOPS_FAIL_TT:0 "The transport did not arrive in time. Unrest breaks out on the surface."

 # Bajor Liberation  -  autonomous resolution (cp26_bajor.33/.34)
 cp26_bajor.33.name:0 "Bajor: The Resistance Has Prevailed"
 cp26_bajor.33.desc:0 "Without outside intervention, the Bajoran resistance cells finally overwhelmed the Cardassian garrison. Bajor is free — at great cost. The last Cardassians on the surface have been killed or expelled. The Bajoran Council claims independence."
 cp26_bajor.33.a:0 "A people who refuse to be enslaved will always find a way to be free."
 cp26_bajor.34.name:0 "Bajor: Cardassia Has Crushed the Rebellion"
 cp26_bajor.34.desc:0 "The Cardassian garrison, reinforced from within, has broken the Bajoran uprising. The resistance has been decapitated. Bajor remains under occupation — but the suppression has left deep scars on the population and infrastructure."
 cp26_bajor.34.a:0 "The resistance will survive. It always does."

