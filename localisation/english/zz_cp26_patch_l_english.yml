 cp26_ban_a500:0 "Ban Synthetic Workers"
 cp26_ban_a500_desc:0 "In the wake of the Utopia Planitia incident, the Federation Council has passed a resolution prohibiting further deployment of A500 synthetic units. All existing installations are immediately decommissioned.\n\n§YThis action is permanent and cannot be reversed.§!"

