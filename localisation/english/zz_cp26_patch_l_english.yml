 cp26_merc_fleet_tt_small:0 "The mercenary flotilla will be a compact task force sized for empires with modest fleet command capacity."
 cp26_merc_fleet_tt_medium:0 "The mercenary flotilla will be a medium task force sized to match solid fleet command capacity."
 cp26_merc_fleet_tt_large:0 "The mercenary flotilla will be the largest package your fleet command capacity can reasonably absorb."

district_remus:0 "Reman Mining Camp"
district_remus_desc:0 "Mining camps built around Remus' harsh mineral-rich terrain."
district_generator_ferengi:0 "Energy Exchange"
district_generator_ferengi_desc:0 "A Ferengi district of energy distribution, contracts, and exchange houses."
district_mining_ferengi:0 "Acquisition Consortium"
district_mining_ferengi_desc:0 "A Ferengi mining district organized around extraction rights and profit."
district_farming_ferengi:0 "Provision Market"
district_farming_ferengi_desc:0 "A Ferengi agricultural district where food production is routed through trade."
action.13.a.ferengi:0 "Open negotiations."
 country.2801.ferengi.desc:0 "Every crisis is also a market correction. While the great powers scramble to control the narrative around Khitomer, we will count the costs, protect our interests, and ensure Ferengi commerce survives the turmoil."
 country.2801.e:0 "Protect our interests."
 country.2801.e.tt:0 "Profit favors those who stay focused while everyone else panics.\n\n"
 hrb_colony.12.e:0 "Secure the survivors and assess the losses."
 hrb_colony.12.e.tt:0 "We will protect any remaining assets, stabilize the colony, and determine whether this tragedy can still be turned into an opportunity."
 hrb_colony.31.c:0 "Re-establish contact and evaluate the opportunity."
 hrb_colony.82.e:0 "If it talks, it may sell."
 hrb_planet_modifier.15.e:0 "Exploit the energy potential."
 hrb_planet_modifier.15.e.tt:0 "A disciplined commercial effort can turn this unstable environment into a valuable long-term asset."
 anomaly.7507.ferengi.desc:0 "Even in ruin, a forgotten settlement can still be valuable. Salvage, trade goods, and supplies all have their price."
 anomaly.7507.e:0 "Recover everything of value."
 anomaly.7507.e.tt:0 "Strip the site for supplies, provisions, and marketable goods."
 anomaly.7627.ferengi.desc:0 "Allies, rivals, and opportunists circle every worthwhile venture. The key is not trust, but leverage."
 anomaly.7627.e:0 "Turn the situation into an arrangement."
 anomaly.7627.e.tt:0 "We will profit from this encounter by ensuring every favor has a price."
 pre_warp_civ.11.e:0 "Another market will one day open."
 pre_warp_civ.11.e.tt:0 "Their future matters because future customers, clients, and debtors matter."
 district_remans_living:0 "Reman Living Quarters"
 district_remans_living_desc:0 "Dense living quarters for Reman workers and their families."
 soldier_camp_remus:0 "Romulan Quarters"
 soldier_camp_remus_desc:0 "Administrative and military quarters used to govern the Reman population."
 district_labor_camp_breen:0 "Labour Zone"
 district_labor_camp_breen_desc:0 "Hard labor under hard rule."
 district_civil_forum_breen:0 "Government Zone"
 district_civil_forum_breen_desc:0 "A labyrinth of agencies, bureaus, offices and administration."
 district_gorn_hunting:0 "Breeding Grounds"
 district_gorn_hunting_desc:0 "Gorn do not farm. Gorn hunt. Gorn breed."
 district_orion_market:0 "Market District"
 district_orion_market_desc:0 "A center of thriving commerce and trade."
 district_city_tholian:0 "Directive Hub"
 district_city_tholian_desc:0 "A sub-assembly dedicated to empowering the One That Rules."

 cp26_fleet_museum:0 "Fleet Museum"
 cp26_fleet_museum_DESC:0 "A preserved museum station showcasing historic Starfleet vessels, including the NX-01."
 cp26_fleet_museum_MEGASTRUCTURE_DETAILS:0 "A preserved museum station showcasing historic Starfleet vessels, including the NX-01."
 cp26_fleet_museum_stage2:0 "Fleet Museum"
 cp26_fleet_museum_stage2_DESC:0 "The Enterprise-D, Galaxy class, has joined the museum collection. Her iconic silhouette now dominates the station's main ring."
 cp26_fleet_museum_stage2_MEGASTRUCTURE_DETAILS:0 "The Enterprise-D, Galaxy class, has joined the museum collection. Her iconic silhouette now dominates the station's main ring."
 cp26_fleet_museum_stage3:0 "Fleet Museum"
 cp26_fleet_museum_stage3_DESC:0 "The Enterprise-E, Sovereign class, completes the collection. The museum now houses a century and a half of Starfleet history, from the NX-01 to the Federation flagship."
 cp26_fleet_museum_stage3_MEGASTRUCTURE_DETAILS:0 "The Enterprise-E, Sovereign class, completes the collection. The museum now houses a century and a half of Starfleet history, from the NX-01 to the Federation flagship."
 qt_ufop_upgrade_enterprise_odyssey:0 "Enterprise Refit Odyssey Class"
 qt_ufop_upgrade_enterprise_odyssey_desc:0 "The lessons of decades of exploration and conflict have led Starfleet's engineers to their most ambitious refit yet. The Enterprise will be upgraded to the Odyssey class  -  the largest and most capable vessel in the fleet."
 UPGRADE_ENTERPRISE_ODYSSEY:0 "Enterprise Odyssey Refit"
 UPGRADE_ENTERPRISE_ODYSSEY_DESC:0 "Starfleet engineers stand ready to carry out the most ambitious refit in the Enterprise's history. This will require 5,000 alloys and 20 dilithium crystals."
 cp26_enterprise_odyssey.1.name:0 "Refit Authorised"
 cp26_enterprise_odyssey.1.desc:0 "Starfleet Engineering Command has reviewed the plans and cleared the Enterprise for an Odyssey-class refit. The work will begin immediately at Utopia Planitia."
 cp26_enterprise_odyssey.2.name:0 "Enterprise-F Commissioned"
 cp26_enterprise_odyssey.2.desc:0 "The refit is complete. The Enterprise has emerged from drydock as an Odyssey-class vessel  -  the pride of the fleet and the most powerful ship Starfleet has ever launched."
 cp26_enterprise_odyssey.2.a:0 "She's magnificent."
 cp26_enterprise_odyssey.2.a.tt:0 "The Enterprise is now an Odyssey-class vessel."
 NAME_Enterprise_Odyssey:0 "U.S.S. Enterprise"
 tech_cp26_daystrom_institute:0 "Daystrom Institute"
 tech_cp26_daystrom_institute_desc:0 "The Federation can establish the Daystrom Institute, a premier center for scientific research and development. Unlocks construction of the Daystrom Station megastructure."
 ALLOW_CP26_DAYSTROM_INSTITUTE:0 "§HUnlocks Federal Megastructure:§! $cp26_daystrom_station$"
 cp26_daystrom_station:0 "Daystrom Station"
 cp26_daystrom_station_DESC:0 "An orbital research station operated by the Daystrom Institute, pushing the boundaries of Federation science across all disciplines."
 cp26_daystrom_station_MEGASTRUCTURE_DETAILS:0 "The station's research divisions work in concert across physics, engineering and social sciences, increasing the research output of the entire Federation."
 cp26_daystrom_requires_planet_or_moon:0 "Must be placed in orbit of a planet or moon"
 cp26_daystrom_requires_ufop_system:0 "Must be placed in a system owned by the Federation"
 cp26_daystrom_requires_no_megastructure:0 "This body already hosts a megastructure"
 tech_cp26_ufop_fleet_museum:0 "Fleet Museum Charter"
 tech_cp26_ufop_fleet_museum_desc:0 "Starfleet can formalize the preservation of its historic vessels and establish a unique orbital museum dedicated to the Federation's heritage."
 ALLOW_CP26_FLEET_MUSEUM:0 "§HUnlocks Federal Megastructure:§! $cp26_fleet_museum$"
 cp26_ufop_sector_governance_charter:0 "Sector Governance Charter"
 cp26_ufop_sector_governance_charter_desc:0 "Baseline federal administration for a multi-sector United Federation of Planets, easing early empire sprawl without replacing member-world bureaucracy."
 cp26_ufop_federal_power_bootstrap:0 "Federal Grid Stabilization"
 cp26_ufop_federal_power_bootstrap_desc:0 "Temporary accounting and distribution relief while core worlds and starbase logistics catch up after the 2346 fiscal close. Improves empire-wide energy output for several years."
 cp26_ufop_federal_energy_grid:0 "Federal Energy Grid"
 cp26_ufop_federal_energy_grid_desc:0 "The founding worlds temporarily pool distribution networks, antimatter reserves, and industrial contracts to stabilize the Federation energy economy during the starting transition."

 cp26_options.1.name:0 "Community Patch 2026 - campaign setup"
 cp26_options.1.desc:0 "§HThese settings last for this entire save.§!\n\nEach button shows the §Hcurrent§! state. Click to toggle it.\n\n§HSupernova§!: option to disable the Supernova quest.\n§HBajor Liberation§!: the liberation of Bajor is scripted and requires specific choices.\n§HSynth Project§!: offers gameplay for the Federation and Romulans, inspired by Star Trek: Picard."
