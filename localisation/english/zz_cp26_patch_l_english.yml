 # CP26 - Mission: Diplomatic Colony Visit
 DIPLOMATIC_COLONY_ESCORT:0 "Diplomatic Visit"
 DIPLOMATIC_COLONY_ESCORT_DESC:0 "A dignitary from §H[minor_state_event_country.GetName]§! wishes to visit one of our colonies for diplomatic exchange."
 mission.221.name:0 "Diplomatic Visit"
 mission.221.desc:0 "A dignitary from §H[minor_state_event_country.GetName]§! wishes to travel to our territory for an official diplomatic visit. Their delegation requests a security escort for the duration of the journey."
 mission.221.a:0 "We will escort them."
 mission.221.a.tt:0 "We will provide a science escort to the colony."
 mission.221.b:0 "We cannot accommodate this request."
 mission.221.b.tt:0 "We politely decline the request."
 mission.222.name:0 "Visit Completed"
 mission.222.desc:0 "The delegation from §H[minor_state_event_country.GetName]§! arrived safely. The diplomatic exchange proceeded without incident and has strengthened the bonds between our peoples."
 mission.222.a:0 "It was our honor."
 mission.222.a.tt:0 "The Federation is always glad to welcome its neighbors."
 mission.222.b:0 "Honorable."
 mission.222.b.tt:0 "They proved their worth."
 mission.222.c:0 "Naturally."
 mission.222.c.tt:0 "We expected nothing less."
 mission.222.d:0 "The Union takes note."
 mission.222.d.tt:0 "This relationship may prove useful."
 mission.223.name:0 "Visit Cancelled"
 mission.223.ufop.desc:0 "The diplomatic visit from §H[minor_state_event_country.GetName]§! could not take place. We extend our apologies and hope for another opportunity."
 mission.223.klingon.desc:0 "The delegation from §H[minor_state_event_country.GetName]§! never arrived. A weakness we will remember."
 mission.223.romulan.desc:0 "The visit did not take place. §H[minor_state_event_country.GetName]§! will draw their own conclusions."
 mission.223.cardassian.desc:0 "The failure of this visit will have consequences for our relations with §H[minor_state_event_country.GetName]§!."
 mission.223.a:0 "Our regrets."

