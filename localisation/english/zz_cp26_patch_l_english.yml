 cp26_options.1.name:0 "Community Patch 2026 — campaign setup"
 cp26_options.1.desc:0 "§HThese settings last for this entire save.§!\n\nEach button shows the §Hcurrent§! state. Click to toggle it.\n\n§HDominion arc§!: experimental CP26 content, off by default.\n\n§HSupernova§!: UFOP Hobus / Starburst quest, blocked by default."
 cp26_options.1.pirates_on:0 "Pirates: §Genabled§!"
 cp26_options.1.pirates_on.tt:0 "Click to disable the Nausicaan pirate crisis for this campaign."
 cp26_options.1.pirates_off:0 "Pirates: §Rdisabled§!"
 cp26_options.1.pirates_off.tt:0 "Click to re-enable the Nausicaan pirate crisis for this campaign."
 cp26_options.1.vassalization_on:0 "Diplomatic vassalization: §Genabled§!"
 cp26_options.1.vassalization_on.tt:0 "Click to disable CP26 vassalization proposals for this campaign."
 cp26_options.1.vassalization_off:0 "Diplomatic vassalization: §Rdisabled§!"
 cp26_options.1.vassalization_off.tt:0 "Click to re-enable CP26 vassalization proposals for this campaign."
 cp26_options.1.dominion_arc_on:0 "TESTING — Dominion arc: §GON§!"
 cp26_options.1.dominion_arc_on.tt:0 "§HCurrent§!: Dominion arc is §Gon§! (experimental CP26 content may run).\n\n§YClick§! to turn it §Roff§! for this whole save (ticker + Dominion special projects stop).\n\n§YTESTING§! Balance and scripts change often — use a throwaway save if you enable this."
 cp26_options.1.dominion_arc_off:0 "TESTING — Dominion arc: §ROFF§!"
 cp26_options.1.dominion_arc_off.tt:0 "§HCurrent§!: Dominion arc is §Roff§! (safe default).\n\n§YClick§! to turn it §Gon§! for this whole save (wormhole-side arc allowed when lore catches up).\n\n§YTESTING§! Expect rough edges; prefer off for serious campaigns."
 cp26_options.1.supernova_quest_on:0 "Supernova quest: §Gallowed (can happen)§!"
 cp26_options.1.supernova_quest_on.tt:0 "§HCurrent§!: UFOP Supernova / Hobus branch is §Gnot blocked§! — it §Gmay play§! when the quest tree unlocks it.\n\n§YClick§! to §Rblock§! it for this entire save (the storyline will §Rnot§! happen)."
 cp26_options.1.supernova_quest_off:0 "Supernova quest: §Rblocked (will not happen)§!"
 cp26_options.1.supernova_quest_off.tt:0 "§HCurrent§!: Supernova quest line is §Rblocked§! for this save.\n\n§YClick§! to §Gallow§! it again (it can fire later when the tree is ready)."
