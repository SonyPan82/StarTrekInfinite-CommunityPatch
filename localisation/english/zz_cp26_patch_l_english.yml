 CP26_BAJORAN_WORMHOLE_INVESTIGATION:0 "Investigate the Bajoran Wormhole"
 CP26_BAJORAN_WORMHOLE_INVESTIGATION_DESC:0 "Subspace readings from Denorios reveal a stable but invisible anomaly. A science ship led by a scientist must analyze the phenomenon before a passage can be confirmed."
 cp26_bajoran_wormhole.120.name:0 "Denorios Subspace Anomaly"
 cp26_bajoran_wormhole.120.desc:0 "Readings from Denorios match a stable distortion unlike anything previously recorded. A dedicated scientific investigation could reveal a natural passage into an unknown region of the galaxy. Do you want to launch a focused study?"
 cp26_bajoran_wormhole.120.ok:0 "Yes, open the investigation."
 cp26_bajoran_wormhole.120.no:0 "Not right now."
 cp26_bajoran_wormhole.2.name:0 "Bajoran Wormhole Detected"
 cp26_bajoran_wormhole.2.desc:0 "Congratulations. Our scientists have completed the Bajoran Wormhole investigation and confirmed a stable passage to the Gamma Quadrant. The route is now open."
 cp26_bajoran_wormhole.2.ok:0 "Set course for Idran."
 cp26_bajoran_wormhole.901.name:0 "Passage to the Gamma Quadrant"
 cp26_bajoran_wormhole.901.desc:0 "Congratulations. Our scientists have completed the Bajoran Wormhole investigation and confirmed a stable passage to the Gamma Quadrant. The route is now open."
 cp26_bajoran_wormhole.901.ok:0 "Set course for Idran."
