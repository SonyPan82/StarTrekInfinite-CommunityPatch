 CP26_BAJOR_FERENGI_CARD:0 "Delivery to the Cardassian Garrison"
 CP26_BAJOR_FERENGI_CARD_DESC:0 "Dispatch a vessel to the Cardassian position before the contract window expires."
 CP26_BAJOR_FERENGI_BOTH_BAJOR:0 "Delivery to the Bajoran Resistance"
 CP26_BAJOR_FERENGI_BOTH_BAJOR_DESC:0 "First leg of the dual delivery: route cargo to the Bajor system."
 CP26_BAJOR_FERENGI_BOTH_CARD:0 "Delivery to Cardassia"
 CP26_BAJOR_FERENGI_BOTH_CARD_DESC:0 "Second leg of the dual delivery: route cargo to the Cardassian position."
