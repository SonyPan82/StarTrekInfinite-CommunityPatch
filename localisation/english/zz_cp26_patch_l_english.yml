 # Bajor Liberation  -  shared title
 cp26_bajor.title:0 "The Liberation of Bajor"

 # Bajor Liberation  -  Journal objective (legacy, unused)
 cp26_bajor_obj_fleet:0 "Deploy a ship to the Bajor system"

 # Bajor Liberation  -  Federation (cp26_bajor.1)
 cp26_bajor.1.desc:0 "Intelligence reports confirm what we feared. Bajoran resistance cells have launched a coordinated uprising against the Cardassian Occupation. The situation on Bajor is deteriorating rapidly  -  civilian casualties mount by the hour. The Federation Council looks to us. How does Starfleet respond?"
 cp26_bajor.1.a:0 "Non-intervention. This is an internal Cardassian matter."
 cp26_bajor.1.b:0 "Dispatch a Starfleet task force. Free Bajor."
 cp26_bajor.1.c:0 "Send a humanitarian convoy  -  1,000 tonnes of emergency food supplies."
 cp26_bajor.1.b.tt:0 "Order a Starfleet fleet to the Bajor system. The objective will appear in the situation log  -  once your ships are in position, liberation triggers automatically."
 cp26_bajor.1.c.tt:0 "Send a Federation ship to the Bajor system to deliver the aid. The objective will appear in the situation log  -  once in position, the convoy tips the balance and triggers resolution automatically."

 # Bajor Liberation  -  Cardassian Union (cp26_bajor.2)
 cp26_bajor.2.desc:0 "The Bajoran resistance has become an open rebellion. Prefect Dukat's garrison is holding  -  barely. Central Command demands a response before the situation spirals beyond control. The honour of the Union and control of one of our most strategic acquisitions is at stake."
 cp26_bajor.2.a:0 "Crush the rebellion. Reinforce the garrisons and restore order by any means."
 cp26_bajor.2.b:0 "Reinforce the occupation. More troops, more patrols, total lockdown."
 cp26_bajor.2.c:0 "A strategic withdrawal. Bajor is more trouble than it is worth."
 cp26_bajor.2.a.tt:0 "Build armies and send a troop transport to the Bajor system. The objective will appear in the situation log  -  once your forces have landed on Bajor, the crackdown will begin."
 cp26_bajor.2.b.tt:0 "Build armies and send a troop transport to the Bajor system. The objective will appear in the situation log  -  once your forces have landed, the military lockdown will take effect."
 cp26_bajor.2.c.tt:0 "Withdrawing will be seen as weakness but will end the drain on our forces. Bajor will be liberated."

 # Bajor Liberation  -  Klingon Empire (cp26_bajor.3)
 cp26_bajor.3.desc:0 "The Bajorans have risen against their Cardassian occupiers. Warriors who resist slavery deserve to be called warriors. The Empire watches  -  and an opportunity presents itself. Do we act, or sharpen our blades for the right moment?"
 cp26_bajor.3.a:0 "Send weapons and warriors to Bajor. Honor demands it."
 cp26_bajor.3.b:0 "The Cardassians are weakened. Strike now and seize the advantage."
 cp26_bajor.3.c:0 "This conflict does not concern the Empire."
 cp26_bajor.3.a.tt:0 "Send a Klingon fleet to the Bajor system. The objective will appear in the situation log  -  once your ships are in position, liberation triggers automatically."
 cp26_bajor.3.b.tt:0 "A casus belli against the Cardassian Union while their forces are stretched thin."

 # Bajor Liberation  -  Romulan Star Empire (cp26_bajor.4)
 cp26_bajor.4.desc:0 "Bajor burns. Cardassian forces are committed, their attention elsewhere. The Tal Shiar identifies three avenues of exploitation. Emotion is not a Romulan luxury  -  only opportunity."
 cp26_bajor.4.a:0 "Provide covert support to the rebels. Destabilise Cardassian control."
 cp26_bajor.4.b:0 "Observe. Let both sides exhaust themselves."
 cp26_bajor.4.c:0 "Intervene openly. Romulus sides with Bajor."
 cp26_bajor.4.a.tt:0 "Send a spy ship to the Bajor system. Once in position, Romulan agents destabilise the garrison  -  the Bajoran resistance erupts and Bajor is liberated, with some sabotage damage."
 cp26_bajor.4.b.tt:0 "Observe the conflict without intervening. No immediate benefit."
 cp26_bajor.4.c.tt:0 "Send a Romulan fleet to the Bajor system. The objective will appear in the situation log  -  once your ships are in position, liberation triggers automatically."

 # Bajor Liberation  -  Ferengi Alliance (cp26_bajor.5)
 cp26_bajor.5.desc:0 "A war is a market. The Bajorans fight with whatever they can scavenge; the Cardassians bleed latinum to hold a planet that grows harder to hold by the day. Both sides need supplies. Rule of Acquisition 34: War is good for business. The only question is which side  -  or both?"
 cp26_bajor.5.a:0 "Sell weapons and supplies to the Bajorans."
 cp26_bajor.5.b:0 "Supply the Cardassian garrison. A stable client is a reliable client."
 cp26_bajor.5.c:0 "Sell to both sides. Profit has no flag."
 cp26_bajor.5.a.tt:0 "Send a Ferengi ship to the Bajor system to deliver the weapons. The objective will appear in the situation log  -  once in position, liberation triggers automatically."
 cp26_bajor.5.b.tt:0 "Send a ship to the Bajor system to deliver weapons to the Cardassian garrison. The objective will appear in the situation log  -  once delivered, the occupation is reinforced. Bajor remains Cardassian."
 cp26_bajor.5.c.tt:0 "Send one ship to the Bajor system AND one to Cardassian space. Both sides armed, both sides fighting  -  Bajor will be liberated but with collateral damage (30% devastation)."

 # Bajor Liberation  -  decisions (action button)
 cp26_bajor_confirm_action:0 "Trigger the Bajor Operation"
 cp26_bajor_confirm_action_desc:0 "Your forces are in position in the Bajor system. Give the final order to trigger the operation."
 cp26_bajor_confirm_cardassia_delivery:0 "Confirm Delivery to the Garrison"
 cp26_bajor_confirm_cardassia_delivery_desc:0 "Your ship is in position. Confirm delivery of weapons and supplies to the Cardassian garrison on Bajor."
 cp26_bajor_confirm_both_delivery:0 "Confirm Both Deliveries"
 cp26_bajor_confirm_both_delivery_desc:0 "Both your ships are in position. Confirm simultaneous deliveries to the Bajorans and the Cardassians."
 cp26_bajor_confirm_troops:0 "Disembark Troops on Bajor"
 cp26_bajor_confirm_troops_desc:0 "Your transport is in position. Give the order to disembark and reinforce the garrison to crush the rebellion."
 cp26_bajor_decision_no_fleet:0 "No ship detected in the Bajor system."
 cp26_bajor_decision_no_fleet_bajor:0 "No ship detected in the Bajor system."
 cp26_bajor_decision_no_fleet_card:0 "No ship detected in Cardassian space (outside Bajor)."

 # Bajor Liberation  -  planet modifier names
 cp26_bajor_suppressed_garrison:0 "Cardassian Suppression Garrison"
 cp26_bajor_suppressed_garrison_desc:0 "Cardassian military forces have imposed a brutal crackdown on the population. Resistance is punished severely, civilian movement is restricted, and the planet's workforce operates under constant duress."
 cp26_bajor_romulan_sabotage:0 "Romulan Covert Operations"
 cp26_bajor_romulan_sabotage_desc:0 "Romulan agents operate in the shadows, disrupting Cardassian supply lines, disabling communications relays, and inciting unrest among the occupation forces."

 # Bajor Liberation  -  post-liberation modifiers
 cp26_bajor_fed_liberation:0 "Liberated by Starfleet"
 cp26_bajor_fed_liberation_desc:0 "Starfleet's military intervention secured Bajor's freedom. The Federation presence has restored order and stability to the planet."
 cp26_bajor_humanitarian_relief:0 "Federation Humanitarian Aid"
 cp26_bajor_humanitarian_relief_desc:0 "A Federation aid convoy tipped the balance, forcing the Cardassian withdrawal. Emergency food supplies have stabilised the population and accelerated recovery."
 cp26_bajor_klingon_honor:0 "Klingon Honor Pact"
 cp26_bajor_klingon_honor_desc:0 "Klingon warriors fought alongside the Bajoran resistance to drive out the Cardassians. This act of honour has inspired Bajor's defenders and strengthened their military capabilities."
 cp26_bajor_romulan_influence:0 "Romulan Intelligence Network"
 cp26_bajor_romulan_influence_desc:0 "The Romulan Star Empire's official intervention came with tacit technology and intelligence sharing, accelerating Bajoran research programs."
 cp26_bajor_ferengi_trade:0 "Ferengi Arms Deal"
 cp26_bajor_ferengi_trade_desc:0 "Ferengi weapons shipments tipped the balance of the conflict. In return, Bajor is now bound to a trade agreement with the Ferengi Alliance, stimulating the local economy."
 cp26_bajor_ferengi_card_supply:0 "Ferengi Supply  -  Cardassian Garrison"
 cp26_bajor_ferengi_card_supply_desc:0 "Ferengi supplies and weapons have bolstered the Cardassian garrison on Bajor. The Bajoran resistance is contained but social tensions continue to mount."

 # Bajor Liberation  -  resolution event (cp26_bajor.10)
 cp26_bajor.10.name:0 "Liberation of Bajor"
 cp26_bajor.10.desc:0 "The Cardassian occupation has ended. Bajor is free. The Bajoran people now take their destiny into their own hands — the withdrawal of Cardassian forces marks the beginning of a new era for this ancient world."
 cp26_bajor.10.a:0 "Bajor is free."

