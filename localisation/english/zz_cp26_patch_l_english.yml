 cp26_minor_mission.16.name:0 "Rescue Mission Complete"
 cp26_minor_mission.16.desc:0 "The rescue operation succeeded and the situation has been resolved without further complication."
 cp26_minor_mission.16.a:0 "Good."
 cp26_minor_mission.16.a.tt:0 "The mission resolves successfully."
 cp26_minor_mission.75.name:0 "Rebellion Escalates"
 cp26_minor_mission.75.desc:0 "The situation has deteriorated and the mission ends in failure."
 cp26_minor_mission.75.a:0 "Understood."
