 NAME_FerengiTitan:0 "Ooron-class"
 tech_ferengi_dkora:0 "D'Kora Marauder"
 tech_ferengi_dkora_desc:0 "Ferengi captains standardize the D'Kora line as the first true long-range warship of the Alliance, blending cargo capacity, negotiation suites, and enough firepower to make every contract binding."
 tech_ferengi_nandi:0 "Nandi Cruiser"
 tech_ferengi_nandi_desc:0 "The Nandi pattern refines the Ferengi art of commercial warfare: a faster cruiser hull, heavier escorts, and enough internal volume to sustain profit-making operations far from Ferenginar."
 tech_ferengi_galleon:0 "Galin"
 tech_ferengi_galleon_desc:0 "By scaling their convoy doctrine into a true line combatant, the Ferengi commission the Zark galleon: a broad-hulled acquisition ship built to bully trade lanes and protect major investments."
 tech_ferengi_ooron:0 "Ooron Command Titan"
 tech_ferengi_ooron_desc:0 "When Ferengi trade networks mature into interstellar empires of profit, the Ooron becomes their ultimate guarantor: a mobile treasury-fortress designed to impose terms, deter rivals, and defend the Alliance's richest ventures."
