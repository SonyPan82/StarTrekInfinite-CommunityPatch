l_english:
 auth_dictatorial_ferengi:0 "Grand Nagus Council"
 auth_dictatorial_ferengi_desc:0 "The Ferengi Alliance is governed by the Grand Nagus, chosen by the Council of Economic Advisors. Trade and profit guide all decisions of state."
 civic_ferengi_rules_of_acquisition:0 "Rules of Acquisition"
 civic_ferengi_rules_of_acquisition_desc:0 "The 285 Rules of Acquisition form the sacred code of commerce that guides every Ferengi transaction and political decision."
 civic_ferengi_grand_nagus:0 "Grand Nagus Authority"
 civic_ferengi_grand_nagus_desc:0 "The Grand Nagus holds supreme commercial and political authority, keeping the population in line through economic incentives and the threat of audit."
