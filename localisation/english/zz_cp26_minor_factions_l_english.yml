l_english:
 cp26_minor_gorn_combat_doctrine: "Gorn Combat Doctrine"
 cp26_minor_gorn_combat_doctrine_desc: "Reptilian crews favor brute force over finesse — tough hulls, slow turns, low evasion."
 cp26_minor_tholian_combat_doctrine: "Tholian Combat Doctrine"
 cp26_minor_tholian_combat_doctrine_desc: "Crystalline ships built around superior energy shielding and rapid regeneration, but with thin structural hulls."
 cp26_minor_orion_combat_doctrine: "Orion Combat Doctrine"
 cp26_minor_orion_combat_doctrine_desc: "Pirate fleets trained for fast strikes — high rate of fire and evasion, but their armor crumbles under sustained fire."
 cp26_minor_breen_combat_doctrine: "Breen Combat Doctrine"
 cp26_minor_breen_combat_doctrine_desc: "Cold-forged hulls with heavy cryo plating and punishing armor-piercing volleys, fired at a deliberate cadence."
