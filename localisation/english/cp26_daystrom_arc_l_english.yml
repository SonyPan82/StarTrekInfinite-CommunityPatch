l_english:
 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "The Subspatial Incursion"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Subspatial Scar"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Incursion Swarm"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Rift Guard"
 cp26_daystrom.1.title:0 "Project Subspace Siphon"
 cp26_daystrom.1.desc:0 "For months, researchers at Daystrom Station have been circling the same uneasy conclusion: conventional reactors continue to improve, yet they are still drifting toward their theoretical limits. As our megastructures expand, our orbital yards multiply, and our scientific infrastructure grows ever more demanding, energy consumption is beginning to outpace our most reliable solutions.\n\nAgainst that backdrop, a joint team of subspace physicists and field engineers has submitted a proposal as elegant as it is alarming. Rather than generating ever more power from conventional systems, they suggest drawing it directly from the natural fluctuations of subspace itself.\n\nTheir simulations describe subspace as an unseen ocean threaded by immense, constant energy currents. No one has truly attempted to exploit them before. Not for lack of imagination, but because subspace remains one of the least understood practical domains in modern physics. It is not merely an energetic medium. It is also the foundation through which long-range communications and warp-field interactions are carried.\n\nIf the theory is correct, a Subspace Energy Collector could alter the Federation's future. It might provide a near-limitless source of power for megastructures, shipyards and research networks without dependence on conventional reactor output. Yet several members of the scientific board urge caution. Changing the balance of subspace itself could produce consequences no one is presently equipped to predict.\n\nDaystrom now requests authorization to proceed."
 cp26_daystrom.1.a:0 "Authorize the project."
 cp26_daystrom.1.b:0 "Limit the funding."
 cp26_daystrom.1.c:0 "Abandon this line of research."
 cp26_daystrom.2.title:0 "An Unexpected Success"
 cp26_daystrom.2.desc:0 "After months of uninterrupted work, endless recalibration, and carefully staged low-power trials, the first prototype of the Subspace Energy Collector has exceeded every expectation. The latest reports from Daystrom Station describe an extraction curve of unprecedented stability and efficiency, with no obvious large-scale disturbance yet observed.\n\nThe effect on the research teams has been immediate. Engineers are already speaking of an energy revolution. Some have gone further still, suggesting that the Federation may be standing at the threshold of an era in which megastructures, orbital shipyards and deep scientific networks are no longer constrained by conventional supply limits.\n\nPressure is mounting to expand the program at once, raise the collector's output, and transform a remarkable experiment into a historic breakthrough.\n\nAnd yet, the secondary sensor reports tell a quieter and far less comforting story. The most sensitive instruments around the station have begun registering faint oscillations in subspace. The fluctuations are minute, almost trivial when viewed in isolation, but they recur after every extraction cycle and grow slightly stronger each time.\n\nNo visible catastrophe. No open failure. Only an anomaly still too small to prove anything... and too regular to ignore."
 cp26_daystrom.2.desc_limited:0 "Even under tighter funding and a more cautious timetable, the first prototype has produced results few believed attainable. The collector is drawing stable energy at efficiencies well beyond initial estimates, and the teams at Daystrom are already arguing that the project now deserves broader support.\n\nAt the same time, however, the station's most sensitive instruments have detected weak oscillations in local subspace. The readings remain faint, almost easy to wave aside, yet they are becoming harder to explain with each repeated cycle."
 cp26_daystrom.2.a:0 "Increase the collector's output."
 cp26_daystrom.2.b:0 "Maintain the present test level."
 cp26_daystrom.2.c:0 "Suspend the experiments and study the anomalies."
 cp26_daystrom.3.title:0 "Something Is Responding"
 cp26_daystrom.3.desc:0 "The latest data from Daystrom has changed the nature of the debate entirely. The fluctuations no longer resemble a simple physical anomaly, nor even a technical instability caused by the prototype.\n\nThey now follow a pattern.\n\nNot a crude repetition, but a structure. A cadence. A response.\n\nSome researchers describe it as subspace attempting to restore its own equilibrium. Others, more unsettled still, argue that the pattern feels reactive, as though something beyond our instruments has begun to notice the strain we are placing upon it.\n\nThe secondary reports are worse. Energy signatures are appearing fractions of a second before the instruments meant to detect them are even activated. Several probes vanish from sensors for impossibly brief intervals before returning unharmed. One team claims to have recorded a temporal offset between signal emission and signal return that cannot be reconciled with any accepted model.\n\nDaystrom's theorists are no longer speaking only of extraction. They now argue that the collector is placing growing strain on the very structure of subspace itself.\n\nEven so, project leadership refuses to retreat. They insist that one final, tightly controlled test would settle the matter, prove the technology viable, and reveal the true nature of the anomalies.\n\nThe next decision may be decisive."
 cp26_daystrom.3.desc_suspended:0 "Even after the collector was throttled back, the anomalies did not disappear. They continued to evolve.\n\nThe patterns now seem almost deliberate, as though they anticipate our measurements or adjust themselves in response to observation. Multiple teams report impossible temporal offsets, negative delays, and readings that appear to exist before their own cause.\n\nAt Daystrom, the atmosphere has soured. Scientific disagreement has given way to a deeper fracture between absolute caution and intellectual obsession. Some demand a permanent shutdown before whatever has already been disturbed is pushed any further. Others argue that one final, carefully calibrated trial is the only remaining chance to understand what has been touched.\n\nThe Daystrom board is now profoundly divided."
 cp26_daystrom.3.a:0 "Proceed with the final test."
 cp26_daystrom.3.b:0 "Reduce power and continue only theoretical work."
 cp26_daystrom.3.c:0 "Shut the project down permanently."
 cp26_daystrom.4.title:0 "The Tear"
 cp26_daystrom.4.desc:0 "The opening seconds of the final test seem to justify every risk.\n\nOutput immediately exceeds all projections. Energy floods into the network at a level no one present had dared present in public forecasts. For one brief moment, the impossible appears within reach. Consoles blaze with impossible numbers. In laboratories across the station, some researchers begin to understand that they may be witnessing one of the greatest scientific turning points in Federation history.\n\nThen everything breaks.\n\nWithout warning, every measurement collapses into contradiction. Sensors begin to disagree with one another. Internal communications fail in rapid succession. Gravitational fields oscillate without pattern. Space itself around Daystrom Station seems to lose coherence.\n\nWitnesses report hull structures vibrating without impact, light bending along impossible angles, and corridors that feel longer than their own geometry should allow. At the heart of the installation, researchers watch in horror as a dark fracture forms where there should be only steel and vacuum. Instruments refuse to measure its depth. Readings return blank, saturated or absurd. The breach resembles no known natural phenomenon.\n\nThe station begins to come apart around it.\n\nThen come the signatures.\n\nUnknown warp signatures, clear and organized, emerging from the far side of the rift as though something had been waiting for the passage to open.\n\nWhat seemed to be an inexhaustible source of energy was never a reservoir.\n\nIt was a boundary.\n\nAnd we have just opened it."
 cp26_daystrom.100.title:0 "The Daystrom Breach"
 cp26_daystrom.100.desc:0 "A catastrophic failure at Daystrom Station has torn open a subspace rupture. The station is gone, the system has fallen into hostile hands, and an unknown power is now emerging through the breach."
