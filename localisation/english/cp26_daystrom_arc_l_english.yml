l_english:
 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "The Subspatial Incursion"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Subspatial Scar"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Incursion Swarm"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Rift Guard"
 cp26_daystrom.1.title:0 "Project Subspace Siphon"
 cp26_daystrom.1.desc:0 "For months, researchers at Daystrom Station have been converging on the same conclusion: despite continued improvements, conventional reactors are approaching their practical limits. As our megastructures, orbital yards, and scientific infrastructure expand, energy demand is beginning to outpace our most reliable solutions.\n\nA joint team of subspace physicists and field engineers now proposes something as brilliant as it is alarming: drawing power directly from the natural fluctuations of subspace itself.\n\nIf they are correct, a Subspace Energy Collector could transform the Federation's future. But several members of the scientific board warn that altering the balance of subspace could have consequences no one can predict.\n\nDaystrom now requests authorization to proceed."
 cp26_daystrom.1.a:0 "Authorize the project."
 cp26_daystrom.1.b:0 "Limit the funding."
 cp26_daystrom.1.c:0 "Abandon this line of research."
 cp26_daystrom.2.title:0 "An Unexpected Success"
 cp26_daystrom.2.desc:0 "After months of careful trials, the first prototype of the Subspace Energy Collector has exceeded every expectation. Reports from Daystrom describe unprecedented stability and efficiency, with no obvious large-scale disturbance.\n\nThe reaction among the research teams is immediate. Some are already speaking of an energy revolution, and pressure is mounting to raise the collector's output.\n\nYet the station's most sensitive instruments have also begun detecting faint oscillations in subspace. The fluctuations remain slight, but they recur after every extraction cycle and grow a little stronger each time.\n\nNo open catastrophe. Only an anomaly that is becoming harder to ignore."
 cp26_daystrom.2.desc_limited:0 "Even under tighter funding and a more cautious timetable, the first prototype has produced results few believed attainable. The collector is drawing stable energy at efficiencies well beyond initial estimates, and the teams at Daystrom are already arguing that the project now deserves broader support.\n\nAt the same time, however, the station's most sensitive instruments have detected weak oscillations in local subspace. The readings remain faint, almost easy to wave aside, yet they are becoming harder to explain with each repeated cycle."
 cp26_daystrom.2.a:0 "Increase the collector's output."
 cp26_daystrom.2.b:0 "Maintain the present test level."
 cp26_daystrom.2.c:0 "Suspend the experiments and study the anomalies."
 cp26_daystrom.3.title:0 "Something Is Responding"
 cp26_daystrom.3.desc:0 "The latest data from Daystrom has changed the debate entirely. The fluctuations no longer resemble a simple anomaly or a technical instability.\n\nThey now follow a pattern. Not a crude repetition, but a structure. A cadence. A response.\n\nThe secondary reports are worse: signatures appearing before sensors are activated, probes vanishing for fractions of a second, and temporal offsets that cannot be reconciled with accepted models.\n\nDaystrom's theorists now argue that the collector is placing growing strain on the structure of subspace itself.\n\nEven so, project leadership insists that one final test will settle the matter."
 cp26_daystrom.3.desc_suspended:0 "Even after the collector was throttled back, the anomalies did not disappear.\n\nThe patterns now seem almost deliberate, as though they anticipate our measurements. Multiple teams report impossible temporal offsets and readings that appear to exist before their own cause.\n\nAt Daystrom, scientific disagreement has hardened into a split between absolute caution and outright obsession. Some demand a permanent shutdown. Others insist that one final trial is the only way to understand what has been touched."
 cp26_daystrom.3.a:0 "Proceed with the final test."
 cp26_daystrom.3.b:0 "Reduce power and continue only theoretical work."
 cp26_daystrom.3.c:0 "Shut the project down permanently."
 cp26_daystrom.4.title:0 "The Tear"
 cp26_daystrom.4.desc:0 "The opening seconds of the final test seem to justify every risk.\n\nOutput immediately exceeds all projections. For one brief moment, the impossible appears within reach.\n\nThen everything breaks.\n\nMeasurements collapse into contradiction, communications fail, and space itself around Daystrom Station seems to lose coherence. At the heart of the installation, a dark fracture forms where there should be only steel and vacuum. Instruments refuse to measure its depth.\n\nThe station is ravaged, torn open by the breach.\n\nThen come the signatures: unknown warp signatures, clear and organized, emerging from the far side of the rift.\n\nWhat seemed to be an inexhaustible source of energy was never a reservoir.\n\nIt was a boundary.\n\nAnd we have just opened it."
 cp26_daystrom.5.title:0 "Transmission from the Rift"
 cp26_daystrom.5.desc:0 "The signal claws its way through our channels in a storm of static before finally stabilizing.\n\n\"You struck our domain without understanding it. Your experiments tore through our space, killed our own, and forced open a passage that should never have existed.\n\nYou tried to destroy us.\n\nWe will answer in kind.\n\nWhoever you are, it changes nothing.\""
 cp26_daystrom.100.title:0 "The Daystrom Breach"
 cp26_daystrom.100.desc:0 "A catastrophic failure at Daystrom Station has torn open a subspace rupture. The station has been ravaged, the system has fallen into hostile hands, and an unknown power is now emerging through the breach."
