l_english:
 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "The Subspatial Incursion"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Subspatial Scar"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Incursion Swarm"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Rift Guard"
 cp26_daystrom.1.title:0 "Project Subspace Siphon"
 cp26_daystrom.1.desc:0 "Researchers at Daystrom Station warn that conventional reactors are nearing their theoretical limits. A new team proposes a radical alternative: rather than generating power, they want to draw it directly from the natural fluctuations of subspace.\n\nTheir models suggest that immense energy currents move through subspace at all times. If they can be tapped safely, the Federation could support megastructures, shipyards and scientific networks without relying on ordinary reactor output.\n\nOther scientists urge caution. Subspace is not merely an energy medium. It also carries communications and warp-field interactions, and its equilibrium remains only partially understood."
 cp26_daystrom.1.a:0 "Authorize the project."
 cp26_daystrom.1.b:0 "Limit the funding."
 cp26_daystrom.1.c:0 "Abandon this line of research."
 cp26_daystrom.2.title:0 "An Unexpected Success"
 cp26_daystrom.2.desc:0 "Months of development have produced a prototype that exceeds every forecast. The collector extracts a stable stream of energy, and no obvious disturbance has yet been observed.\n\nEngineers speak openly of an energy revolution. There is already pressure to expand the program and push the collector to higher output.\n\nYet the most sensitive sensors around Daystrom Station have begun to detect minute oscillations in subspace. The fluctuations remain weak, but they increase with every extraction cycle."
 cp26_daystrom.2.desc_limited:0 "Despite the reduced budget, the first prototype performs far better than expected. The collector extracts stable energy, and the Daystrom teams are already arguing that the project deserves a larger mandate.\n\nAt the same time, ultra-fine sensor sweeps detect subtle oscillations in subspace around the station. The readings are faint, but they recur too regularly to dismiss."
 cp26_daystrom.2.a:0 "Increase the collector's output."
 cp26_daystrom.2.b:0 "Maintain the present test level."
 cp26_daystrom.2.c:0 "Suspend the experiments and study the anomalies."
 cp26_daystrom.3.title:0 "Something Is Responding"
 cp26_daystrom.3.desc:0 "The fluctuations no longer resemble a simple physical side effect. They now form repeating patterns, as if subspace itself were attempting to restore equilibrium... or reacting to our presence.\n\nTeams across Daystrom report impossible readings. Energy signatures appear before instruments are activated. Survey probes vanish from sensors for fractions of a second and return without damage. Several theorists now argue that the collector is no longer drawing power alone. It is placing strain on the structure of subspace itself.\n\nProject leadership insists that one final controlled test would prove the technology's viability once and for all."
 cp26_daystrom.3.desc_suspended:0 "Even after the collector was throttled back, the anomalies continued to evolve. The patterns now appear deliberate, almost anticipatory, and multiple teams report impossible temporal offsets in their readings.\n\nThe Daystrom board is deeply divided. Some demand a permanent shutdown. Others insist that a final calibrated trial is the only way to understand what has been disturbed."
 cp26_daystrom.3.a:0 "Proceed with the final test."
 cp26_daystrom.3.b:0 "Reduce power and continue only theoretical work."
 cp26_daystrom.3.c:0 "Shut the project down permanently."
 cp26_daystrom.4.title:0 "The Tear"
 cp26_daystrom.4.desc:0 "The opening seconds of the final test surpass every projection. Energy production climbs to levels never before recorded.\n\nThen every measurement collapses into nonsense.\n\nSpace around Daystrom Station distorts. Communications fail. Gravitational readings oscillate without pattern. At the heart of the installation, a dark fracture opens and the station begins to come apart around it. The breach has no measurable depth. It is not a natural phenomenon.\n\nWarp signatures emerge from the other side.\n\nWhat we believed to be an inexhaustible energy source was a barrier.\n\nWe have just torn it open."
 cp26_daystrom.100.title:0 "The Daystrom Breach"
 cp26_daystrom.100.desc:0 "A catastrophic failure at Daystrom Station has torn open a subspace rupture. The station is gone, the system has fallen into hostile hands, and an unknown power is now emerging through the breach."
