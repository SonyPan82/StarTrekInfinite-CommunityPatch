 qt_romulan_a7:0 "Forging the Scimitar"
 qt_romulan_a7_desc:0 "The Majestus affirmed Romulan power. Now the Tal Shiar and the imperial navy demand something even darker: a singularity warship of terror. Commit 5500 alloys to black-archive development and unlock the Scimitar for research."
