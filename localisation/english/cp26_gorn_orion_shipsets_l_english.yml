 tech_cp26_gorn_makar:0 "Makar Patrol Frigate"
 tech_cp26_gorn_makar_desc:0 "The Makar gives the Hegemony a compact patrol hull for border enforcement, intimidation runs, and fast punitive action against intruders."
 tech_cp26_gorn_ddraig:0 "Ddraig Destroyer"
 tech_cp26_gorn_ddraig_desc:0 "The Hegemony formalizes the Ddraig as a disciplined frontier combatant: compact, durable, and built to punish intrusions before they can become occupations."
 tech_cp26_gorn_sarath:0 "S'arath Cruiser"
 tech_cp26_gorn_sarath_desc:0 "The S'arath expands Gorn naval doctrine into heavier patrol squadrons, giving the Hegemony a line ship suited to border enforcement and deliberate territorial pressure."
 tech_cp26_gorn_balaur:0 "Balaur Battleship"
 tech_cp26_gorn_balaur_desc:0 "The Balaur is a blunt instrument of Hegemony power: a heavy warship designed to hold contested systems, break fortified positions, and remind rivals that Gorn borders are not suggestions."
 tech_cp26_gorn_vazkoth:0 "Vazkoth Titan"
 tech_cp26_gorn_vazkoth_desc:0 "The Vazkoth concentrates the authority of the Hegemony into a single command hull, coordinating long campaigns and anchoring Gorn fleets around overwhelming force."
 tech_cp26_gorn_hegemony_bulwark:0 "Hegemony Bulwark"
 tech_cp26_gorn_hegemony_bulwark_desc:0 "The Hegemony Bulwark is a mobile fortress built for campaigns where retreat would signal weakness and every border must be made permanent."
 tech_cp26_gorn_kethar_command:0 "Kethar Command"
 tech_cp26_gorn_kethar_command_desc:0 "The Kethar Command projects the will of the ruling houses across entire sectors, turning Gorn naval supremacy into a visible instrument of control."
 tech_cp26_orion_interceptor:0 "Interceptor Raider"
 tech_cp26_orion_interceptor_desc:0 "The Interceptor is the Syndicate's light raider: fast enough to choose its fights, cheap enough to lose, and useful enough that no captain admits how many they own."
 tech_cp26_orion_wanderer:0 "Wanderer Destroyer"
 tech_cp26_orion_wanderer_desc:0 "The Wanderer gives Orion captains a stronger escort for raids, private contracts, and deniable operations far beyond Syndicate space."
 tech_cp26_orion_corsair:0 "Corsair Cruiser"
 tech_cp26_orion_corsair_desc:0 "The Corsair turns Orion mobility and opportunism into a true cruiser doctrine, balancing speed, intimidation, and enough cargo space to make every battle profitable."
 tech_cp26_orion_marauder:0 "Marauder Battleship"
 tech_cp26_orion_marauder_desc:0 "The Marauder is the Syndicate's answer to open war: a heavy enforcement vessel for protecting criminal markets, breaking blockades, and collecting debts at scale."
 tech_cp26_orion_dreadnought:0 "Syndicate Dreadnought"
 tech_cp26_orion_dreadnought_desc:0 "When subtle leverage is no longer enough, the Syndicate Dreadnought becomes a mobile center of coercion, wealth, and command for Orion power brokers."
 tech_cp26_orion_emerald_citadel:0 "Emerald Citadel"
 tech_cp26_orion_emerald_citadel_desc:0 "The Emerald Citadel is less a warship than a travelling seat of Syndicate power, built to host negotiations, hold prisoners, and end negotiations by force."
 tech_cp26_orion_black_ledger:0 "Black Ledger"
 tech_cp26_orion_black_ledger_desc:0 "The Black Ledger exists for debts no court will record: a strategic command hull for erasing rivals, enforcing secret contracts, and making examples that survive as rumors."
