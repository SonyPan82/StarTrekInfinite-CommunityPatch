l_french:
 cp26_minor_mission.43.name:0 "Épidémie contenue"
 cp26_minor_mission.43.desc:0 "Les scientifiques de §H[This.GetName]§! sont parvenus à contenir l'épidémie de superbactéries.\n\nLa crise a coûté cher, mais les autorités locales ont prouvé qu'elles pouvaient réagir seules face à une urgence médicale majeure."
 cp26_minor_mission.43.a:0 "Une bonne nouvelle."
 cp26_minor_mission.43.a.tt:0 "L'épidémie locale est maîtrisée. Le monde touché reçoit temporairement un bonus de stabilité et de croissance.\n\n"
 cp26_minor_mission.44.name:0 "Échec du confinement"
 cp26_minor_mission.44.desc:0 "L'épidémie de superbactéries sur un monde de §H[This.GetName]§! a échappé aux autorités locales.\n\nLes méthodes traditionnelles ont échoué et la crise a laissé une trace durable dans la population."
 cp26_minor_mission.44.a:0 "La galaxie peut être cruelle."
 cp26_minor_mission.44.a.tt:0 "L'épidémie locale n'a pas pu être contenue.\n\n"
 cp26_minor_outbreak_contained:0 "Épidémie contenue"
 cp26_minor_outbreak_contained_desc:0 "Ce monde a renforcé ses infrastructures médicales après avoir contenu une épidémie de superbactéries."
 cp26_minor_mission.100.name:0 "Mission réussie"
 cp26_minor_mission.100.desc:0 "§H[This.GetName]§! a mené cette mission à son terme.\n\nMême les puissances mineures peuvent trouver leurs propres solutions lorsque la galaxie les met à l'épreuve."
 cp26_minor_mission.100.a:0 "Ils s'en sont sortis."
 cp26_minor_mission.100.a.tt:0 "La mission mineure est terminée avec succès.\n\n"
 cp26_minor_mission.101.name:0 "Mission échouée"
 cp26_minor_mission.101.desc:0 "§H[This.GetName]§! n'a pas réussi à mener cette mission à son terme.\n\nLa crise se referme sans résultat décisif, mais l'empire conserve une issue valide et la partie continue normalement."
 cp26_minor_mission.101.a:0 "Dommage."
 cp26_minor_mission.101.a.tt:0 "La mission mineure se termine par un échec.\n\n"
