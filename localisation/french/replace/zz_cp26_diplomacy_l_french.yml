 ACTION_CP26_OFFER_WAR_GOAL_PEACE_TITLE:0 "Proposer d'accepter le but de guerre"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre. L'empire ciblé peut accepter ou refuser."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_OFFER_DESC:0 "§H[Actor.GetName]§! propose que nous acceptions son but de guerre."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_COST:0 "$ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC$"
 action_cp26_offer_war_goal_peace:0 "Demander la capitulation"
 action_cp26_offer_war_goal_peace_desc:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre et de mettre fin à la guerre."
 01_CP26_OFFER_WAR_GOAL_PEACE_CONSIDER:0 "Nous examinons leurs conditions."
 01_CP26_OFFER_WAR_GOAL_PEACE_SELECT:0 "Nous pouvons exiger qu'ils acceptent notre but de guerre."
 01_CP26_OFFER_WAR_GOAL_PEACE_PROPOSE:0 "Notre demande :"
 01_CP26_OFFER_WAR_GOAL_PEACE_ACCEPT:0 "Nous acceptons."
 01_CP26_OFFER_WAR_GOAL_PEACE_REFUSE:0 "Nous refusons."
 01_CP26_PROPOSE_VASSALIZATION_CONSIDER:0 ""
 01_CP26_PROPOSE_VASSALIZATION_SELECT:0 ""
 01_CP26_PROPOSE_VASSALIZATION_PROPOSE:0 "Notre offre :"
 01_CP26_PROPOSE_VASSALIZATION_ACCEPT:0 "Nous acceptons."
 01_CP26_PROPOSE_VASSALIZATION_REFUSE:0 "Nous refusons."
 grants_subjugation_cb:0 "Un refus donne un casus belli temporaire de §Hsubjugation§!."
 casus_belli_cb_subjugation:0 "Subjugation"
 war_goal_wg_subjugation:0 "Vassaliser"
 war_goal_wg_subjugation_desc:0 "Cette guerre est menée pour forcer l'ennemi à devenir notre vassal."
 casus_belli_cb_cp26_forced_occupation:0 "Occupation"
 war_goal_wg_cp26_forced_occupation:0 "Imposer l'occupation"
 war_goal_wg_cp26_forced_occupation_desc:0 "Cette guerre est menée pour imposer à l'ennemi un statut d'occupation. En cas de statu quo, les systèmes occupés et revendiqués peuvent être conservés. En cas de victoire complète, la cible devient un État occupé."
 CP26_VASSALIZATION_PENDING:0 "Une proposition de vassalisation est déjà en attente."
 CP26_WARGOAL_PEACE_PENDING:0 "Une proposition de paix est déjà en attente."
 cp26_vassalization.1.name:0 "Proposition de vassalisation"
 cp26_vassalization.1.desc:0 "§H[event_target:cp26_vassalization_actor.GetName]§! propose que nous devenions son vassal."
 cp26_vassalization.1.accept:0 "Accepter la proposition"
 cp26_vassalization.1.decline:0 "Refuser la proposition"
 cp26_vassalization.2.name:0 "Vassalisation acceptée"
 cp26_vassalization.2.desc:0 "§H[event_target:cp26_vassalization_recipient.GetName]§! a accepté notre proposition et devient notre vassal."
 cp26_vassalization.2.ok:0 "Excellent."
 cp26_vassalization.3.name:0 "Vassalisation refusée"
 cp26_vassalization.3.desc:0 "§H[event_target:cp26_vassalization_recipient.GetName]§! a refusé notre proposition de vassalisation.\n\nNous obtenons un casus belli temporaire de subjugation."
 cp26_vassalization.3.ok:0 "Ils le regretteront."
 cp26_vassalization.5.name:0 "Vassalisation"
 cp26_vassalization.5.desc:0 "§H[event_target:cp26_vassalization_subject.GetName]§! est désormais le vassal de §H[event_target:cp26_vassalization_overlord.GetName]§!."
 cp26_vassalization.5.ok:0 "OK"
 cp26_vassalization.6.name:0 "Proposition de paix"
 cp26_vassalization.6.desc:0 "§H[event_target:cp26_wargoal_peace_actor.GetName]§! propose que nous acceptions son but de guerre et mettions fin au conflit."
 cp26_vassalization.6.accept:0 "Accepter le but de guerre"
 cp26_vassalization.6.decline:0 "Refuser"
 cp26_vassalization.7.name:0 "But de guerre accepté"
 cp26_vassalization.7.desc:0 "§H[event_target:cp26_wargoal_peace_recipient.GetName]§! a accepté notre proposition de paix."
 cp26_vassalization.7.ok:0 "Très bien."
 cp26_vassalization.8.name:0 "Proposition refusée"
 cp26_vassalization.8.desc:0 "§H[event_target:cp26_wargoal_peace_recipient.GetName]§! a refusé d'accepter notre but de guerre."
 cp26_vassalization.8.ok:0 "La guerre continue."
 SEND_DEMANDS:0 "Demander la capitulation"
 SEND_DEMANDS_DESC:0 "Envoyer une demande de capitulation. Le destinataire pourra accepter ou refuser notre proposition."
 FORCE_DEMANDS:2 "Imposer le but de guerre"
 FORCE_DEMANDS_DESC:1 "Imposer notre but de guerre si l'ennemi ne peut plus refuser."
 WAROVERVIEW_FORCE_DEMANDS:0 "Imposer le but de guerre"
 WAROVERVIEW_FORCE_DEMANDS_DESC:0 "Imposer notre but de guerre si l'ennemi ne peut plus refuser."
 PEACE_DEMAND:0 "Demander la capitulation"
 cp26_minor_mission.215.name:0 "Incident diplomatique"
 cp26_minor_mission.215.desc:0 "Notre initiative auprès du dignitaire en visite a tourné à l'incident politique embarrassant. L'État mineur est offensé, et la mission se termine par un échec."
 cp26_minor_mission.215.a:0 "Il faudra gérer les conséquences."
 cp26_minor_mission.215.a.tt:0 "La mission échoue et les relations se dégradent."
