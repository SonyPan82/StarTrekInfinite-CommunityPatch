 ACTION_PATRONAGE_TITLE:0 "Proposer la vassalisation"
 ACTION_PATRONAGE_DESC:3 "Propose que §H[Recipient.GetName]§! devienne notre vassal. En cas de refus, nous obtenons un casus belli temporaire de subjugation."
 ACTION_PATRONAGE_OFFER_DESC:0 "§H[Actor.GetName]§! propose que nous devenions son vassal."
