 tech_cp26_gorn_makar:0 "Fregate de patrouille Makar"
 tech_cp26_gorn_makar_desc:0 "Le Makar offre a l'Hegemonie une coque de patrouille compacte pour le controle frontalier, les manoeuvres d'intimidation et les actions punitives rapides contre les intrus."
 tech_cp26_gorn_ddraig:0 "Destroyer Ddraig"
 tech_cp26_gorn_ddraig_desc:0 "L'Hegemonie formalise le Ddraig comme combattant de frontiere discipline : compact, robuste et concu pour punir les intrusions avant qu'elles ne deviennent des occupations."
 tech_cp26_gorn_sarath:0 "Croiseur S'arath"
 tech_cp26_gorn_sarath_desc:0 "Le S'arath etend la doctrine navale gorn a des escadres de patrouille plus lourdes, donnant a l'Hegemonie un navire de ligne adapte au controle frontalier et a la pression territoriale methodique."
 tech_cp26_gorn_balaur:0 "Cuirasse Balaur"
 tech_cp26_gorn_balaur_desc:0 "Le Balaur est un instrument brutal de la puissance gorn : un lourd navire de guerre concu pour tenir les systemes contestes, briser les positions fortifiees et rappeler aux rivaux que les frontieres gorn ne sont pas des suggestions."
 tech_cp26_gorn_vazkoth:0 "Titan Vazkoth"
 tech_cp26_gorn_vazkoth_desc:0 "Le Vazkoth concentre l'autorite de l'Hegemonie dans une seule coque de commandement, coordonnant les longues campagnes et ancrant les flottes gorn autour d'une force ecrasante."
 tech_cp26_gorn_hegemony_bulwark:0 "Rempart de l'Hegemonie"
 tech_cp26_gorn_hegemony_bulwark_desc:0 "Le Rempart de l'Hegemonie est une forteresse mobile concue pour les campagnes ou reculer serait un signe de faiblesse et ou chaque frontiere doit devenir permanente."
 tech_cp26_gorn_kethar_command:0 "Commandement Kethar"
 tech_cp26_gorn_kethar_command_desc:0 "Le Commandement Kethar projette la volonte des maisons dirigeantes sur des secteurs entiers, transformant la suprematie navale gorn en instrument visible de controle."
 tech_cp26_orion_interceptor:0 "Raider Interceptor"
 tech_cp26_orion_interceptor_desc:0 "L'Interceptor est le raider leger du Syndicat : assez rapide pour choisir ses combats, assez peu couteux pour etre perdu et assez utile pour qu'aucun capitaine n'avoue combien il en possede."
 tech_cp26_orion_wanderer:0 "Destroyer Wanderer"
 tech_cp26_orion_wanderer_desc:0 "Le Wanderer offre aux capitaines orions une escorte plus solide pour les raids, les contrats prives et les operations deniables loin de l'espace du Syndicat."
 tech_cp26_orion_corsair:0 "Croiseur Corsaire"
 tech_cp26_orion_corsair_desc:0 "Le Corsaire transforme la mobilite et l'opportunisme orions en vraie doctrine de croiseur, melant vitesse, intimidation et assez de volume interne pour rendre chaque combat rentable."
 tech_cp26_orion_marauder:0 "Cuirasse Marauder"
 tech_cp26_orion_marauder_desc:0 "Le Marauder est la reponse du Syndicat a la guerre ouverte : un lourd navire d'execution concu pour proteger les marches criminels, briser les blocus et collecter les dettes a grande echelle."
 tech_cp26_orion_dreadnought:0 "Cuirasse du Syndicat"
 tech_cp26_orion_dreadnought_desc:0 "Lorsque les leviers discrets ne suffisent plus, la Cuirasse du Syndicat devient un centre mobile de coercition, de richesse et de commandement pour les puissants orions."
 tech_cp26_orion_emerald_citadel:0 "Citadelle Emeraude"
 tech_cp26_orion_emerald_citadel_desc:0 "La Citadelle Emeraude est moins un vaisseau de guerre qu'un siege mobile du pouvoir du Syndicat, concu pour accueillir des negociations, retenir des prisonniers et conclure les discussions par la force."
 tech_cp26_orion_black_ledger:0 "Grand Registre"
 tech_cp26_orion_black_ledger_desc:0 "Le Grand Registre existe pour les dettes qu'aucun tribunal ne consigne : une coque de commandement strategique pour effacer les rivaux, imposer les contrats secrets et creer des exemples qui survivent sous forme de rumeurs."
