 START_SCREEN_GORN:0 "L'Hegemonie Gorn est une puissance territoriale dure, fondee sur la hierarchie, la survie et le droit des plus forts a conserver ce qu'ils savent defendre. Depuis Gornar, les maisons dirigeantes observent la frontiere avec un calcul froid, considerant chaque limite comme une epreuve de determination.\n\nL'Hegemonie ne recherche pas l'amitie pour elle-meme. Elle respecte la force, repond aux intrusions par la force et s'etend lorsque la faiblesse ouvre une voie."
 gorn_hegemony:0 "Hegemonie Gorn"