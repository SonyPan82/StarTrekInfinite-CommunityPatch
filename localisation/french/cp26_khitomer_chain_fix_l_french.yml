l_french:
 country.2811.other.desc:0 "La crise de Khitomer oblige chaque puissance à repenser sa place dans la galaxie. Notre régime ne figurait pas dans les filières « grandes factions » d'origine : nous prenons acte et poursuivons."
 country.2811.z_acknowledge:0 "Compris. Continuer."
 country.2812.other.desc:0 "Les leçons de Khitomer résonnent autrement ici. Sans branche narrative prévue pour notre gouvernement, nous reconnaissons la situation et poursuivons."
 country.2812.z_acknowledge:0 "Pris en compte."
