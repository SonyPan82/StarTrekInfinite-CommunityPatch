 borg_crisis.360.name:0 "Retour de l'U.S.S. Voyager"
 borg_crisis.360.desc:0 "Nos spécialistes militaires chargés de contrer la menace borg imminente ont été contactés par la §Hcapitaine Kathryn Janeway§! du vaisseau §HU.S.S. Voyager§! de la §HFédération§!.\n\nLa §Hcapitaine Janeway§! est revenue de son séjour dans le §HQuadrant Delta§! et propose de partager des informations classifiées avec nous et avec d'autres dirigeants galactiques afin d'éviter une guerre totale contre le §GCollectif borg§!.\n\nJaneway offre cette aide librement à tous ceux qui pourraient être attaqués par les §GBorgs§!. Si sa mission est approuvée, elle arrivera bientôt pour nous assister avec l'§HU.S.S. Voyager§!."

