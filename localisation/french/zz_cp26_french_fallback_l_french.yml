l_french:
 tech_ambassador_unlock:0 "Schémas de l'Ambassador"
 tech_ambassador_unlock_desc:0 "Les explorateurs de classe §HAmbassador§! peuvent opérer sans soutien dans de nombreux profils de mission."
 tech_constellation_unlock:0 "Schémas de la Constellation"
 tech_constellation_unlock_desc:0 "Les vaisseaux de classe §HConstellation§! sont d'anciens explorateurs de la Fédération, polyvalents et fiables."
 tech_lantree_unlock:0 "Schémas du Lantree"
 tech_lantree_unlock_desc:0 "Petits vaisseaux utilitaires de la Fédération pouvant être produits rapidement."
 tech_mzl_neworleans_unlock:0 "Schémas du New Orleans"
 tech_mzl_neworleans_unlock_desc:0 "Les vaisseaux de classe §HNew Orleans§! sont des croiseurs de soutien intermédiaires conçus pour les opérations de flotte."
 tech_pmkn_akira_unlock:0 "Schémas de l'Akira"
 tech_pmkn_akira_unlock_desc:0 "Les vaisseaux de classe §HAkira§! sont de puissants croiseurs lourds polyvalents."
 tech_luna_unlock:0 "Schémas de la Luna"
 tech_luna_unlock_desc:0 "Les vaisseaux de classe §HLuna§! sont des explorateurs avancés à long rayon d'action, conçus pour les missions scientifiques et les opérations indépendantes en espace profond."
 tech_odyssey_unlock:0 "Schémas de l'Odyssey"
 tech_odyssey_unlock_desc:0 "Les vaisseaux de classe §HOdyssey§! sont des vaisseaux amiraux de la Fédération, conçus pour le commandement, les engagements de flotte prolongés et la projection de puissance en espace profond."
 tech_cp26_kamarag_unlock:0 "Schémas du Kamarag"
 tech_cp26_kamarag_unlock_desc:0 "Les vaisseaux de classe §HKamarag§! ajoutent une option klingonne de ligne de bataille lourde, pensée pour le combat frontal prolongé."
 tech_cp26_kvort_unlock:0 "Schémas du K'vort"
 tech_cp26_kvort_unlock_desc:0 "Les vaisseaux de classe §HK'vort§! offrent une capacité de frappe rapide avec une puissance de feu de niveau croiseur."
 tech_cp26_klingon_raptor_unlock:0 "Schémas du Raptor"
 tech_cp26_klingon_raptor_unlock_desc:0 "Les vaisseaux de classe §HRaptor§! combinent des bordées disrupteurs klingonnes avec une coque compacte de type destroyer."

