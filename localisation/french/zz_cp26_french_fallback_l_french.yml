 HIGHWAY_GALACTIC:0 "Conduit de transdistorsion"
 HIGHWAY_DESC:0 "Ce système contient un §Y$HIGHWAY_GALACTIC$§!."
 HIGHWAY_DESC_UNEXPLORED:0 "Ce système contient un §Y$HIGHWAY_GALACTIC$§! encore §Rinexploré§!."
 HIGHWAY_COUNTRY_CANNOT_USE:0 "$TRIGGER_FAIL$ Nous ne disposons pas des moyens nécessaires pour utiliser le §Y$HIGHWAY_GALACTIC$§!."
 pc_node_black_hole_desc:0 "Si certaines §Hdistorsions spatio-temporelles§! ressemblent à des §Htrous noirs§!, elles fonctionnent presque à l'inverse. En courbant le continuum espace-temps, elles permettent de voyager à travers la §Hgalaxie§! via les §H$HIGHWAY_GALACTIC$§!."

