l_french:

 action_cp26_ferengi_exchange:0 "Visiter la Bourse"
 action_cp26_ferengi_exchange_desc:0 "Faire affaire avec la Bourse de l’Alliance Ferengi : acheter du latinum et consulter vos réserves actuelles."

 cp26_ferengi_main.title:0 "Bourse de l’Alliance Ferengi"
 cp26_ferengi_main_direct1:0 "Bienvenue, bienvenue ! Le Grand Nagus vous transmet ses salutations... ainsi que sa grille tarifaire.\n\nLa Bourse de l’Alliance Ferengi propose le profit sous sa forme la plus pure : du latinum contre de l’énergie, des marges nettes, et aucune sentimentalité inutile.\n\nSouvenez-vous : une opportunité ne frappe qu’une fois. Et si elle doit frapper deux fois, c’est payant."
 cp26_ferengi_main_direct2:0 "Ah, un client de retour ! Le meilleur genre de client.\n\nAlors, aujourd’hui ? Encore du latinum, ou vous venez simplement vérifier l’état de vos profits ?"

 cp26_ferengi_jackpot_tooltip:0 "DABO ! §YGros jackpot§! : recevez une importante réserve d’§Yénergie§!, de §Yminéraux§! et de §Ylatinum§!."
