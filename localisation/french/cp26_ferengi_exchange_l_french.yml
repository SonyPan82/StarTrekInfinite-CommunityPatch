l_french:

 action_cp26_ferengi_exchange:0 "Visiter la Bourse"
 action_cp26_ferengi_exchange_desc:0 "Faire affaire avec la Bourse de l’Alliance Ferengi : acheter du latinum, tenter sa chance au Dabo ou échanger contre des ressources stratégiques."

 cp26_ferengi_main.title:0 "Bourse de l’Alliance Ferengi"
 cp26_ferengi_main_direct1:0 "Bienvenue, bienvenue ! Le Grand Nagus vous transmet ses salutations... ainsi que sa grille tarifaire.\n\nLa Bourse de l’Alliance Ferengi propose les meilleures opportunités de profit : latinum contre énergie, Dabo pour les audacieux et ressources rares pour ceux qui ont assez de barres pour payer.\n\nSouvenez-vous : une opportunité ne frappe qu’une fois. Et si elle doit frapper deux fois, c’est payant."
 cp26_ferengi_main_direct2:0 "Ah, un client de retour ! Le meilleur genre de client : vous connaissez déjà les Règles de l’Acquisition.\n\nAlors, aujourd’hui ? Latinum, Dabo ou marché stratégique ?"

 cp26_ferengi_jackpot_tooltip:0 "DABO ! §YGros jackpot§! : recevez une importante réserve d’§Yénergie§!, de §Yminéraux§! et de §Ylatinum§!."
