l_french:
 personality_cp26_grand_nagus_merchants:0 "Ferengi"
 personality_cp26_grand_nagus_merchants_desc:0 "Des opportunistes commerciaux affutes qui recherchent d'abord des accords favorables, des marches ouverts et des positions rentables avant de chercher la gloire au combat."
EMPIRE_DESIGN_FERENGI:0 "Alliance Ferengi (Bêta)"
 EMPIRE_SHORT_NAME_ferengi:0 "FERENGI"
 START_SCREEN_FERENGI:0 "L'Alliance Ferengi est tenue ensemble par le commerce, le profit et l'autorité du Grand Nagus. Depuis Ferenginar, les grandes maisons marchandes, les prêteurs et les négociants mesurent toute chose à l'aune du gain, du contrat et du latinum.\n\nLes Règles d'Acquisition ne sont pas qu'un code moral: elles structurent la politique, la diplomatie et la guerre elles-mêmes. Dans une galaxie où d'autres empires invoquent l'honneur, la destinée ou le devoir, les Ferengis savent qu'une bonne affaire, bien négociée au bon moment, peut valoir davantage qu'une flotte entière."
 gov_social_autocracy_ferengi:0 "Conclave commercial"
 gov_social_autocracy_ferengi_desc:0 "Un État guidé par le Grand Nagus et les grands intérêts commerciaux de la société ferengie, où le pouvoir politique et le pouvoir économique ne font qu'un."
 ferengi_unique_mechanic:0 "Commerce et profit"
 ferengi_unique_mechanic_tooltip:0 "L'Alliance Ferengi maîtrise l'art du profit et du commerce. Les Règles d'Acquisition et l'autorité du Grand Nagus confèrent de puissants avantages économiques et diplomatiques qui font de la négociation une arme redoutable."
