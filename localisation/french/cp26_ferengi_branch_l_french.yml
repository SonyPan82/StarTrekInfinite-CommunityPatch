 cp26_ferengi_trade_forum:0 "Bureau du Grand Nagus"
 cp26_ferengi_trade_forum_desc:0 "Un comptoir diplomatico-commercial ferengi operant sous charte directe du Grand Nagus. Le commerce circule, les tarifs disparaissent, le profit suit."
 cp26_ferengi_mining_consortium:0 "Equipe d'Acquisition"
 cp26_ferengi_mining_consortium_desc:0 "Droits d'extraction, contrats logistiques et monopoles de revente rendent le minerai de ce monde extremement rentable."
 cp26_ferengi_energy_exchange:0 "Bar de Quark"
 cp26_ferengi_energy_exchange_desc:0 "Mi-bar, mi-marche noir, mi-bourse. La foule afflue, le latinum circule, et les locaux n'ont jamais ete aussi heureux — exactement comme les Ferengi le souhaitaient."
