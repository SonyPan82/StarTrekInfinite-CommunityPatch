 cp26_ferengi_branch.0.name:0 "Choisir un partenaire commercial"
 cp26_ferengi_branch.0.desc:0 "Quel partenaire commercial doit accueillir notre prochaine succursale ferengi ?"
 cp26_ferengi_branch.1.name:0 "Choisir un monde d'accueil"
 cp26_ferengi_branch.1.desc:0 "Notre pacte commercial avec [event_target:cp26_branch_host_country.GetName] nous ouvre une porte. Quelle colonie doit accueillir la nouvelle succursale ferengi ?"
 cp26_ferengi_branch.2.name:0 "Choisir le type de succursale"
 cp26_ferengi_branch.2.desc:0 "Le site de [event_target:cp26_branch_selected_planet.GetName] est securise. Quelle structure commerciale orbitale ferengi voulons-nous y etablir ?"
 cp26_ferengi_branch.3.name:0 "Plateformes commerciales actives"
 cp26_ferengi_branch.3.desc:0 "Voici les plateformes commerciales orbitales ferengi que nous exploitons actuellement chez nos partenaires."
 cp26_ferengi_branch.4.name:0 "Rapport de plateforme"
 cp26_ferengi_branch.4.desc:0 "[event_target:cp26_branch_report_planet.GetName] accueille notre plateforme orbitale au sein de [event_target:cp26_branch_report_host.GetName]."
 cp26_ferengi_branch.5.name:0 "Presence commerciale ferengi"
 cp26_ferengi_branch.5.desc:0 "[event_target:cp26_branch_report_planet.GetName] accueille une succursale ferengi exploitée pour le compte de [event_target:cp26_branch_report_ferengi.GetName]."
 cp26_ferengi_branch.6.name:0 "Nouvelle succursale ferengi"
 cp26_ferengi_branch.6.desc:0 "[event_target:cp26_branch_report_ferengi.GetName] a etabli une Enclave du Grand Nagus sur [event_target:cp26_branch_report_planet.GetName]."
 cp26_ferengi_branch.7.name:0 "Nouvelle succursale ferengi"
 cp26_ferengi_branch.7.desc:0 "[event_target:cp26_branch_report_ferengi.GetName] a etabli une Equipe d'Acquisition sur [event_target:cp26_branch_report_planet.GetName]."
 cp26_ferengi_branch.8.name:0 "Nouvelle succursale ferengi"
 cp26_ferengi_branch.8.desc:0 "[event_target:cp26_branch_report_ferengi.GetName] a etabli un Bar de Quark sur [event_target:cp26_branch_report_planet.GetName]."

