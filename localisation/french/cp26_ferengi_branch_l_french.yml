 cp26_ferengi_branch_quark_tt:0 "§Y50§! influence, §Y500§! minerais\nAjoute §YBar de Quark§! sur [event_target:cp26_branch_selected_planet.GetName].\nEffets hote: §G+5§! Services, §G+2§! valeur commerciale."
 cp26_ferengi_branch_nagus_desc:0 "50 Influence + 400 Minerais | +12 Energie/mois | hote: +10% Valeur commerciale, +3 Services"
 cp26_ferengi_branch_acquisition_desc:0 "50 Influence + 500 Minerais | +12 Minerais/mois | hote: +1 Mineur, +5% production workers"
 cp26_ferengi_branch_quark_desc:0 "50 Influence + 500 Minerais | +16 Energie/mois | hote: +5 Services, +2 Valeur commerciale"

 cp26_ferengi_trade_forum:0 "Enclave du Grand Nagus"
 cp26_ferengi_trade_forum_desc:0 "Une enclave diplomatico-commerciale ferengi operant sous charte directe du Grand Nagus. Le commerce circule, les tarifs disparaissent, le profit suit."
 cp26_ferengi_mining_consortium:0 "Equipe d'Acquisition"
 cp26_ferengi_mining_consortium_desc:0 "Droits d'extraction, contrats logistiques et monopoles de revente rendent le minerai de ce monde extremement rentable."
 cp26_ferengi_energy_exchange:0 "Bar de Quark"
 cp26_ferengi_energy_exchange_desc:0 "Mi-bar, mi-marche noir, mi-bourse. La foule afflue, le latinum circule, et les locaux n'ont jamais ete aussi heureux — exactement comme les Ferengi le souhaitaient."
 cp26_ferengi_trade_hub_construction:0 "Construction d'une enclave du Grand Nagus"
 cp26_ferengi_trade_hub_construction_desc:0 "Un vaisseau de construction ferengi est en route pour etablir une enclave orbitale du Grand Nagus autour de ce monde."
 cp26_ferengi_mining_hub_construction:0 "Construction d'une plateforme d'Acquisition"
 cp26_ferengi_mining_hub_construction_desc:0 "Un vaisseau de construction ferengi est en route pour etablir une plateforme d'Acquisition autour de ce monde."
 cp26_ferengi_leisure_hub_construction:0 "Construction d'une plateforme de Quark"
 cp26_ferengi_leisure_hub_construction_desc:0 "Un vaisseau de construction ferengi est en route pour etablir une plateforme de Quark autour de ce monde."
 cp26_ferengi_trade_hub:0 "Enclave du Grand Nagus"
 cp26_ferengi_trade_hub_desc:0 "Une enclave commerciale orbitale ferengi qui supervise l'operation locale et redistribue le profit vers Ferenginar."
 cp26_ferengi_trade_hub_DESC:0 "Une enclave orbitale ferengi dediee au commerce, aux contrats et aux prelevements du Grand Nagus."
 cp26_ferengi_trade_hub_MEGASTRUCTURE_DETAILS:0 "§ERendement ferengi :§! §G+12 Energie/mois§!"
 cp26_ferengi_mining_hub:0 "Plateforme d'Acquisition"
 cp26_ferengi_mining_hub_desc:0 "Une structure orbitale ferengi dediee aux droits d'extraction, aux contrats miniers et au transit des cargaisons."
 cp26_ferengi_mining_hub_DESC:0 "Une plateforme orbitale ferengi consacree aux droits miniers, a l'extraction et au transit des cargaisons."
 cp26_ferengi_mining_hub_MEGASTRUCTURE_DETAILS:0 "§ERendement ferengi :§! §G+12 Minerais/mois§!"
 cp26_ferengi_leisure_hub:0 "Bar de Quark"
 cp26_ferengi_leisure_hub_desc:0 "Une station orbitale de loisirs, de services et de transactions ou Quark ferait fortune avant meme l'heure du dejeuner."
 cp26_ferengi_leisure_hub_DESC:0 "Un bar orbital ferengi ou chaque visiteur est aussi un client."
 cp26_ferengi_leisure_hub_MEGASTRUCTURE_DETAILS:0 "§ERendement ferengi :§! §G+16 Energie/mois§!"
 cp26_ferengi_platform_construction_chain_title:0 "Construire une plateforme commerciale"
 cp26_ferengi_platform_construction_chain_desc:0 "Un vaisseau de construction ferengi est en route pour etablir une plateforme commerciale orbitale chez l'un de nos partenaires."
 tech_cp26_ferengi_trade_platforms:0 "Enclaves du Grand Nagus"
 tech_cp26_ferengi_trade_platforms_desc:0 "Les maisons marchandes ferengi standardisent leurs enclaves orbitales afin de capter le profit d'un monde partenaire sans attendre une integration administrative complete."
 ALLOW_CP26_FERENGI_TRADE_PLATFORM:0 "§HDeverrouille la megastructure ferengi :§! $cp26_ferengi_trade_hub$"
 tech_cp26_ferengi_mining_platforms:0 "Plateformes d'acquisition"
 tech_cp26_ferengi_mining_platforms_desc:0 "En raffinant leurs droits d'extraction et leurs contrats logistiques, les Ferengi peuvent transformer une simple presence orbitale en machine a minerai tres rentable."
 ALLOW_CP26_FERENGI_MINING_PLATFORM:0 "§HDeverrouille la megastructure ferengi :§! $cp26_ferengi_mining_hub$"
 tech_cp26_ferengi_quark_platforms:0 "Licences orbitales de Quark"
 tech_cp26_ferengi_quark_platforms_desc:0 "Une fois les reseaux commerciaux mures, les franchises de Quark peuvent suivre la flotte ferengi jusque dans les systemes partenaires les plus prospères."
 ALLOW_CP26_FERENGI_QUARK_PLATFORM:0 "§HDeverrouille la megastructure ferengi :§! $cp26_ferengi_leisure_hub$"
