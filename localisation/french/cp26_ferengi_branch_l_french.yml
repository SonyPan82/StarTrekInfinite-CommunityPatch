 cp26_ferengi_branch_nagus_tt:0 "§Y50§! influence, §Y400§! minerais\nAjoute §YEnclave du Grand Nagus§! sur [event_target:cp26_branch_selected_planet.GetName].\nEffets hote: §G+10%§! valeur commerciale, §G+3§! Services."
