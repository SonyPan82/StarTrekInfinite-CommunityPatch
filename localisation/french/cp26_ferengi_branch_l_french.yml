 cp26_manage_ferengi_branches:0 "Gerer les succursales ferengi"
 cp26_manage_ferengi_branches_desc:0 "Ouvrir l'interface de gestion des succursales ferengi et etablir une nouvelle operation commerciale hors monde."
 cp26_ferengi_branch_button:0 "Succursales"
 action_cp26_create_branch_office:0 "Creer une succursale"
 action_cp26_create_branch_office_desc:0 "Ouvrir une operation commerciale ferengi sur l'un des mondes de cet empire."
