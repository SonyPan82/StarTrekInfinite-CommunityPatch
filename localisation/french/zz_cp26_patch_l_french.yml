 action.13.a.ferengi:0 "Ouvrir des négociations."
 country.2801.ferengi.desc:0 "Chaque crise est aussi une correction de marché. Tandis que les grandes puissances s'agitent autour de Khitomer, nous protégerons nos intérêts, compterons les coûts et veillerons à ce que le commerce ferengi survive à la tourmente."
 country.2801.e:0 "Protéger nos intérêts."
 country.2801.e.tt:0 "Le profit favorise ceux qui gardent leur sang-froid pendant que les autres paniquent.\n\n"
 hrb_colony.12.e:0 "Sécuriser les survivants et évaluer les pertes."
 hrb_colony.12.e.tt:0 "Nous protégerons les actifs restants, stabiliserons la colonie et déterminerons si cette tragédie peut encore devenir une opportunité."
 hrb_colony.31.c:0 "Rétablir le contact et évaluer l'opportunité."
 hrb_colony.82.e:0 "Si ça parle, ça peut se vendre."
 hrb_planet_modifier.15.e:0 "Exploiter le potentiel énergétique."
 hrb_planet_modifier.15.e.tt:0 "Un effort commercial discipliné peut transformer cet environnement instable en actif rentable à long terme."
 anomaly.7507.ferengi.desc:0 "Même en ruine, une colonie oubliée peut encore valoir quelque chose. Récupération, vivres et biens échangeables ont tous un prix."
 anomaly.7507.e:0 "Récupérer tout ce qui a de la valeur."
 anomaly.7507.e.tt:0 "Récupérons les vivres, les fournitures et tout bien revendable."
 anomaly.7627.ferengi.desc:0 "Alliés, rivaux et opportunistes gravitent autour de toute affaire rentable. La clé n'est pas la confiance, mais l'avantage."
 anomaly.7627.e:0 "Transformer la situation en arrangement."
 anomaly.7627.e.tt:0 "Nous tirerons profit de cette rencontre en faisant payer chaque faveur."
 pre_warp_civ.11.e:0 "Un autre marché s'ouvrira un jour."
 pre_warp_civ.11.e.tt:0 "Leur avenir compte, parce que futurs clients, partenaires et débiteurs comptent."
