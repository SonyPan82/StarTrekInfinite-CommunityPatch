 cp26_bajoran_wormhole.2.name:0 "Trou de ver de Bajor confirmé"
 cp26_bajoran_wormhole.2.desc:0 "Les données des capteurs de la Ceinture Denorios sont sans ambiguïté. Une anomalie spatiale stable ouvre un corridor vers une région inconnue — que les explorateurs appellent déjà le Quadrant Gamma. Le passage ne peut être traversé physiquement, mais nos instruments peuvent détecter les vaisseaux qui s'y aventurent."
 cp26_bajoran_wormhole.2.ok:0 "Enregistrer la découverte."

 cp26_bajoran_wormhole.300.name:0 "Expédition dans le Quadrant Gamma"
 cp26_bajoran_wormhole.300.desc:0 "Une flotte est entrée dans le système Bajoran. Le Trou de ver de Bajor est actif. Le commandement doit décider de la marche à suivre — le Quadrant Gamma est vaste et ses habitants, inconnus."
 cp26_bajoran_wormhole.300.a:0 "Procéder avec prudence — chercher le contact."
 cp26_bajoran_wormhole.300.b:0 "Entrer avec une démonstration de force."
 cp26_bajoran_wormhole.300.c:0 "Tenir la position. Pas encore."

 cp26_bajoran_wormhole.310.name:0 "Premier contact dans le Quadrant Gamma"
 cp26_bajoran_wormhole.310.desc:0 "Nos vaisseaux émergent du trou de ver dans un système stellaire inconnu. Les capteurs longue portée détectent plusieurs vaisseaux d'un design inconnu qui maintiennent une distance prudente. Leur posture est vigilante, pas hostile — pour l'instant."
 cp26_bajoran_wormhole.310.a:0 "Tenter d'ouvrir un canal de communication."
 cp26_bajoran_wormhole.310.b:0 "Effectuer des relevés de capteurs et se retirer."

 cp26_bajoran_wormhole.311.name:0 "Échange diplomatique"
 cp26_bajoran_wormhole.311.desc:0 "L'échange est bref mais significatif. Les vaisseaux s'identifient comme serviteurs des Fondateurs — le Dominion. Ils sont curieux à l'égard des solides venus de l'autre côté. Ils se retirent sans hostilité. Pour l'instant, le Dominion observe."
 cp26_bajoran_wormhole.311.ok:0 "Une paix fragile, mais c'est la paix."

 cp26_bajoran_wormhole.320.name:0 "Confrontation dans le Quadrant Gamma"
 cp26_bajoran_wormhole.320.desc:0 "Notre flotte émerge du trou de ver en posture de combat. Les vaisseaux Jem'Hadar qui nous surveillaient passent immédiatement à l'interception. Leurs systèmes de ciblage sont verrouillés. Le commandement doit agir."
 cp26_bajoran_wormhole.320.a:0 "Poursuivre l'engagement."
 cp26_bajoran_wormhole.320.b:0 "Se mettre en veille et se retirer."

 cp26_bajoran_wormhole.321.name:0 "Représailles du Dominion"
 cp26_bajoran_wormhole.321.desc:0 "Nos vaisseaux ont forcé un repli — mais le Dominion n'oublie pas. Les renseignements confirment qu'une force d'assaut Jem'Hadar a émergé du Trou de ver de Bajor et opère dans le système Bajoran. Le Dominion n'entend pas rester dans le Quadrant Gamma."
 cp26_bajoran_wormhole.321.ok:0 "Préparer toutes les positions défensives."

 cp26_bajoran_wormhole.322.name:0 "Retrait enregistré"
 cp26_bajoran_wormhole.322.desc:0 "Nos vaisseaux ont interrompu le combat avant qu'il ne commence. Les Jem'Hadar maintiennent leur position à la sortie du trou de ver mais ne poursuivent pas. Une courte transmission est reçue : §I« Les Fondateurs observent. »§!"
 cp26_bajoran_wormhole.322.ok:0 "Compris. Maintenir l'état d'alerte."

 # --- Arc de découverte du trou de ver ---
 CP26_WORMHOLE_SURVEY:0 "Ceinture Denorios : Investigation des Neutrinos"
 CP26_WORMHOLE_SURVEY_DESC:0 "Stationnez un vaisseau scientifique avec un scientifique à bord sur le site de l'anomalie dans la Ceinture Denorios. Les perturbations de neutrinos sont extraordinaires — et pourraient indiquer quelque chose de bien plus grand qu'un simple phénomène stellaire."

 cp26_bajoran_wormhole.12.name:0 "Ceinture Denorios — Anomalies Détectées"
 cp26_bajoran_wormhole.12.desc:0 "Une flotte entrant dans le système Bajoran a détecté d'inhabituelles perturbations de neutrinos au sein de la Ceinture Denorios. La source est inconnue, mais les relevés ne correspondent à rien de précédemment enregistré.\n\nUne mission d'investigation scientifique est recommandée. Stationnez un vaisseau scientifique avec un scientifique à bord sur le site de l'anomalie pour commencer l'investigation."
 cp26_bajoran_wormhole.12.ok:0 "Dépêcher un vaisseau scientifique."

 cp26_bajoran_wormhole.21.name:0 "2369 — L'Anomalie de Denorios s'Intensifie"
 cp26_bajoran_wormhole.21.desc:0 "Les moniteurs scientifiques enregistrent une forte augmentation des émissions de neutrinos dans la Ceinture Denorios. Les relevés défient tous les modèles stellaires connus.\n\nLe Ministère des Sciences Bajoran a classé cela comme investigation prioritaire. Une mission d'investigation a été autorisée — stationnez un vaisseau scientifique avec un scientifique sur le site de l'anomalie dans le système Bajoran."
 cp26_bajoran_wormhole.21.ok:0 "Dépêcher immédiatement l'équipe d'investigation."
 voyager_plural:0 "Voyager"
 START_SCREEN_DOOMSDAY:0 "Votre monde natal est condamné. Votre peuple doit quitter son berceau avant qu'il ne soit trop tard."
 START_SCREEN_LITHOID:0 "Votre civilisation est issue de formes de vie minérales, endurantes et adaptées à des mondes que d'autres jugeraient hostiles."
 START_SCREEN_LOST_COLONY:0 "Votre peuple descend d'une colonie oubliée. Le moment est venu de découvrir ce qui est arrivé à votre monde d'origine."
 START_SCREEN_NECROPHAGE:0 "Votre société s'est bâtie autour d'une transformation biologique qui assimile les autres peuples à votre espèce dominante."
 START_SCREEN_NECROPHAGE_PEACEFUL:0 "Votre civilisation s'est développée autour d'une transformation ritualisée et contrôlée des espèces qui vivent sous votre autorité."
 START_SCREEN_REMNANTS:0 "Votre civilisation marche parmi les ruines d'un âge plus glorieux. Les vestiges du passé peuvent encore guider votre avenir."
 START_SCREEN_SHOULDERS_OF_GIANTS:0 "Votre espèce a trouvé des traces d'une puissance ancienne. En suivant ces indices, vous pourriez comprendre l'héritage qu'elle vous a laissé."
 START_SCREEN_TREE:0 "Votre peuple vit en symbiose avec un arbre colossal, source de vie, de mémoire et d'identité commune."
 START_SCREEN_VOID_DWELLERS:0 "Votre peuple a grandi dans l'espace, au sein d'habitats artificiels. Les mondes naturels sont désormais presque étrangers à votre civilisation."
