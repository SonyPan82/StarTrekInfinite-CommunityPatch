 CP26_BAJOR_FERENGI_BOTH_BAJOR:0 "Livraison aux rebelles bajorans"
 CP26_BAJOR_FERENGI_BOTH_BAJOR_DESC:0 "Premier volet de la double livraison : acheminez la cargaison vers le système de Bajor."
