 cp26_options.1.desc:0 "Ces réglages valent pour §Htoute la sauvegarde§!.\n\nChaque bouton affiche l’§Hétat actuel§!. Cliquez pour inverser l’option.\n\n§HFleet Cap§! : nombre maximum de vaisseaux militaires constructibles par empire. Vous pouvez choisir entre §Y120§! et §Y500§! coques.\n\n§HÉtats occupés diplomatiques CP26§! : ajoute aux empires éligibles une proposition d'État occupé. La cible doit être indépendante et en paix. Elle peut accepter ou refuser ; un refus donne un casus belli temporaire de subjugation. §YCette option est désactivée par défaut.§! Elle ne concerne jamais les Romuliens, qui conservent leur conversion Vanilla en État fantoche avec émissaire.\n\n§HSupernova§! : possibilité de désactiver la quête Supernova.\n§HLibération de Bajor§! : arc narratif incluant la libération de Bajor et l’apparition du trou de ver bajoran.\n§HMaraudeurs Nausicaans§! : active un empire pirate Nausicaan comme faction indépendante sur la carte (bêta).\n§HProjet Synth§! : offre du gameplay à la Fédération et aux Romuliens, inspiré de Star Trek : Picard."
 cp26_options.1.pirates_on:0 "Pirates : §Gactivés§!"
 cp26_options.1.pirates_on.tt:0 "Cliquez pour désactiver les pirates pour cette campagne."
 cp26_options.1.pirates_off:0 "Pirates : §Rdésactivés§!"
 cp26_options.1.pirates_off.tt:0 "Cliquez pour activer les pirates pour cette campagne."
cp26_options.1.vassalization_on:0 "États occupés diplomatiques : §Gactivés§!"
 cp26_options.1.vassalization_on.tt:0 "Les propositions d'États occupés CP26 sont actives pour les empires éligibles. Une cible indépendante et en paix peut accepter ou refuser ; un refus donne un casus belli temporaire de subjugation. Les Romuliens ne sont jamais concernés. Cliquez pour désactiver cette extension."
cp26_options.1.vassalization_off:0 "États occupés diplomatiques : §Rdésactivés§!"
 cp26_options.1.vassalization_off.tt:0 "Les propositions d'États occupés CP26 sont désactivées. Les Romuliens conservent toujours leur conversion Vanilla en État fantoche avec émissaire. Cliquez pour activer l'extension pour les autres empires éligibles."
 cp26_options.1.dominion_arc_on:0 "TESTING - Arc Dominion : §GACTIF§!"
 cp26_options.1.dominion_arc_on.tt:0 "§HÉtat actuel§! : arc Dominion §Gactivé§! (contenu CP26 expérimental possible).\n\n§YClic§! : le passer §Rdésactivé§! pour toute la sauvegarde (ticker + projets spéciaux Dominion stoppés).\n\n§YTESTING§! Équilibrage et scripts bougent encore - sauvegarde jetable si vous l’activez."
 cp26_options.1.dominion_arc_off:0 "TESTING - Arc Dominion : §RDÉSACTIVÉ§!"
 cp26_options.1.dominion_arc_off.tt:0 "§HÉtat actuel§! : arc Dominion §Rdésactivé§! (défaut prudent).\n\n§YClic§! : le passer §Gactivé§! pour toute la sauvegarde (autorisé quand le lore rattrape).\n\n§YTESTING§! Comportement encore instable ; laissez désactivé sur une partie sérieuse."
 cp26_options.1.supernova_quest_on:0 "Quête Supernova : §Gactivée§!"
 cp26_options.1.supernova_quest_on.tt:0 "Cliquez pour désactiver la quête Supernova pour cette campagne."
 cp26_options.1.supernova_quest_off:0 "Quête Supernova : §Rdésactivée§!"
 cp26_options.1.supernova_quest_off.tt:0 "Cliquez pour activer la quête Supernova pour cette campagne."

