l_french:
 lunar_one_colony:0 "Colonie de Lunar One"
 lunar_one_colony_desc:0 "Lunar One est le premier avant-poste scientifique en gravité réduite que l'humanité a construit sur sa propre Lune - un berceau de recherche qui attire encore les esprits les plus curieux de la Fédération."
 cp26_fleet_museum:0 "Musée de la Flotte"
 cp26_fleet_museum_DESC:0 "Une station-musée préservée exposant des vaisseaux historiques de Starfleet, dont le NX-01 et le NX-02."
 cp26_fleet_museum_MEGASTRUCTURE_DETAILS:0 "Une station-musée préservée exposant des vaisseaux historiques de Starfleet, dont le NX-01 et le NX-02."
 cp26_ufop_sector_governance_charter:0 "Charte de gouvernance sectorielle"
 cp26_ufop_sector_governance_charter_desc:0 "Assise administrative fédérale pour une Fédération multi-secteurs, atténuant l’étalement de l’empire en début de partie sans remplacer la bureaucratie des mondes membres."
 cp26_ufop_federal_power_bootstrap:0 "Stabilisation du réseau fédéral"
 cp26_ufop_federal_power_bootstrap_desc:0 "Allègement temporaire des contraintes de réseau et de comptabilité pendant que les mondes centraux et la logistique des bases stellaires retrouvent l'équilibre après la clôture fiscale de 2346. Augmente la production d'énergie à l'échelle de l'empire pendant plusieurs années."
 casus_belli_cb_liberation_war:0 "Indépendance"
 casus_belli_cb_liberation_war_acquire_hint:0 "Nous devons d'abord exiger que ce suzerain libère sa dépendance. En cas de refus, nous pourrons déclarer une guerre d'indépendance."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE:0 "Demander la capitulation"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_TYPE:0 "Demander la capitulation"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_TITLE:0 "Proposer d'accepter le but de guerre"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre. L'empire ciblé peut accepter ou refuser."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_OFFER_DESC:0 "§H[Actor.GetName]§! propose que nous acceptions son but de guerre."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_COST:0 "$ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC$"
 action_cp26_offer_war_goal_peace:0 "Demander la capitulation"
 action_cp26_offer_war_goal_peace_desc:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre et de mettre fin à la guerre."
 MIPO_MISSION_GENERIC_OPTION:0 "Reconnaître l'issue"
 MIPO_MISSION_GENERIC_OPTION_TT:0 "Résout cette étape de mission pour les empires hors des quatre grandes puissances, afin que l'IA et l'interface aient toujours un choix valide."
 CP26_VASSALIZATION_PENDING:0 "Une proposition de vassalisation est déjà en attente."
 CP26_WARGOAL_PEACE_PENDING:0 "Une proposition de paix est déjà en attente."
 SEND_DEMANDS:0 "Demander la capitulation"
 SEND_DEMANDS_DESC:0 "Envoyer une demande de capitulation. Le destinataire pourra accepter ou refuser notre proposition."
 FORCE_DEMANDS:0 "Imposer le but de guerre"
 FORCE_DEMANDS_DESC:0 "Imposer notre but de guerre si l'ennemi ne peut plus refuser."
 WAROVERVIEW_FORCE_DEMANDS:0 "Imposer le but de guerre"
 WAROVERVIEW_FORCE_DEMANDS_DESC:0 "Imposer notre but de guerre si l'ennemi ne peut plus refuser."
 PEACE_DEMAND:0 "Demander la capitulation"
 cp26_open_war_negotiation:0 "Ouvrir une négociation de guerre"
 cp26_open_war_negotiation_desc:0 "Ouvre une négociation de guerre CP26 pour demander à un empire ennemi actuel de capituler face à notre but de guerre."
 edict_cp26_open_war_negotiation:0 "Demander la capitulation ennemie"
 edict_cp26_open_war_negotiation_desc:0 "Demande à un empire ennemi actuel de capituler face à notre but de guerre. La cible peut accepter ou refuser. Cet édit redevient disponible après un court délai."
 cp26_war_negotiation.1.name:0 "Négociation de guerre"
 cp26_war_negotiation.1.desc:0 "Choisissez quel empire ennemi actuel recevra notre demande de capituler face à notre but de guerre."
