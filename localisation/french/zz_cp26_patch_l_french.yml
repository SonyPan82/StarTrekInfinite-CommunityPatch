 NAME_Nausicaan_Raiders:0 "Raider Nausicaans"
 cp26_fleet_museum_stage4:0 "Musée de la Flotte"
 cp26_fleet_museum_stage4_DESC:0 "L'Enterprise-E, classe Sovereign, complète désormais la collection étendue du musée. De l'Enterprise NX-01 au Voyager revenu du Quadrant Delta, l'ensemble retrace toute l'épopée moderne de Starfleet."
 cp26_fleet_museum_stage4_MEGASTRUCTURE_DETAILS:0 "L'Enterprise-E, classe Sovereign, complète désormais la collection étendue du musée. De l'Enterprise NX-01 au Voyager revenu du Quadrant Delta, l'ensemble retrace toute l'épopée moderne de Starfleet."
 qt_ufop_upgrade_voyager_lamarr:0 "Amélioration du Voyageur"
 qt_ufop_upgrade_voyager_lamarr_desc:0 "Janeway est revenue, et toutes les leçons du Quadrant Delta peuvent enfin être intégrées. Starfleet peut remettre le Voyager en service sous la forme d'un explorateur de classe Lamarr. Le vaisseau commissionné deviendra l'U.S.S. Voyager-A."
 cp26_museum.5.name:0 "Le Quadrant Delta rentre à la maison"
 cp26_museum.5.desc:0 "La coque originelle du Voyager a cédé sa place au nouveau Voyager-A de classe Lamarr. Le Musée de la Flotte peut préserver l'héritage du vaisseau grâce à une installation dédiée  -  500 minéraux, 100 dilithium et 50 influence pour honorer le navire revenu du Quadrant Delta."
 cp26_museum.5.a:0 "Autorisez l'installation. Le Voyager mérite sa place."
 cp26_museum.5.b:0 "Pas maintenant."
 cp26_voyager_lamarr.1.name:0 "Le Voyager-A est commissionné"
 cp26_voyager_lamarr.1.desc:0 "Starfleet a validé la refonte du Voyager. Le vaisseau doit maintenant rejoindre la starbase de Sol afin d'être entièrement reconstruit en explorateur de classe Lamarr."
 cp26_voyager_lamarr.2.name:0 "Le Voyager-A est commissionné"
 cp26_voyager_lamarr.2.desc:0 "La modernisation est achevée. L'ancienne coque Intrepid a été retirée du service puis remplacée par un explorateur de classe Lamarr. Sous le commandement de Kathryn Janeway, l'U.S.S. Voyager-A entre désormais en service."
 cp26_voyager_lamarr.2.a:0 "Mettez-le en service."
 cp26_voyager_lamarr.2.a.tt:0 "L'U.S.S. Voyager est remplacé par l'U.S.S. Voyager-A de classe Lamarr."
 tech_lamarr:0 "Schémas de la Lamarr"
 tech_lamarr_desc:0 "Les explorateurs de classe §HLamarr§! sont des croiseurs scientifiques de longue portée issus des enseignements opérationnels du retour de l'U.S.S. Voyager du Quadrant Delta."
