 cp26_minor_mission.16.name:0 "Mission de sauvetage accomplie"
 cp26_minor_mission.16.desc:0 "L'opération de sauvetage a réussi et la situation a été résolue sans complication supplémentaire."
 cp26_minor_mission.16.a:0 "Bien."
 cp26_minor_mission.16.a.tt:0 "La mission se résout avec succès."
 cp26_minor_mission.75.name:0 "La rébellion s'aggrave"
 cp26_minor_mission.75.desc:0 "La situation s'est détériorée et la mission se termine par un échec."
 cp26_minor_mission.75.a:0 "Compris."
 cp26_minor_mission.75.a.tt:0 "La mission échoue proprement."
 cp26_minor_mission.145.name:0 "Conférence de paix échouée"
 cp26_minor_mission.145.desc:0 "Notre délégation n'a pas obtenu le résultat espéré. La mission se termine sans succès, mais la situation reste sous contrôle."
 cp26_minor_mission.145.a:0 "Nous passons à autre chose."
 cp26_minor_mission.145.a.tt:0 "La mission échoue proprement."
 cp26_minor_mission.177.name:0 "Incident lors de l'inauguration"
 cp26_minor_mission.177.desc:0 "L'inauguration ne s'est pas déroulée comme prévu. Nous pouvons limiter les dégâts et poursuivre."
 cp26_minor_mission.177.a:0 "Compris."
 cp26_minor_mission.177.a.tt:0 "La mission échoue sans bloquer l'IA."
 cp26_minor_mission.214.name:0 "Mission d'escorte accomplie"
 cp26_minor_mission.214.desc:0 "L'opération d'escorte s'achève avec succès et les suites diplomatiques sont réglées."
 cp26_minor_mission.214.a:0 "Excellent."
 cp26_minor_mission.214.a.tt:0 "La mission se résout avec succès."
