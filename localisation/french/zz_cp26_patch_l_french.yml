 cp26_open_war_negotiation:0 "Ouvrir une négociation de guerre"
 cp26_open_war_negotiation_desc:0 "Ouvre une négociation de guerre CP26 pour demander à un empire ennemi actuel de capituler face à notre but de guerre."
 edict_cp26_open_war_negotiation:0 "Demander la capitulation ennemie"
 edict_cp26_open_war_negotiation_desc:0 "Demande à un empire ennemi actuel de capituler face à notre but de guerre. La cible peut accepter ou refuser. Cet édit redevient disponible après un court délai."
 cp26_war_negotiation.1.name:0 "Négociation de guerre"
 cp26_war_negotiation.1.desc:0 "Choisissez quel empire ennemi actuel recevra notre demande de capituler face à notre but de guerre."
