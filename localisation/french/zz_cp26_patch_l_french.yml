 # Arc Romulien - Journal de mission (chaîne d'événements)
event_chain_cp26_rom_spy_mission_chain_title:0 "Operation : Projet Synth"
event_chain_cp26_rom_spy_mission_chain_desc:0 "Un vaisseau espion a été envoyé dans le système Sol. L'agent doit atteindre la Terre et extraire les données comportementales A500 des archives d'Utopia Planitia dans les 215 jours. En cas de succès, l'Empire stellaire romulien pourra déclencher à distance des insurrections synthétiques sur les mondes ennemis."
cp26_rom_spy_mission_chain_title:0 "Operation : Projet Synth"
cp26_rom_spy_mission_chain_desc:0 "Un vaisseau espion a été envoyé dans le système Sol. L'agent doit atteindre la Terre et extraire les données comportementales A500 des archives d'Utopia Planitia dans les 215 jours. En cas de succès, l'Empire stellaire romulien pourra déclencher à distance des insurrections synthétiques sur les mondes ennemis."
event_chain_cp26_synth_rebellion_chain_title:0 "Rébellion synthétique"
event_chain_cp26_synth_rebellion_chain_desc:0 "Une colonie fédérale a été frappée par un déclenchement hostile des unités A500. Déployez un transport contenant au moins une armée d'assaut pour reprendre le contrôle de la planète."
cp26_synth_rebellion_chain_title:0 "Rébellion synthétique"
cp26_synth_rebellion_chain_desc:0 "Une colonie fédérale a été frappée par un déclenchement hostile des unités A500. Déployez un transport contenant au moins une armée d'assaut pour reprendre le contrôle de la planète."
CP26_SYNTH_GROUND_ASSAULT:0 "Projet Synth - Envoyer des troupes au sol"
CP26_SYNTH_GROUND_ASSAULT_DESC:0 "Une rébellion A500 est en cours sur cette planète. Affectez à cette opération un transport contenant au moins une armée d'assaut afin d'y projeter des troupes et de rétablir le contrôle fédéral."

 # Modificateur de surveillance sur Earth
 cp26_rom_earth_surveillance:0 "Activité subspaciale anormale"
 cp26_rom_earth_surveillance_desc:0 "Les capteurs de Starfleet détectent des anomalies subspaciales de faible intensité compatibles avec des opérations de renseignement clandestines. La source n'a pas été identifiée."

