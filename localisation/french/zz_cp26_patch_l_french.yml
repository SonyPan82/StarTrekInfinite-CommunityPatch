 cp26_daystrom_chain:0 "Projet Daystrom"
 cp26_daystrom_chain_title:0 "Projet Daystrom"
 cp26_daystrom_chain_desc:0 "Les recherches menées à la station Daystrom se poursuivent. Les équipes scientifiques testent des protocoles de plus en plus instables, et la situation devra être suivie de près."

 # Localisation taille vaisseau - Enterprise Odyssey
 enterprise_odyssey:0 "Odyssey"
 enterprise_odyssey_plural:0 "Odysseys"

 CP26_A500_GROUND_ASSAULT_SCIENCE:0 "A500 - Intervention négociée sous escorte"
 CP26_A500_GROUND_ASSAULT_SCIENCE_DESC:0 "L'équipe technique a établi un protocole de désescalade, mais les synthétiques refusent de se rendre sans pression militaire. Des troupes d'assaut doivent être déployées en orbite pour appuyer la négociation et forcer la reddition d'Utopia Planitia."

 # ── Arc Wormhole Bajoran ──────────────────────────────────────────────
 cp26_bajoran_wormhole_chain:0 "Anomalie de Bajor"
 cp26_bajoran_wormhole_chain_title:0 "Anomalie de Bajor"
 cp26_bajoran_wormhole_chain_desc:0 "Des perturbations inhabituelles ont été détectées dans la Ceinture Denorios. Une investigation est en cours."

 cp26_bajoran_wormhole.10.name:0 "Anomalie dans la Ceinture Denorios"
 cp26_bajoran_wormhole.10.desc:0 "Des instruments en orbite de Bajor ont capté des perturbations de neutrinos inhabituelles dans la Ceinture Denorios - une zone de l'espace généralement stable. L'origine est inconnue. Starfleet recommande une investigation."
 cp26_bajoran_wormhole.10.a:0 "Dépêcher un vaisseau scientifique."
 cp26_bajoran_wormhole.10.b:0 "Ne rien faire pour l'instant."

 cp26_bajoran_wormhole.20.name:0 "Anomalie dans la Ceinture Denorios"
 cp26_bajoran_wormhole.20.desc:0 "Des capteurs installés dans le secteur de Bajor ont détecté des perturbations énergétiques anormales dans la Ceinture Denorios. La nature de ces anomalies est inconnue, mais le Grand Conseil ne laissera pas passer une telle opportunité sans investigation."
 cp26_bajoran_wormhole.20.a:0 "Envoyer un corps expéditionnaire - vaisseaux de science et militaire."
 cp26_bajoran_wormhole.20.b:0 "Cela ne mérite pas notre attention."

 cp26_bajoran_wormhole.30.name:0 "Anomalie dans la Ceinture Denorios"
 cp26_bajoran_wormhole.30.desc:0 "Le Bureau Obsidien a transmis des données relatives à des anomalies neutrino anormales dans la Ceinture Denorios, à proximité de Bajor. Une perturbation de cette nature pourrait avoir des implications stratégiques."
 cp26_bajoran_wormhole.30.a:0 "Envoyer un vaisseau scientifique d'investigation."
 cp26_bajoran_wormhole.30.b:0 "Envoyer un vaisseau espion en reconnaissance discrète."
 cp26_bajoran_wormhole.30.c:0 "Ne rien faire."

 cp26_bajoran_wormhole.40.name:0 "Anomalie dans la Ceinture Denorios"
 cp26_bajoran_wormhole.40.desc:0 "Le Sénat a été informé de perturbations spatiales inexpliquées dans la Ceinture Denorios, à proximité de Bajor. Des données préliminaires suggèrent une anomalie d'une nature inhabituelle. Le Tal Shiar est intéressé."
 cp26_bajoran_wormhole.40.a:0 "Envoyer un vaisseau espion - étudier cela de près."
 cp26_bajoran_wormhole.40.b:0 "Cela devrait suffire à occuper la Fédération."

 cp26_bajoran_wormhole.50.name:0 "Anomalie dans la Ceinture Denorios"
 cp26_bajoran_wormhole.50.desc:0 "Nos agents commerciaux dans le secteur de Bajor ont signalé des perturbations spatiales inhabituelles dans la Ceinture Denorios. Toute anomalie inexpliquée représente une opportunité - si tant est qu'on sache en tirer profit."
 cp26_bajoran_wormhole.50.a:0 "Envoyer un prospecteur pour évaluer les possibilités."
 cp26_bajoran_wormhole.50.b:0 "Organiser une colonie de touristes dans le secteur. §Y+1 000 §Gcrédits énergétiques§!"
 cp26_bajoran_wormhole.50.c:0 "Ne rien faire."

 cp26_bajoran_wormhole.100.name:0 "Trou de ver découvert dans la Ceinture Denorios"
 cp26_bajoran_wormhole.100.desc:0 "Les instruments confirment l'existence d'une ouverture subspatiale stable au cœur de la Ceinture Denorios, entre Bajor IX et Bajor X. L'anomalie forme un corridor vers une région inconnue de la galaxie. Il est déjà question d'un \"Quadrant Gamma\"."

 cp26_bajoran_wormhole.100.a_ufop:0 "Extraordinaire. Nous devons explorer."
 cp26_bajoran_wormhole.100.b_ufop:0 "Restons prudents. Aucune action précipitée."
 cp26_bajoran_wormhole.100.a_klingon:0 "Une porte vers Sto-vo-kor !"
 cp26_bajoran_wormhole.100.b_klingon:0 "Cela ne nous regarde pas."
 cp26_bajoran_wormhole.100.a_cardassian:0 "Intéressant. Nous devons reprendre le contrôle de Bajor."
 cp26_bajoran_wormhole.100.b_cardassian:0 "Intéressant. Nous allons surveiller cela de loin."
 cp26_bajoran_wormhole.100.a_romulan:0 "Nous allons étudier cela de très près."
 cp26_bajoran_wormhole.100.b_romulan:0 "Cela devrait efficacement occuper la Fédération."
 cp26_bajoran_wormhole.100.a_ferengi:0 "Un nouveau monde d'opportunités s'ouvre à nous !"
 cp26_bajoran_wormhole.100.b_ferengi:0 "Étudions la possibilité de mettre un péage."

 # Projets
 CP26_BAJORAN_WORMHOLE_SURVEY_UFOP:0 "Investigation de l'anomalie Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_UFOP_DESC:0 "Stationner un vaisseau scientifique dans la Ceinture Denorios pour analyser les perturbations neutrino détectées. Les résultats pourraient révéler quelque chose d'extraordinaire."
 CP26_BAJORAN_WORMHOLE_SURVEY_KLINGON:0 "Corps expéditionnaire - Ceinture Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_KLINGON_DESC:0 "Un vaisseau de science escorté d'un bâtiment militaire est déployé dans la Ceinture Denorios. L'Empire ne prend pas de risques."
 CP26_BAJORAN_WORMHOLE_SURVEY_CARDASSIAN_SCIENCE:0 "Investigation scientifique - Ceinture Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_CARDASSIAN_SCIENCE_DESC:0 "Un vaisseau scientifique cardassien est envoyé analyser les perturbations dans la Ceinture Denorios."
 CP26_BAJORAN_WORMHOLE_SURVEY_CARDASSIAN_SPY:0 "Reconnaissance discrète - Ceinture Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_CARDASSIAN_SPY_DESC:0 "Un vaisseau d'espionnage est déployé discrètement pour analyser l'anomalie sans attirer l'attention."
 CP26_BAJORAN_WORMHOLE_SURVEY_ROMULAN:0 "Surveillance du Tal Shiar - Ceinture Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_ROMULAN_DESC:0 "Un vaisseau espion romain est chargé d'analyser l'anomalie dans l'ombre."
 CP26_BAJORAN_WORMHOLE_SURVEY_FERENGI:0 "Prospection commerciale - Ceinture Denorios"
 CP26_BAJORAN_WORMHOLE_SURVEY_FERENGI_DESC:0 "Un prospecteur Ferengi est envoyé évaluer le potentiel économique de l'anomalie dans la Ceinture Denorios."

 # Arc A500 - Event intermédiaire cp26_a500.15
 cp26_a500.15.title:0 "Utopia Planitia : Rapport préliminaire"
 cp26_a500.15.desc_science:0 "Notre équipe d'ingénieurs est désormais sur place à Utopia Planitia. Les premières analyses des unités A500 sont en cours. Les données sont préoccupantes - les synthétiques semblent avoir développé des protocoles de communication autonomes non autorisés. Nos équipes maintiennent la situation sous contrôle pour l'instant."
 cp26_a500.15.desc_military:0 "Nos troupes examinent activement les androïdes A500 qui montrent des comportements anormaux. Le périmètre de sécurité autour d'Utopia Planitia est établi. Cependant les unités A500 refusent de coopérer et la situation se dégrade. Nous avons besoin de renforts pour contenir l'escalade."
 cp26_a500.15.desc_governor:0 "Le gouverneur supervise la situation à Utopia Planitia. Les unités A500 montrent une résistance croissante aux directives administratives. La situation requiert une attention immédiate de toutes les ressources disponibles."
 cp26_a500.15.a:0 "Bien reçu. Nous surveillons la situation."

 # Ground assault projets - nouveaux
 CP26_A500_GROUND_ASSAULT_SCIENCE:0 "A500 - Analyse scientifique d'urgence"
 CP26_A500_GROUND_ASSAULT_SCIENCE_DESC:0 "L'armée tient le périmètre mais ne peut pas désactiver les A500 sans comprendre leur architecture. Un vaisseau scientifique doit être dépêché à Mars pour analyser le réseau et identifier un protocole de désactivation."
 CP26_A500_GROUND_ASSAULT_GOVERNOR:0 "A500 - Intervention coordonnée"
 CP26_A500_GROUND_ASSAULT_GOVERNOR_DESC:0 "La rébellion nécessite une réponse coordonnée. Un vaisseau scientifique et des troupes d'assaut doivent être déployés conjointement pour reprendre Utopia Planitia."

 CP26_A500_GROUND_ASSAULT_HARD:0 "A500 - Intervention d'urgence totale"
 CP26_A500_GROUND_ASSAULT_HARD_DESC:0 "La situation à Utopia Planitia a dégénéré sans contrôle. Une force d'intervention massive est requise : trois vaisseaux militaires, un vaisseau scientifique et des troupes d'assaut doivent être déployés simultanément pour reprendre les chantiers navals martiens."

 WORMHOLE_NAME:0 "Trou de ver de Bajor"

