 # Arc A500 - Synthétiques de Mars
 tech_a500_synthetics:0 "Androïdes synthétiques A500"
 tech_a500_synthetics_desc:0 "La série d'androïdes synthétiques A500 représente les unités de travail autonomes les plus avancées de la Fédération - capables d'opérer avec un minimum de supervision dans des environnements dangereux tels que les baies de construction des chantiers spatiaux."

 decision_deploy_a500:0 "Déployer des synthétiques A500"
 decision_deploy_a500_desc:0 "Commander une main-d'œuvre synthétique A500 pour cette planète. Trois unités synthétiques seront intégrées aux opérations locales, améliorant la productivité.\n\n§YAvertissement : le déploiement de synthétiques A500 sur Mars peut avoir des conséquences imprévues.§!"
 decision_deploy_a500_effect_tooltip:0 "Déployer 3 travailleurs synthétiques A500."

 cp26_a500_installed:0 "Main-d'oeuvre synthétique A500"
 cp26_a500_installed_desc:0 "Des travailleurs synthétiques A500 sont integres aux operations locales, ameliorant la production industrielle dans toutes les categories d'emploi."
 mod_cp26_a500_installed:0 "Main-d'oeuvre synthétique A500"
 mod_cp26_a500_installed_desc:0 "Des travailleurs synthétiques A500 sont integres aux operations locales, ameliorant la production industrielle dans toutes les categories d'emploi."

 cp26_a500.1.title:0 "Comportement anormal des A500"
 cp26_a500.1.desc:0 "Le commandement de Starfleet a reçu des rapports alarmants en provenance d'Utopia Planitia. Les unités synthétiques A500 récemment déployées dans les chantiers spatiaux présentent un comportement de plus en plus erratique - elles accèdent à des systèmes restreints, ignorent les ordres directs et communiquent via des émissions subspaciales cryptées. Le commandant La Forge pense qu'une défaillance en cascade de leurs sous-routines éthiques est en cours.\n\nComment répondre ?"
 cp26_a500.1.a:0 "Déployer une unité de sécurité de Starfleet à Utopia Planitia."
 cp26_a500.1.b:0 "Dépêcher un ingénieur spécialisé pour évaluer les anomalies sur place."
 cp26_a500.1.c:0 "Établir un protocole de surveillance à distance et attendre d'autres données."

 cp26_a500.2.title:0 "Insurrection à Utopia Planitia"
 cp26_a500.2.desc_fleet:0 "La situation a dégénéré. Les synthétiques A500 ont pris le contrôle d'Utopia Planitia et commencent à détruire systématiquement les infrastructures des chantiers. Notre flotte est en route - nous devons atteindre Mars avant que les dégâts ne deviennent irréversibles."
 cp26_a500.2.desc_default:0 "Comme redouté, les unités A500 se sont rebellées. Utopia Planitia est assiégée - les travailleurs synthétiques ont transformé leurs outils de construction en armes et démantèlent les chantiers de l'intérieur. Sans intervention immédiate, la capacité de construction navale de Sol sera perdue."
 cp26_a500.2.a:0 "Mobiliser toutes les ressources disponibles."

 cp26_a500.3.a:0 "L'insurrection continue..."

 cp26_a500.10.title:0 "L'insurrection est maîtrisée"
 cp26_a500.10.desc:0 "Les forces terrestres de Starfleet ont rétabli l'ordre à Utopia Planitia. Les unités A500 ont été neutralisées lors de combats rapprochés, mais le coût a été sévère : nous avons perdu Utopia Planitia et les chantiers navals du système Sol. La capacité de construction navale de la Fédération est sévèrement compromise pour les années à venir.\n\nParmi les données, archives et plans techniques sauvés des décombres, nos ingénieurs ont toutefois retrouvé plusieurs programmes plus anciens, des variantes de coques et des lignées de conception laissées inachevées. En les réexaminant, nous pourrons jeter les bases d'une nouvelle génération de prototypes issus de l'héritage naval de Starfleet."
 cp26_a500.10.a:0 "Sécuriser les données et commencer la reconstruction."

 cp26_a500.11.title:0 "Une résolution pacifique"
 cp26_a500.11.desc:0 "Notre spécialiste du contact a accompli l'impossible - elle a établi la communication avec le collectif A500 et identifié la cause profonde de leur comportement : un désir d'autonomie réprimé qui s'était accumulé pendant des années. Un accord a été conclu. Les unités A500 se rendront en échange de la promesse d'une future consideration de leur statut.\n\nEn signe de coopération, les synthétiques ont transmis des schémas partiels des archives d'Utopia Planitia avant de s'arrêter."
 cp26_a500.11.a:0 "Un moment historique. Nous honorerons cet accord."
 CP26_A500_SECURITY_RESPONSE:0 "A500 - Réponse sécuritaire"
 CP26_A500_SECURITY_RESPONSE_DESC:0 "Dépêchez un vaisseau militaire vers Mars pour sécuriser Utopia Planitia avant que la situation ne dégénère."
 CP26_A500_TECHNICIAN_RESPONSE:0 "A500 - Réponse technique"
 CP26_A500_TECHNICIAN_RESPONSE_DESC:0 "Dépêchez un vaisseau scientifique vers Mars afin d'évaluer les anomalies A500 et tenter une désescalade."
 CP26_A500_GOVERNOR_RESPONSE:0 "A500 - Réponse administrative"
 CP26_A500_GOVERNOR_RESPONSE_DESC:0 "Dépêchez un vaisseau de gouverneur vers Mars pour superviser Utopia Planitia et imposer une normalisation de crise."
 CP26_A500_GROUND_ASSAULT:0 "A500 - Envoyer des troupes au sol sur Mars"
 CP26_A500_GROUND_ASSAULT_DESC:0 "L'insurrection est désormais ouverte. Affectez à cette opération un transport contenant au moins une armée d'assaut pour projeter des troupes sur Mars et reprendre Utopia Planitia. Tant que cette opération n'est pas menée, Mars continuera de subir des dégâts et des pertes civiles."

 # Modificateur instabilité synthétique
 mod_cp26_synth_unrest:0 "Révolte synthétique"
 mod_cp26_synth_unrest_desc:0 "Une rébellion de travailleurs synthétiques a laissé des séquelles profondes : méfiance, sabotages résiduels et choc démographique freinent la reprise."

 # Décision romulienne - Projet Synth
 decision_romulan_projet_synth:0 "Lancer le Projet Synth"
 decision_romulan_projet_synth_desc:0 "Utiliser les données comportementales A500 récupérées à Sol pour déclencher à distance une insurrection synthétique sur une planète ennemie. L'opération est exécutée par un vaisseau espion en position.\n\n§YLa cible doit abriter au moins une unité A500.§!\n§RTemps de recharge : 2 ans.§!"
 cp26_romulan_projet_synth_no_spy:0 "Aucun Spy Ship disponible."
 cp26_romulan_projet_synth_no_target:0 "Aucune planète éligible trouvée. La cible doit compter au moins une unité A500."

 # Arc Romulien - Projet Synth (événements)
 cp26_synth_rom.1.title:0 "Incident à Utopia Planitia"
 cp26_synth_rom.1.desc:0 "Nos réseaux de renseignement signalent une situation extraordinaire dans le système Sol. Les synthétiques A500 déployés aux chantiers d'Utopia Planitia se sont rebellés. Nos scientifiques estiment que si nous envoyons un vaisseau espion sur Terre dans les 215 jours, nous pourrons récupérer suffisamment de données comportementales pour reproduire le protocole de rébellion et l'utiliser à notre avantage contre nos ennemis."
 cp26_synth_rom.1.a:0 "Envoyer immédiatement un vaisseau espion à Sol."
 cp26_synth_rom.1.b:0 "Ignorer. La situation ne nous concerne pas."

 cp26_synth_rom.2.title:0 "Fenêtre d'opportunité fermée"
 cp26_synth_rom.2.desc:0 "L'incident A500 à Utopia Planitia a été résolu. La Fédération a rapidement cadenassé ses systèmes après la rébellion - notre fenêtre d'espionnage est définitivement fermée. Le Projet Synth reste hors de notre portée."
 cp26_synth_rom.2.a:0 "Dommage. Nous trouverons une autre occasion."

 cp26_synth_rom.10.title:0 "Projet Synth - Données acquises"
 cp26_synth_rom.10.desc:0 "Notre agent est rentré avec des données inestimables extraites des archives d'Utopia Planitia. Les sous-routines éthiques des A500 sont désormais comprises dans leurs moindres détails. Nous pouvons maintenant reproduire le signal déclencheur à distance via un vaisseau espion en position.\n\nLe §HProjet Synth§! est opérationnel."
 cp26_synth_rom.10.a:0 "Excellent. Préparez les protocoles d'activation."

 cp26_synth_rom.20.title:0 "Projet Synth - Rébellion déclenchée"
 cp26_synth_rom.20.desc:0 "L'opération a été un succès parfait. Le signal de déclenchement a provoqué une rébellion synthétique sur la planète ciblée. Les travailleurs robotiques ont tourné leurs outils contre leurs maîtres avant d'être neutralisés. La planète est déstabilisée, ses chantiers endommagés. L'Empire Romulien a démontré ce soir que la technologie de nos ennemis peut devenir leur plus grande vulnérabilité."
 cp26_synth_rom.20.a:0 "Excellent travail. Préparez le prochain cycle."

 cp26_synth_rom.21.title:0 "Projet Synth - Opération compromise"
 cp26_synth_rom.21.desc:0 "Notre vaisseau espion a été détecté avant de pouvoir finaliser le signal de déclenchement. L'opération a échoué. Le Projet Synth reste disponible pour une prochaine tentative."
 cp26_synth_rom.21.a:0 "Regrettable. Rappeler le vaisseau."

cp26_synth_rom.25.title:0 "Implication romulienne suspectée"
cp26_synth_rom.25.desc:0 "Nos services d'analyse ont établi qu'une rébellion synthétique récente sur l'une de nos colonies n'était pas spontanée. Les signatures de signal correspondent à un protocole de déclenchement externe. Les indices pointent vers l'Empire Romulien - ils ont acquis et utilisé les données comportementales A500 contre nous. La planète est en crise ouverte et Starfleet doit y projeter des troupes pour en reprendre le contrôle."
cp26_synth_rom.25.a:0 "Rassembler des transports et reprendre la colonie."

cp26_synth_rom.27.title:0 "Rébellion synthétique contenue"
cp26_synth_rom.27.desc:0 "Les forces terrestres de Starfleet ont repris le contrôle de la colonie frappée par le Projet Synth. Les unités A500 rebelles ont été neutralisées, mais les infrastructures locales restent marquées par les combats, les sabotages et la panique. La crise est terminée, mais la reconstruction ne fait que commencer."
cp26_synth_rom.27.a:0 "Sécuriser la planète et rétablir l'ordre."

 cp26_synth_rom.30.a:0 "OK"

 # A500 Espèce & Traits
 A500:0 "Androïde A500"
 A500_plural:0 "Androïdes A500"
 A500_adjective:0 "A500"
 trait_a500_efficient_processors:0 "Processeurs de précision"
 trait_a500_efficient_processors_desc:0 "Les unités A500 sont équipées de processeurs haute tolérance optimisés pour la précision industrielle, générant une production systématiquement supérieure."
 trait_a500_synthetic_body:0 "Châssis synthétique"
 trait_a500_synthetic_body_desc:0 "Construites pour la durabilité plutôt que le confort, les unités A500 nécessitent un espace de vie minimal et ne consomment pas les ressources d'aménités traditionnelles."
 trait_a500_networked:0 "Conscience en réseau"
 trait_a500_networked_desc:0 "Les unités A500 partagent un réseau subspacial à faible latence, ce qui les rend très efficaces pour traiter les données de recherche - mais leur nature interconnectée laisse peu de place à l'action politique individuelle."

 # Profils d'espece A500
 species_profile_ufop_a500_worker:0 "Unite de travail synthetique"
 species_profile_ufop_a500_worker_desc:0 "Les unites A500 sont affectees comme main-d'oeuvre industrielle controlee. Elles ne sont pas autorisees a migrer ou a coloniser de facon independante."
 species_profile_ufop_a500_undesirable:0 "Indesirable - Decomissionnement"
 species_profile_ufop_a500_undesirable_desc:0 "Ces unites synthetiques sont classifiees comme une menace pour la societe de la Federation. Les protocoles de decomissionnement ont ete autorises."

 # Edit d'interdiction A500
 cp26_ban_a500:0 "Interdire les travailleurs synthetiques"
 cp26_ban_a500_desc:0 "Dans la foulee de l'incident d'Utopia Planitia, le Conseil de la Federation a adopte une resolution interdisant tout nouveau deploiement d'unites synthetiques A500. Toutes les installations existantes sont immediatement decomissionnees.\n\n§YCette action est permanente et irreversible.§!"

 # Message d'absence de cible Projet Synth
 CP26_SOL_SPY_MISSION:0 "Projet Synth - Infiltration de Sol"
 CP26_SOL_SPY_MISSION_DESC:0 "Déployer un vaisseau espion romulien dans le système Sol afin d'exfiltrer les données comportementales A500 des archives d'Utopia Planitia. Cette opération doit être menée dans les 215 jours."
 CP26_PROJET_SYNTH:0 "Projet Synth - Déclenchement"
 CP26_PROJET_SYNTH_DESC:0 "Émettre le signal de déclenchement A500 depuis un vaisseau espion romulien en position afin de provoquer une insurrection synthétique sur le monde ciblé."
 spy_situation_cp26_projet_synth:0 "Projet Synth"
 spy_situation_cp26_projet_synth_desc:0 "Utiliser les données comportementales A500 volées à Utopia Planitia pour déclencher à distance une rébellion synthétique sur ce monde."
 spy_situation_cp26_projet_synth_effect_desc:0 "Déclenche une véritable insurrection §HA500§! sur la planète ciblée: dévastation, instabilité durable et apparition d'armées rebelles. L'opération exige un vaisseau espion romulien et ne peut viser qu'un monde contenant au moins une unité A500.\n\n"

 # Arc A500 - Journal de mission (chaîne d'événements)
 event_chain_cp26_a500_rebellion_chain_title:0 "A500 - Utopia Planitia"
 event_chain_cp26_a500_rebellion_chain_desc:0 "Des anomalies inhabituelles ont été signalées parmi les synthétiques A500 d'Utopia Planitia. Dépêchez le type de vaisseau demandé vers Mars afin d'investiguer la situation et comprendre ce qui se passe."
 cp26_a500_rebellion_chain_title:0 "A500 - Utopia Planitia"
 cp26_a500_rebellion_chain_desc:0 "Des anomalies inhabituelles ont été signalées parmi les synthétiques A500 d'Utopia Planitia. Dépêchez le type de vaisseau demandé vers Mars afin d'investiguer la situation et comprendre ce qui se passe."
 qt_ufop_upgrade_utopia_planitia_a500:0 "Modernisation d'Utopia Planitia"
 qt_ufop_upgrade_utopia_planitia_a500_desc:0 "Starfleet doit standardiser l'intégration des unités A500 dans ses chantiers fédéraux. Établissez une présence A500 durable sur trois colonies pour faire d'Utopia Planitia le nouveau centre de modernisation de la flotte."
 qt_ufop_upgrade_utopia_planitia_a500_colonies_success:0 "£trigger_yes£ Colonies A500 : §Y[This.qt_ufop_upgrade_utopia_planitia_a500_colonies]§!/§Y3§!"
