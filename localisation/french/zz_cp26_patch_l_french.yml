 cp26_options.1.synth_arc_on.tt:0 "Cliquez pour désactiver l'arc narratif de la Rébellion Synthétique (Utopia Planitia) pour cette campagne."
 cp26_options.1.synth_arc_off:0 "Rébellion Synthétique (TESTING) : §Rdésactivée§!"
 cp26_options.1.synth_arc_off.tt:0 "Cliquez pour activer l'arc narratif de la Rébellion Synthétique (Utopia Planitia) pour cette campagne."

 # Modificateur instabilité synthétique
 mod_cp26_synth_unrest:0 "Révolte synthétique"
 mod_cp26_synth_unrest_desc:0 "Une rébellion de travailleurs synthétiques a laissé des séquelles profondes : méfiance, sabotages résiduels et choc démographique freinent la reprise."

 # Décision romulienne - Projet Synth
 decision_romulan_projet_synth:0 "Lancer le Projet Synth"
 decision_romulan_projet_synth_desc:0 "Utiliser les données comportementales A500 récupérées à Sol pour déclencher à distance une rébellion synthétique sur une planète ennemie. L'opération est exécutée par un Spy Ship en position.\n\n§YImpossible sur les capitales et sur Terre.§!\n§RTemps de recharge : 2 ans.§!"
 cp26_romulan_projet_synth_no_spy:0 "Aucun Spy Ship disponible."
 cp26_romulan_projet_synth_no_target:0 "Aucune planète cible éligible (doit contenir des pops robotiques, hors capitale)."

 # Arc Romulien - Projet Synth (événements)
 cp26_synth_rom.1.title:0 "Incident à Utopia Planitia"
 cp26_synth_rom.1.desc:0 "Nos réseaux de renseignement signalent une situation extraordinaire dans le système Sol. Les synthétiques A500 déployés aux chantiers d'Utopia Planitia se sont rebellés. Nos scientifiques estiment que si nous envoyons un vaisseau espion sur Terre dans les 90 jours, nous pourrons récupérer suffisamment de données comportementales pour reproduire le protocole de rébellion - et l'utiliser à notre avantage contre nos ennemis."
 cp26_synth_rom.1.a:0 "Envoyer immédiatement un vaisseau espion à Sol."
 cp26_synth_rom.1.b:0 "Ignorer. La situation ne nous concerne pas."

 cp26_synth_rom.2.title:0 "Fenêtre d'opportunité fermée"
 cp26_synth_rom.2.desc:0 "L'incident A500 à Utopia Planitia a été résolu. La Fédération a rapidement cadenassé ses systèmes après la rébellion - notre fenêtre d'espionnage est définitivement fermée. Le Projet Synth reste hors de notre portée."
 cp26_synth_rom.2.a:0 "Dommage. Nous trouverons une autre occasion."

 cp26_synth_rom.10.title:0 "Projet Synth - Données acquises"
 cp26_synth_rom.10.desc:0 "Notre agent est rentré avec des données inestimables extraites des archives d'Utopia Planitia. Les sous-routines éthiques des A500 sont désormais comprises dans leurs moindres détails. Nous pouvons maintenant reproduire le signal déclencheur à distance via un vaisseau espion en position.\n\nLe §HProjet Synth§! est opérationnel."
 cp26_synth_rom.10.a:0 "Excellent. Préparez les protocoles d'activation."

 cp26_synth_rom.20.title:0 "Projet Synth - Rébellion déclenchée"
 cp26_synth_rom.20.desc:0 "L'opération a été un succès parfait. Le signal de déclenchement a provoqué une rébellion synthétique sur la planète ciblée. Les travailleurs robotiques ont tourné leurs outils contre leurs maîtres avant d'être neutralisés. La planète est déstabilisée, ses chantiers endommagés. L'Empire Romulien a démontré ce soir que la technologie de nos ennemis peut devenir leur plus grande vulnérabilité."
 cp26_synth_rom.20.a:0 "Excellent travail. Préparez le prochain cycle."

 cp26_synth_rom.21.title:0 "Projet Synth - Opération compromise"
 cp26_synth_rom.21.desc:0 "Notre vaisseau espion a été détecté avant de pouvoir finaliser le signal de déclenchement. L'opération a échoué. Le Projet Synth reste disponible pour une prochaine tentative."
 cp26_synth_rom.21.a:0 "Regrettable. Rappeler le vaisseau."

 cp26_synth_rom.25.title:0 "Implication romulienne suspectée"
 cp26_synth_rom.25.desc:0 "Nos services d'analyse ont établi qu'une rébellion synthétique récente sur l'une de nos colonies n'était pas spontanée. Les signatures de signal correspondent à un protocole de déclenchement externe. Les indices pointent vers l'Empire Romulien - ils ont acquis et utilisé les données comportementales A500 contre nous. Starfleet est en état d'alerte maximale."
 cp26_synth_rom.25.a:0 "Notifier Starfleet et renforcer tous les protocoles synthétiques."

 cp26_synth_rom.30.a:0 "OK"

 # A500 Espèce & Traits
 A500:0 "Androïde A500"
 A500_plural:0 "Androïdes A500"
 A500_adjective:0 "A500"
 trait_a500_efficient_processors:0 "Processeurs de précision"
 trait_a500_efficient_processors_desc:0 "Les unités A500 sont équipées de processeurs haute tolérance optimisés pour la précision industrielle, générant une production systématiquement supérieure."
 trait_a500_synthetic_body:0 "Châssis synthétique"
 trait_a500_synthetic_body_desc:0 "Construites pour la durabilité plutôt que le confort, les unités A500 nécessitent un espace de vie minimal et ne consomment pas les ressources d'aménités traditionnelles."
 trait_a500_networked:0 "Conscience en réseau"
 trait_a500_networked_desc:0 "Les unités A500 partagent un réseau subspacial à faible latence, ce qui les rend très efficaces pour traiter les données de recherche - mais leur nature interconnectée laisse peu de place à l'action politique individuelle."

 # Profils d'espece A500
 species_profile_ufop_a500_worker:0 "Unite de travail synthetique"
 species_profile_ufop_a500_worker_desc:0 "Les unites A500 sont affectees comme main-d'oeuvre industrielle controlee. Elles ne sont pas autorisees a migrer ou a coloniser de facon independante."
 species_profile_ufop_a500_undesirable:0 "Indesirable - Decomissionnement"
 species_profile_ufop_a500_undesirable_desc:0 "Ces unites synthetiques sont classifiees comme une menace pour la societe de la Federation. Les protocoles de decomissionnement ont ete autorises."

 # Edit d'interdiction A500
 cp26_ban_a500:0 "Interdire les travailleurs synthetiques"
 cp26_ban_a500_desc:0 "Dans la foulee de l'incident d'Utopia Planitia, le Conseil de la Federation a adopte une resolution interdisant tout nouveau deploiement d'unites synthetiques A500. Toutes les installations existantes sont immediatement decomissionnees.\n\n§YCette action est permanente et irreversible.§!"

 # Message d'absence de cible Projet Synth
 cp26_romulan_projet_synth_no_target:0 "Aucune planète éligible trouvée. La cible ne doit pas être une capitale, la Terre ou Mars, et doit compter au moins une unité A500."

 # Arc A500 - Journal de mission (chaîne d'événements)
 event_chain_cp26_a500_rebellion_chain_title:0 "Rébellion A500 - Utopia Planitia"
 event_chain_cp26_a500_rebellion_chain_desc:0 "Les synthétiques A500 d'Utopia Planitia se sont rebellés. Des unités rebelles ont pris le contrôle des installations. Envoyez un transport de troupes vers Mars pour écraser l'insurrection par le combat au sol."
 cp26_a500_rebellion_chain_title:0 "Rébellion A500 - Utopia Planitia"
 cp26_a500_rebellion_chain_desc:0 "Les synthétiques A500 d'Utopia Planitia se sont rebellés. Des unités rebelles ont pris le contrôle des installations. Envoyez un transport de troupes vers Mars pour écraser l'insurrection par le combat au sol."

 # Nom du pays rebelle
 NAME_A500_Rebels:0 "Rebelles A500"

 # Arc Romulien - Journal de mission (chaîne d'événements)
 event_chain_cp26_rom_spy_mission_chain_title:0 "Operation : Projet Synth"
 event_chain_cp26_rom_spy_mission_chain_desc:0 "Un vaisseau espion a été envoyé dans le système Sol. L'agent doit atteindre la Terre et extraire les données comportementales A500 des archives d'Utopia Planitia dans les 90 jours. En cas de succès, l'Empire stellaire romulien pourra déclencher à distance des rébellions synthétiques sur les mondes ennemis."
 cp26_rom_spy_mission_chain_title:0 "Operation : Projet Synth"
 cp26_rom_spy_mission_chain_desc:0 "Un vaisseau espion a été envoyé dans le système Sol. L'agent doit atteindre la Terre et extraire les données comportementales A500 des archives d'Utopia Planitia dans les 90 jours. En cas de succès, l'Empire stellaire romulien pourra déclencher à distance des rébellions synthétiques sur les mondes ennemis."

 # Modificateur de surveillance sur Earth
 cp26_rom_earth_surveillance:0 "Activité subspaciale anormale"
 cp26_rom_earth_surveillance_desc:0 "Les capteurs de Starfleet détectent des anomalies subspaciales de faible intensité compatibles avec des opérations de renseignement clandestines. La source n'a pas été identifiée."

 # Nettoyage HRB_TODO - marche, situations, diplomatie
 strategic_market_desc:0 "Achetez des matériaux rares via un marché stratégique géré par une enclave. Les stocks sont limités et les prix suivent la demande."

 negotiation_situation_type:0 "Arbitrage diplomatique"
 negotiation_situation_desc:0 "Un différend diplomatique est traité par des canaux d'arbitrage formels. Une négociation habile peut apaiser les tensions ou renforcer votre position."
 suspicious_flares_situation_type:0 "Éruptions suspectes"

ACTION_INSTIGATE_RIVALRY_DESC:3 "Encourage les tensions entre puissances étrangères afin de les pousser vers une rivalité ouverte."
ACTION_SUPPORT_RIVALRY_DESC:3 "Soutient un camp dans une rivalité émergente afin d'aggraver les relations et d'approfondir la fracture."
ACTION_DISSOLVE_NEUTRAL_ZONE_COST:1 "$ACTION_DISSOLVE_NEUTRAL_ZONE_DESC$"
 MEGASTRUCTURE_TAB_BUTTON:0 "§HMegastructure§!"
 SHIPYARD_TAB_BUTTON:0 "§HChantiers§!"
 ZOOM_TO_MEGA:0 "§HAller a la structure§!\n§GCliquez pour centrer la camera sur cette megastructure§!"
 tech_mm_energy_harvesting:0 "Blindage tétryon a mega-echelle"
 tech_mm_energy_harvesting_desc:0 "Un bouclier auto-alimente par l'etoile elle-meme et par les §H$tetryons$§! pourrait retenir davantage de lumiere stellaire au sein d'un $DYSON_SWARM$ et en accroitre fortement l'efficacite."
 ALLOW_SWARM_MAX:0 "§HDeverrouille l'amelioration de moteur stellaire :§! $DYSON_SWARM$"
 tech_mm_mega_aspirations:0 "Moteurs stellaires"
 tech_mm_mega_aspirations_desc:0 "Des constructions a l'echelle d'un systeme, telles qu'une sphere de Dyson fragmentee, sont desormais a notre portee. De tels moteurs stellaires peuvent nous apporter une richesse materielle auparavant impossible."
 MM_ENGINE_UNLOCK:0 "§HDeverrouille des megastructures limitees :§! Moteurs stellaires"
 ALLOW_STAR_LIFTER:0 "§HDeverrouille le moteur stellaire :§! $LIFTER$"
 ALLOW_DYSON_SWARM:0 "§HDeverrouille le moteur stellaire :§! $DYSON_SWARM$"
 ALLOW_FUSION_HUB:0 "§HDeverrouille le moteur stellaire :§! $FUSION_HUB$"
 too_many_engines:0 "$TRIGGER_FAIL$ Nous soutenons deja le nombre maximal de moteurs stellaires."
 DYSON_SWARM:0 "Essaim de Dyson"
 dyson_swarm_0:0 "Plateforme de construction : Essaim de Dyson"
 dyson_swarm_0_MEGASTRUCTURE_DETAILS:0 "A l'aide d'un reseau de panneaux solaires massifs, un §H$DYSON_SWARM$§! capte l'essentiel de l'energie d'une etoile."
 dyson_swarm_0_DESC:0 "Cette plateforme de construction servira de base a un essaim de Dyson, capable de recolter presque toute l'energie emise par l'etoile."
 dyson_swarm_1:0 "Essaim de Dyson : réseau primaire"
 dyson_swarm_1_DESC:0 "Avec le premier anneau de satellites collecteurs en place, l'essaim commence enfin a produire de l'energie."
 dyson_swarm_2:0 "Essaim de Dyson : réseau secondaire"
 dyson_swarm_2_DESC:0 "Avec le second reseau en place, la collecte d'energie double par rapport au seul reseau primaire."
 dyson_swarm_3:0 "Essaim de Dyson : réseau polaire"
 dyson_swarm_3_DESC:0 "Des reseaux supplementaires augmentent encore l'efficacite globale de l'essaim."
 dyson_swarm_4:0 "Essaim de Dyson : réseau subpolaire"
 dyson_swarm_4_DESC:0 "Avec le dernier reseau majeur en place, tout gain supplementaire viendra d'une meilleure efficacite des panneaux ou d'une retention accrue de la lumiere."
 dyson_swarm_5:0 "$DYSON_SWARM$"
 dyson_swarm_5_DESC:0 "Un bouclier puissant refleche vers les collecteurs tout photon perdu et protege en meme temps les delicats reseaux de collecte."
 FUSION_HUB:0 "Collecteur de fusion"
 fusion_hub_0:0 "Plateforme de construction : Collecteur de fusion"
 fusion_hub_0_MEGASTRUCTURE_DETAILS:0 "A l'aide d'un faisceau a neutrons et d'un collecteur gravitonique, un §H$FUSION_HUB$§! produit directement du deuterium le long de la surface d'une etoile."
 fusion_hub_0_DESC:0 "Cette plateforme de construction servira de base a un collecteur de fusion capable de produire d'immenses quantites de deuterium."
 fusion_hub_1:0 "Collecteur de fusion : station d'ancrage"
 fusion_hub_1_DESC:0 "La station d'ancrage est l'element cle qui nous permet de commencer les operations de recolte."
 fusion_hub_2:0 "Collecteur de fusion : raffinerie"
 fusion_hub_2_DESC:0 "La raffinerie convertira une plus grande part de l'hydrogene capte en deuterium utile."
 fusion_hub_3:0 "Collecteur de fusion : amplificateur de faisceau"
 fusion_hub_3_DESC:0 "L'amplificateur augmente la vitesse de collecte et accelere l'ensemencement en deuterium."
 fusion_hub_4:0 "Collecteur de fusion"
 fusion_hub_4_DESC:0 "Un amplificateur secondaire augmente encore la cadence de traitement et de collecte."
 LIFTER:0 "Stellar-Lifter"
 lifter_0:0 "Plateforme de construction : Stellar-Lifter"
 lifter_0_MEGASTRUCTURE_DETAILS:0 "Grace a un collecteur gravitonique et a une fusion secondaire tres couteuse, un §H$LIFTER$§! cree des mineraux exploitables directement a partir d'une etoile."
 lifter_0_DESC:0 "Cette plateforme de construction servira de base a un Stellar-Lifter, capable de transformer la masse stellaire en ressources minerales."
 lifter_1:0 "Stellar-Lifter : station d'ancrage"
 lifter_1_DESC:0 "La station d'ancrage est l'element cle qui nous permet de commencer la recolte."
 lifter_2:0 "Stellar-Lifter : anneau de raffinerie"
 lifter_2_DESC:0 "L'anneau de raffinerie permet des reactions de fusion d'elements a masse atomique plus elevee, augmentant ainsi le rendement."
 lifter_3:0 "Stellar-Lifter : raffinerie secondaire"
 lifter_3_DESC:0 "Une seconde installation de raffinage nous permet de traiter un volume de matiere bien plus important."
 lifter_4:0 "Stellar-Lifter"
 lifter_4_DESC:0 "L'ajout de chambres d'etoiles artificielles massives permet un processus de fusion bien plus controle."

 # CP26 major empire personalities
 personality_cp26_starfleet_command:0 "Commandement Starfleet"
 personality_cp26_starfleet_command_desc:0 "La Fédération Unie des Planètes poursuit la paix par l'exploration et la diplomatie, mais défend fermement ses membres face à toute menace. Starfleet ne fuit pas."
 personality_cp26_klingon_honor_guard:0 "Garde d'Honneur Klingon"
 personality_cp26_klingon_honor_guard_desc:0 "La guerre est la plus haute vocation. L'Empire cherche la gloire au combat, forge des liens par l'honneur et n'a que faire de ceux qui plaideraient pour la paix par faiblesse."
 personality_cp26_tal_shiar_doctrine:0 "Doctrine du Tal Shiar"
 personality_cp26_tal_shiar_doctrine_desc:0 "Romulus ne partage pas le pouvoir. Chaque alliance est un levier, chaque traité un délai. Le renseignement est la force, et la force est la survie."
 personality_cp26_central_command:0 "Commandement Central"
 personality_cp26_central_command_desc:0 "L'Union Cardassienne s'étend par la discipline militaire et le pragmatisme sans pitié. Les voisins plus faibles sont des ressources à administrer, non des alliés à courtiser."

 # Fleet Museum  -  Intégration Galaxy
 cp26_museum.1.name:0 "Un vaisseau qui mérite d'être préservé"
 cp26_museum.1.desc:0 "L'Enterprise-D vient d'être décommissionné. Il a servi la Fédération pendant huit ans et nous a portés à travers les heures les plus sombres. Le Musée de la Flotte dispose d'un emplacement. Autorisez le transfert et envoyez une équipe de construction  -  cela coûtera 500 minéraux, 100 dilithium et 50 influence."
 cp26_museum.1.a:0 "Autorisez le transfert. Sa place est dans l'histoire."
 cp26_museum.1.b:0 "Nous avons des priorités plus urgentes."

 # Fleet Museum  -  Intégration Sovereign
 cp26_museum.3.name:0 "Un second héritage"
 cp26_museum.3.desc:0 "L'Enterprise-E vient d'être relevé de ses fonctions actives. Il a combattu à la bataille du Secteur 001, arrêté les Borg et mené la Fédération tout au long de la Guerre du Dominion. Autorisez son installation  -  500 minéraux, 100 dilithium et 50 influence pour lui assurer une place aux côtés de l'Enterprise-D."
 cp26_museum.3.a:0 "Autorisez l'installation. Il a gagné sa place."
 cp26_museum.3.b:0 "Pas maintenant."

 # Démarrage de partie  -  Toggle Libération de Bajor
 cp26_options.1.bajor_arc_on:0 "Libération de Bajor (TESTING) : §Gactivée§!"
 cp26_options.1.bajor_arc_on.tt:0 "Cliquez pour désactiver l'arc Libération de Bajor pour cette campagne. Les événements de 2369 ne se déclencheront pour aucun empire."
 cp26_options.1.bajor_arc_off:0 "Libération de Bajor (TESTING) : §Rdésactivée§!"
 cp26_options.1.bajor_arc_off.tt:0 "Cliquez pour activer l'arc Libération de Bajor pour cette campagne. Chaque grand empire recevra un événement unique en 2369."

 # Libération de Bajor  -  chaîne de journal
 cp26_bajor_arc_chain_title:0 "Libération de Bajor"
 cp26_bajor_arc_chain_desc:0 "[cp26_bajor_arc_objective_loc]"

 # Libération de Bajor  -  titre commun
 cp26_bajor.title:0 "La Libération de Bajor"

 # Libération de Bajor  -  Objectif journal de bord (scripted_loc states)
 cp26_bajor_obj_fleet:0 "Déployer un vaisseau dans le système de Bajor"
 cp26_bajor_obj_send_ship:0 "§YObjectif :§! Envoyez un vaisseau dans le système de Bajor. N'importe quel type de vaisseau suffit  -  dès qu'il sera en position, votre décision prendra effet."
 cp26_bajor_obj_send_military:0 "§YObjectif :§! Envoyez une flotte militaire dans le système de Bajor. Une fois vos vaisseaux en position, la libération se déclenchera automatiquement."
 cp26_bajor_obj_send_troops:0 "§YObjectif :§! Construisez des armées et envoyez un transport dans le système de Bajor. Débarquez ensuite les troupes sur Bajor pour renforcer l'occupation."
 cp26_bajor_obj_arrived:0 "§GVos forces sont en position.§! La résolution de la situation de Bajor est en cours..."
 cp26_bajor_obj_monitoring:0 "Vos forces et ressources ont été engagées sur Bajor. Le résultat se précisera dans les prochaines semaines."

 # Libération de Bajor  -  Fédération (cp26_bajor.1)
 cp26_bajor.1.desc:0 "Les rapports de renseignement confirment ce que nous redoutions. Les cellules de résistance bajoranes ont lancé un soulèvement coordonné contre l'Occupation cardassienne. La situation sur Bajor se détériore rapidement  -  les victimes civiles s'accumulent d'heure en heure. Le Conseil de la Fédération attend notre réponse. Comment Starfleet réagit-il ?"
 cp26_bajor.1.a:0 "Non-intervention. C'est une affaire interne cardassienne."
 cp26_bajor.1.b:0 "Envoyer une force opérationnelle Starfleet. Libérer Bajor."
 cp26_bajor.1.c:0 "Envoyer un convoi humanitaire  -  1 000 tonnes de vivres d'urgence."
 cp26_bajor.1.b.tt:0 "Ordonnez à une flotte Starfleet de rejoindre le système de Bajor. L'objectif apparaîtra dans le journal de bord  -  une fois vos vaisseaux en position, la libération se déclenchera automatiquement."
 cp26_bajor.1.c.tt:0 "Envoyez un vaisseau fédéral dans le système de Bajor pour livrer l'aide. L'objectif apparaîtra dans le journal de bord  -  une fois en position, le convoi fait pencher la balance et déclenche la résolution automatiquement."

 # Libération de Bajor  -  Union Cardassienne (cp26_bajor.2)
 cp26_bajor.2.desc:0 "La résistance bajoranes est devenue une rébellion ouverte. La garnison du Préfet Dukat tient  -  à peine. Le Commandement Central exige une réponse avant que la situation échappe à tout contrôle. L'honneur de l'Union et le contrôle de l'une de nos acquisitions stratégiques les plus importantes sont en jeu."
 cp26_bajor.2.a:0 "Écraser la rébellion. Renforcer les garnisons et rétablir l'ordre par tous les moyens."
 cp26_bajor.2.b:0 "Renforcer l'occupation. Plus de troupes, plus de patrouilles, verrouillage total."
 cp26_bajor.2.c:0 "Retrait stratégique. Bajor coûte plus qu'il ne rapporte."
 cp26_bajor.2.a.tt:0 "Construisez des armées et envoyez un transport de troupes dans le système de Bajor. L'objectif apparaîtra dans le journal de bord  -  une fois les troupes débarquées sur Bajor, la répression de la rébellion se déclenchera."
 cp26_bajor.2.b.tt:0 "Construisez des armées et envoyez un transport de troupes dans le système de Bajor. L'objectif apparaîtra dans le journal de bord  -  une fois les troupes débarquées, le verrouillage militaire prendra effet."
 cp26_bajor.2.c.tt:0 "Le retrait sera perçu comme une faiblesse, mais mettra fin à la pression sur nos forces. Bajor sera libéré."

 # Libération de Bajor  -  Empire Klingon (cp26_bajor.3)
 cp26_bajor.3.desc:0 "Les Bajorans se sont soulevés contre leurs occupants cardassiens. Des guerriers qui résistent à l'esclavage méritent d'être appelés guerriers. L'Empire observe  -  et une opportunité se présente. Agissons-nous, ou affilons-nous nos lames pour le bon moment ?"
 cp26_bajor.3.a:0 "Envoyer des armes et des guerriers à Bajor. L'honneur l'exige."
 cp26_bajor.3.b:0 "Les Cardassiens sont affaiblis. Frapper maintenant et saisir l'avantage."
 cp26_bajor.3.c:0 "Ce conflit ne concerne pas l'Empire."
 cp26_bajor.3.a.tt:0 "Envoyez une flotte klingone dans le système de Bajor. L'objectif apparaîtra dans le journal de bord  -  une fois vos vaisseaux en position, la libération se déclenchera automatiquement."
 cp26_bajor.3.b.tt:0 "Un casus belli contre l'Union Cardassienne pendant que ses forces sont à l'étirement."

 # Libération de Bajor  -  Empire Romulien (cp26_bajor.4)
 cp26_bajor.4.desc:0 "Bajor brûle. Les forces cardassiens sont mobilisées, leur attention ailleurs. Le Tal Shiar identifie trois axes d'exploitation. L'émotion n'est pas un luxe romulien  -  seulement l'opportunité."
 cp26_bajor.4.a:0 "Fournir un soutien clandestin aux rebelles. Déstabiliser le contrôle cardassien."
 cp26_bajor.4.b:0 "Observer. Laisser les deux camps s'épuiser."
 cp26_bajor.4.c:0 "Intervenir officiellement. Romulus prend le parti de Bajor."
 cp26_bajor.4.a.tt:0 "Envoyez un vaisseau espion dans le système de Bajor. Une fois en position, les agents déstabilisent la garnison  -  la résistance bajoranne éclate et Bajor est libérée, avec quelques dommages de sabotage."
 cp26_bajor.4.b.tt:0 "Observer le conflit sans intervenir. Aucun avantage immédiat."
 cp26_bajor.4.c.tt:0 "Envoyez une flotte romulienne dans le système de Bajor. L'objectif apparaîtra dans le journal de bord  -  une fois vos vaisseaux en position, la libération se déclenchera automatiquement."

 # Libération de Bajor  -  Alliance Ferengi (cp26_bajor.5)
 cp26_bajor.5.desc:0 "Une guerre est un marché. Les Bajorans se battent avec ce qu'ils peuvent récupérer ; les Cardassiens saignent du latinum pour tenir une planète de plus en plus difficile à conserver. Les deux camps ont besoin de ravitaillement. Règle d'Acquisition 34 : La guerre est bonne pour les affaires. La seule question est : quel camp  -  ou les deux ?"
 cp26_bajor.5.a:0 "Vendre des armes et des fournitures aux Bajorans."
 cp26_bajor.5.b:0 "Ravitailler la garnison cardassienne. Un client stable est un client fiable."
 cp26_bajor.5.c:0 "Vendre aux deux camps. Le profit n'a pas de drapeau."
 cp26_bajor.5.a.tt:0 "Envoyez un vaisseau férengi dans le système de Bajor pour livrer les armes. L'objectif apparaîtra dans le journal de bord  -  une fois en position, la libération se déclenchera automatiquement."
 cp26_bajor.5.b.tt:0 "Envoyez un vaisseau à Bajor pour livrer les armes à la garnison cardassienne. L'objectif apparaîtra dans le journal  -  une fois en position, la livraison renforce l'occupation. Bajor reste cardassienne."
 cp26_bajor.5.c.tt:0 "Envoyez un vaisseau dans le système de Bajor ET un autre dans l'espace cardassien. Les deux camps armés s'affrontent  -  Bajor sera libérée mais avec des dommages collatéraux (30% dévastation)."

 # Libération de Bajor  -  noms des modificateurs de planète
 cp26_bajor_suppressed_garrison:0 "Garnison de répression cardassienne"
 cp26_bajor_suppressed_garrison_desc:0 "Les forces militaires cardassines ont imposé une répression brutale à la population. La résistance est punie sévèrement, les mouvements civils sont restreints et la main-d'œuvre de la planète opère sous une pression constante."
 cp26_bajor_romulan_sabotage:0 "Opérations clandestines romulières"
 cp26_bajor_romulan_sabotage_desc:0 "Des agents romuliens opèrent dans l'ombre, perturbant les lignes d'approvisionnement cardassines, désactivant les relais de communication et attisant le mécontentement parmi les forces d'occupation."

 # Libération de Bajor  -  modificateurs post-libération
 cp26_bajor_fed_liberation:0 "Libération par Starfleet"
 cp26_bajor_fed_liberation_desc:0 "L'intervention militaire de Starfleet a permis la libération de Bajor. La présence fédérale a rétabli l'ordre et la stabilité sur la planète."
 cp26_bajor_humanitarian_relief:0 "Aide humanitaire fédérale"
 cp26_bajor_humanitarian_relief_desc:0 "Le convoi humanitaire de la Fédération a permis de nourrir la population et de stabiliser la situation sur Bajor. Les réserves alimentaires permettront de reconstruire rapidement."
 cp26_bajor_klingon_honor:0 "Pacte d'honneur klingon"
 cp26_bajor_klingon_honor_desc:0 "Les guerriers klingons ont combattu aux côtés des Bajorans pour chasser les Cardassiens. Cet acte d'honneur a inspiré les défenseurs de Bajor et renforcé leurs capacités militaires."
 cp26_bajor_romulan_influence:0 "Réseau d'influence romulien"
 cp26_bajor_romulan_influence_desc:0 "L'intervention officielle de l'Empire Romulien a conduit à un partage tacite de technologies et de renseignements avec Bajor, accélérant les programmes de recherche locaux."
 cp26_bajor_ferengi_trade:0 "Accord commercial férengi"
 cp26_bajor_ferengi_trade_desc:0 "Les armes et fournitures férengies ont changé la balance du conflit. En échange, Bajor est désormais lié à un accord commercial avec l'Alliance Férengi, stimulant l'économie locale."
 cp26_bajor_ferengi_card_supply:0 "Ravitaillement férengi  -  garnison cardassienne"
 cp26_bajor_ferengi_card_supply_desc:0 "Des fournitures et armements fermis par les Férengi ont renforcé la garnison cardassienne sur Bajor. La résistance bajoranne est contenue mais la tension sociale s'intensifie."
