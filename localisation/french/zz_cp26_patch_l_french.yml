 lunar_one_colony:0 "Colonie de Lunar One"
 lunar_one_colony_desc:0 "Lunar One est le premier avant-poste scientifique en gravité réduite que l'humanité a construit sur sa propre Lune - un berceau de recherche qui attire encore les esprits les plus curieux de la Fédération."
 cp26_fleet_museum:0 "Musée de la Flotte"
 cp26_fleet_museum_DESC:0 "Une station-musée préservée exposant des vaisseaux historiques de Starfleet, dont le NX-01."
 cp26_fleet_museum_MEGASTRUCTURE_DETAILS:0 "Une station-musée préservée exposant des vaisseaux historiques de Starfleet, dont le NX-01."
 cp26_fleet_museum_stage2:0 "Musée de la Flotte"
 cp26_fleet_museum_stage2_DESC:0 "L'Enterprise-D, classe Galaxy, a rejoint la collection du musée. Sa silhouette emblématique domine désormais l'anneau principal de la station."
 cp26_fleet_museum_stage2_MEGASTRUCTURE_DETAILS:0 "L'Enterprise-D, classe Galaxy, a rejoint la collection du musée. Sa silhouette emblématique domine désormais l'anneau principal de la station."
 cp26_fleet_museum_stage3:0 "Musée de la Flotte"
 cp26_fleet_museum_stage3_DESC:0 "L'U.S.S. Voyager originel rejoint désormais la collection. Préservé après l'entrée en service de son successeur de classe Lamarr, le vaisseau devient un monument au retour le plus improbable de Starfleet depuis le Quadrant Delta."
 cp26_fleet_museum_stage3_MEGASTRUCTURE_DETAILS:0 "L'U.S.S. Voyager originel rejoint désormais la collection. Préservé après l'entrée en service de son successeur de classe Lamarr, le vaisseau devient un monument au retour le plus improbable de Starfleet depuis le Quadrant Delta."
 qt_ufop_upgrade_enterprise_odyssey:0 "Refonte de l'Enterprise Classe Odyssey"
 qt_ufop_upgrade_enterprise_odyssey_desc:0 "Des décennies d'exploration et de conflits ont mené les ingénieurs de Starfleet à leur refonte la plus ambitieuse. L'Enterprise sera modernisée en classe Odyssey  -  le vaisseau le plus grand et le plus capable de la flotte."
 UPGRADE_ENTERPRISE_ODYSSEY:0 "Refonte Odyssey de l'Enterprise"
 UPGRADE_ENTERPRISE_ODYSSEY_DESC:0 "Les ingénieurs de Starfleet sont prêts à procéder à la refonte la plus ambitieuse de l'histoire de l'Enterprise. Cela nécessitera 5 000 alliages et 20 cristaux de dilithium."
 UPGRADE_VOYAGER_LAMARR:0 "Refonte Lamarr du Voyager"
 UPGRADE_VOYAGER_LAMARR_DESC:0 "Le Voyager doit rejoindre la starbase de Sol pour une modernisation lourde vers la classe Lamarr. Cela nécessitera 3 500 alliages et 20 cristaux de dilithium."
 cp26_enterprise_odyssey.1.name:0 "Refonte autorisée"
 cp26_enterprise_odyssey.1.desc:0 "Le commandement de l'ingénierie de Starfleet a validé les plans et autorisé la refonte de l'Enterprise en classe Odyssey. Les travaux débuteront immédiatement à Utopia Planitia."
 cp26_enterprise_odyssey.2.name:0 "L'Enterprise-F est commissionnée"
 cp26_enterprise_odyssey.2.desc:0 "La refonte est achevée. L'Enterprise sort de cale sèche en tant que vaisseau de classe Odyssey  -  la fierté de la flotte et le vaisseau le plus puissant que Starfleet ait jamais lancé."
 cp26_enterprise_odyssey.2.a:0 "Elle est magnifique."
 cp26_enterprise_odyssey.2.a.tt:0 "L'Enterprise est désormais un vaisseau de classe Odyssey."
 NAME_Enterprise_Odyssey:0 "U.S.S. Enterprise"
 tech_cp26_daystrom_institute:0 "Institut Daystrom"
 tech_cp26_daystrom_institute_desc:0 "La Fédération peut fonder l'Institut Daystrom, principal centre de recherche et de développement scientifique. Déverrouille la construction de la mégastructure Station Daystrom."
 ALLOW_CP26_DAYSTROM_INSTITUTE:0 "§HDéverrouille la mégastructure fédérale :§! $cp26_daystrom_station$"
 cp26_daystrom_station:0 "Station Daystrom"
 cp26_daystrom_station_DESC:0 "Une station orbitale de recherche exploitée par l'Institut Daystrom, repoussant les frontières de la science fédérale dans toutes les disciplines."
 cp26_daystrom_station_MEGASTRUCTURE_DETAILS:0 "Les divisions de recherche de la station travaillent de concert en physique, ingénierie et sciences sociales, augmentant la production de recherche de toute la Fédération."
 cp26_daystrom_rift_habitat:0 "Habitat de la Faille Daystrom"
 cp26_daystrom_rift_habitat_DESC:0 "Un habitat improvisé apparu au cœur de la rupture subspatiale provoquée par l'expérience Daystrom."
 cp26_daystrom_rift_habitat_MEGASTRUCTURE_DETAILS:0 "Cette structure orbitale sert de tête de pont à l'entité hostile issue de la faille."
 cp26_daystrom_requires_planet_or_moon:0 "Doit être placée en orbite d'une planète ou d'une lune"
 cp26_daystrom_requires_non_capital_system:0 "Ne peut pas être placée dans le système capitale de la Fédération"
 cp26_daystrom_requires_empty_system:0 "Le système ne doit contenir aucune autre mégastructure"
 cp26_daystrom_requires_habitable_world:0 "Doit être placée en orbite d'une planète"
 cp26_daystrom_requires_ufop_system:0 "Doit être placée dans un système appartenant à la Fédération"
 cp26_daystrom_requires_uncolonized_world:0 "Le monde ciblé doit être libre"
 cp26_daystrom_requires_no_megastructure:0 "Ce corps céleste accueille déjà une mégastructure"
 cp26_terok_nor:0 "Terok Nor"
 cp26_terok_nor_DESC:0 "Une station de commandement cardassienne conçue pour dominer Bajor et coordonner l'exploitation des ressources du système."
 cp26_terok_nor_MEGASTRUCTURE_DETAILS:0 "§ERendement cardassien :§! §G+4 Alliages/mois§!, §G+4 Minerais/mois§!, §G+10 Capacité administrative§!\n§EEntretien :§! §R10 Énergie/mois§!"
 cp26_terok_nor_requires_planet_or_moon:0 "Doit être placée en orbite d'une planète ou d'une lune"
 cp26_terok_nor_requires_bajor_system:0 "Doit être placée dans le système de Bajor"
 cp26_terok_nor_requires_no_megastructure:0 "Ce corps céleste accueille déjà une mégastructure"
 tech_cp26_ufop_fleet_museum:0 "Charte du Musée de la Flotte"
 tech_cp26_ufop_fleet_museum_desc:0 "Starfleet peut formaliser la conservation de ses vaisseaux historiques et ériger un musée orbital unique consacré à l'héritage de la Fédération."
 ALLOW_CP26_FLEET_MUSEUM:0 "§HDéverrouille la mégastructure fédérale :§! $cp26_fleet_museum$"
 cp26_ufop_sector_governance_charter:0 "Charte de gouvernance sectorielle"
 cp26_ufop_sector_governance_charter_desc:0 "Assise administrative fédérale pour une Fédération multi-secteurs, atténuant l’étalement de l’empire en début de partie sans remplacer la bureaucratie des mondes membres."
 cp26_ufop_federal_power_bootstrap:0 "Stabilisation du réseau fédéral"
 cp26_ufop_federal_power_bootstrap_desc:0 "Allègement temporaire des contraintes de réseau et de comptabilité pendant que les mondes centraux et la logistique des bases stellaires retrouvent l'équilibre après la clôture fiscale de 2346. Augmente la production d'énergie à l'échelle de l'empire pendant plusieurs années."
 cp26_ufop_federal_energy_grid:0 "Réseau énergétique fédéral"
 cp26_ufop_federal_energy_grid_desc:0 "Les mondes fondateurs mutualisent temporairement leurs réseaux de distribution, leurs réserves d'antimatière et leurs contrats industriels pour stabiliser l'économie énergétique fédérale pendant la transition de départ."
 casus_belli_cb_liberation_war:0 "Indépendance"
 casus_belli_cb_liberation_war_acquire_hint:0 "Nous devons d'abord exiger que ce suzerain libère sa dépendance. En cas de refus, nous pourrons déclarer une guerre d'indépendance."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE:0 "Demander la capitulation"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_TYPE:0 "Demander la capitulation"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_TITLE:0 "Proposer d'accepter le but de guerre"
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre. L'empire ciblé peut accepter ou refuser."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_OFFER_DESC:0 "§H[Actor.GetName]§! propose que nous acceptions son but de guerre."
 ACTION_CP26_OFFER_WAR_GOAL_PEACE_COST:0 "$ACTION_CP26_OFFER_WAR_GOAL_PEACE_DESC$"
 action_cp26_offer_war_goal_peace:0 "Demander la capitulation"
 action_cp26_offer_war_goal_peace_desc:0 "Propose à §H[Recipient.GetName]§! d'accepter notre but de guerre et de mettre fin à la guerre."
 MIPO_MISSION_GENERIC_OPTION:0 "Reconnaître l'issue"
 MIPO_MISSION_GENERIC_OPTION_TT:0 "Résout cette étape de mission pour les empires hors des quatre grandes puissances, afin que l'IA et l'interface aient toujours un choix valide."
