 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "L'Incursion subspatiale"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Cicatrice subspatiale"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Essaim d'incursion"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Garde de la faille"
 cp26_daystrom.1.title:0 "Projet Siphon Subspatial"
 cp26_daystrom.1.desc:0 "Depuis des mois, les chercheurs de la Station Daystrom accumulent les mêmes conclusions, toujours plus préoccupantes : les réacteurs conventionnels gagnent en rendement, mais se rapprochent malgré tout de leurs limites théoriques. À mesure que nos mégastructures s'étendent, que nos chantiers orbitaux se multiplient et que nos réseaux scientifiques se densifient, la demande énergétique croît plus vite que nos solutions.\n\nC'est dans ce contexte qu'une équipe de physiciens subspatiaux et d'ingénieurs en dynamique de champ soumet aujourd'hui une proposition jugée aussi brillante qu'inquiétante. Plutôt que de produire davantage d'énergie à partir de matières toujours plus rares ou de réacteurs toujours plus complexes, elle suggère de puiser directement dans les fluctuations naturelles du subespace lui-même.\n\nLeurs simulations décrivent le subespace comme un océan invisible, parcouru de courants énergétiques immenses, permanents, omniprésents. Jusqu'à présent, nul n'a véritablement tenté de les exploiter. Non par manque d'imagination, mais parce que le subespace reste l'un des domaines les moins bien compris de notre physique appliquée. Il ne s'agit pas seulement d'un milieu énergétique : c'est aussi le support des communications à longue portée, des champs de distorsion et d'une part essentielle de notre infrastructure interstellaire.\n\nSi leur théorie est correcte, un Collecteur d'Énergie Subspatiale pourrait transformer l'avenir de la Fédération. Une source presque inépuisable pourrait alimenter stations, chantiers, laboratoires et réseaux entiers sans dépendre des réacteurs classiques. Mais plusieurs membres du comité scientifique mettent en garde contre un enthousiasme prématuré. Modifier l'équilibre du subespace pourrait provoquer des effets encore impossibles à anticiper.\n\nDaystrom demande notre autorisation."
 cp26_daystrom.1.a:0 "Autoriser le projet."
 cp26_daystrom.1.b:0 "Limiter les financements."
 cp26_daystrom.1.c:0 "Abandonner cette piste."
 cp26_daystrom.2.title:0 "Un succès inattendu"
 cp26_daystrom.2.desc:0 "Après plusieurs mois de travaux ininterrompus, de recalibrages constants et d'essais menés à des puissances encore jugées prudentes, le premier prototype du Collecteur d'Énergie Subspatiale a dépassé toutes les attentes. Les rapports qui nous parviennent de la Station Daystrom parlent d'une extraction remarquablement stable, d'une courbe de rendement proprement inédite, et surtout de l'absence, du moins en apparence, de toute perturbation majeure.\n\nL'effet sur les équipes de recherche est immédiat. Les ingénieurs parlent déjà d'une révolution énergétique. Certains vont plus loin encore et évoquent l'ouverture d'une nouvelle ère pour la Fédération, où mégastructures, chantiers orbitaux et complexes scientifiques ne seraient plus limités par les contraintes d'approvisionnement classiques.\n\nLa pression monte donc pour étendre le programme sans attendre, accroître la puissance du dispositif et transformer l'essai en percée historique.\n\nPourtant, les rapports annexes racontent une histoire plus discrète, et bien moins rassurante. Les capteurs les plus sensibles ont commencé à enregistrer de faibles oscillations dans le subespace autour de la station. Les variations sont minuscules, presque négligeables si on les considère isolément. Mais elles reviennent à chaque cycle d'extraction, avec une intensité légèrement supérieure.\n\nAucun signe de catastrophe. Aucun incident ouvert. Seulement une anomalie encore trop faible pour être certaine... et trop régulière pour être ignorée."
 cp26_daystrom.2.desc_limited:0 "Même avec un budget restreint et un calendrier plus prudent, le premier prototype a produit des résultats que beaucoup jugeaient inaccessibles. Le Collecteur extrait une énergie stable, avec une efficacité qui dépasse nettement les modèles initiaux, et les équipes de Daystrom réclament déjà davantage de moyens afin d'exploiter pleinement cette avancée.\n\nMais là encore, tout n'est pas parfaitement propre. Les capteurs les plus sensibles autour de la station ont enregistré de faibles oscillations dans le subespace local. Les lectures restent ténues, presque faciles à écarter, mais elles augmentent avec une régularité de plus en plus difficile à expliquer."
 cp26_daystrom.2.a:0 "Augmenter la puissance du collecteur."
 cp26_daystrom.2.b:0 "Maintenir les essais au niveau actuel."
 cp26_daystrom.2.c:0 "Suspendre les expériences le temps d'étudier les anomalies."
 cp26_daystrom.3.title:0 "Quelque chose répond"
 cp26_daystrom.3.desc:0 "Les dernières données transmises par Daystrom ont profondément modifié la nature du débat. Les fluctuations observées ne ressemblent plus à un simple phénomène physique, ni même à une instabilité technique liée au prototype.\n\nElles suivent désormais un schéma régulier.\n\nPas une simple répétition mécanique, mais une structure. Une cadence. Une réponse.\n\nCertains chercheurs la décrivent comme une tentative du subespace pour retrouver son équilibre. D'autres, plus troublés encore, affirment que ces motifs donnent l'impression d'une réaction à notre présence, comme si quelque chose, au-delà de nos instruments, avait commencé à remarquer l'effort que nous lui imposons.\n\nLes rapports annexes sont plus inquiétants encore. Des signatures énergétiques apparaissent quelques fractions de seconde avant même l'activation des appareils censés les détecter. Plusieurs sondes disparaissent des capteurs pendant de très brefs instants avant de réapparaître sans dommage apparent. Une équipe affirme même avoir enregistré un décalage temporel impossible entre l'émission d'une impulsion et sa lecture en retour.\n\nLes théoriciens de Daystrom ne parlent plus seulement d'extraction. Selon eux, le Collecteur ne se contente plus de puiser de l'énergie : il exerce une tension croissante sur la structure même du subespace.\n\nMalgré tout, les responsables du projet refusent de renoncer. Ils soutiennent qu'un ultime essai, strictement contrôlé, permettrait de prouver définitivement la viabilité de la technologie et d'éclaircir la nature exacte des anomalies.\n\nLe prochain choix pourrait être décisif."
 cp26_daystrom.3.desc_suspended:0 "Même après la réduction de puissance du Collecteur, les anomalies n'ont pas disparu. Elles ont continué d'évoluer.\n\nLes motifs relevés dans le subespace semblent désormais presque intentionnels, comme s'ils anticipaient nos mesures ou s'ajustaient à nos propres observations. Plusieurs équipes signalent des lectures temporelles impossibles, des retards négatifs, des réponses qui paraissent exister avant leur propre cause.\n\nÀ Daystrom, l'atmosphère s'est dégradée. Les débats scientifiques ont laissé place à une fracture plus profonde entre prudence absolue et fascination intellectuelle. Certains exigent une fermeture définitive avant que l'on ne dérange davantage ce qui a déjà été touché. D'autres affirment qu'un ultime essai, mieux calibré et mieux encadré, constitue au contraire la seule chance de comprendre la nature réelle du phénomène.\n\nLe conseil de Daystrom est désormais profondément divisé."
 cp26_daystrom.3.a:0 "Lancer le test final."
 cp26_daystrom.3.b:0 "Réduire la puissance et poursuivre les recherches."
 cp26_daystrom.3.c:0 "Fermer définitivement le projet."
 cp26_daystrom.4.title:0 "La Déchirure"
 cp26_daystrom.4.desc:0 "Les premières secondes du test final semblent justifier toutes les audaces.\n\nLe rendement dépasse immédiatement toutes les prévisions. L'énergie afflue dans le réseau à un niveau qu'aucun des chercheurs présents n'avait osé annoncer dans ses projections publiques. Pendant un instant, l'impossible paraît à portée de main. Les consoles s'illuminent d'une cascade de chiffres hors norme. Dans les laboratoires de la station, certains comprennent déjà qu'ils sont peut-être en train d'assister à l'un des plus grands tournants scientifiques de l'histoire de la Fédération.\n\nPuis tout se brise.\n\nBrutalement, toutes les mesures deviennent incohérentes. Les capteurs se contredisent. Les communications internes tombent les unes après les autres. Les champs gravitationnels se mettent à osciller sans logique apparente. L'espace lui-même, autour de la Station Daystrom, semble perdre sa stabilité.\n\nDes témoins rapportent que les parois vibrent sans impact, que la lumière se courbe de façon impossible, que certains couloirs donnent l'impression de s'étirer sur une distance plus grande qu'ils ne devraient. Au coeur de l'installation, les chercheurs observent avec horreur une fissure sombre se former là où il ne devrait y avoir que du vide et de l'acier. Les instruments refusent d'en mesurer la profondeur. Les relevés reviennent blancs, saturés ou absurdes. La brèche ne ressemble à aucun phénomène naturel connu.\n\nLa station commence à se disloquer autour d'elle.\n\nPuis viennent les signatures.\n\nDes signatures de distorsion inconnues, nettes, organisées, qui émergent de l'autre côté de la faille comme si quelque chose avait attendu ce passage.\n\nCe qui paraissait être une source d'énergie inépuisable n'était pas un réservoir.\n\nC'était une frontière.\n\nEt nous venons de l'ouvrir."
 cp26_daystrom.100.title:0 "La Brèche de Daystrom"
 cp26_daystrom.100.desc:0 "Une défaillance catastrophique à la Station Daystrom a ouvert une rupture subspatiale. La station a disparu, le système est tombé aux mains d'une puissance hostile, et une force inconnue émerge désormais de la faille."
