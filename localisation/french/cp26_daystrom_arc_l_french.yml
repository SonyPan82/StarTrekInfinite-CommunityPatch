 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "L'Incursion subspatiale"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Cicatrice subspatiale"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Essaim d'incursion"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Garde de la faille"
 cp26_daystrom.1.title:0 "Projet Siphon Subspatial"
 cp26_daystrom.1.desc:0 "Les chercheurs de la Station Daystrom estiment que les réacteurs conventionnels approchent de leurs limites théoriques. Une nouvelle équipe propose une approche radicalement différente : plutôt que de produire de l'énergie, elle souhaite la puiser directement dans les fluctuations naturelles du subespace.\n\nLeurs modèles suggèrent que d'immenses courants énergétiques traversent en permanence le subespace. Si nous parvenons à les exploiter sans danger, la Fédération pourrait alimenter mégastructures, chantiers navals et réseaux scientifiques sans dépendre des réacteurs ordinaires.\n\nD'autres scientifiques appellent pourtant à la prudence. Le subespace n'est pas un simple milieu énergétique. Il transporte aussi les communications et les interactions de distorsion, et son équilibre reste imparfaitement compris."
 cp26_daystrom.1.a:0 "Autoriser le projet."
 cp26_daystrom.1.b:0 "Limiter les financements."
 cp26_daystrom.1.c:0 "Abandonner cette piste."
 cp26_daystrom.2.title:0 "Un succès inattendu"
 cp26_daystrom.2.desc:0 "Après plusieurs mois de développement, le prototype dépasse toutes les prévisions. Le collecteur extrait une énergie stable, et aucune perturbation évidente n'a encore été observée.\n\nLes ingénieurs parlent déjà d'une révolution énergétique. La pression monte pour étendre immédiatement le programme et pousser le collecteur à une puissance supérieure.\n\nPourtant, les capteurs les plus sensibles autour de la Station Daystrom détectent désormais de minuscules oscillations dans le subespace. Elles restent faibles, mais augmentent à chaque cycle d'extraction."
 cp26_daystrom.2.desc_limited:0 "Malgré des moyens plus modestes, le premier prototype fonctionne bien au-delà des attentes. Le collecteur extrait une énergie stable, et les équipes de Daystrom réclament déjà un mandat plus ambitieux.\n\nDans le même temps, les balayages ultra-fins révèlent de subtiles oscillations dans le subespace autour de la station. Les lectures sont ténues, mais trop régulières pour être ignorées."
 cp26_daystrom.2.a:0 "Augmenter la puissance du collecteur."
 cp26_daystrom.2.b:0 "Maintenir les essais au niveau actuel."
 cp26_daystrom.2.c:0 "Suspendre les expériences pour étudier les anomalies."
 cp26_daystrom.3.title:0 "Quelque chose répond"
 cp26_daystrom.3.desc:0 "Les fluctuations ne ressemblent plus à un simple effet secondaire physique. Elles suivent désormais des motifs répétitifs, comme si le subespace tentait de retrouver son équilibre... ou réagissait à notre présence.\n\nLes équipes de Daystrom rapportent des lectures impossibles. Des signatures énergétiques apparaissent avant même l'activation des instruments. Des sondes disparaissent des capteurs une fraction de seconde avant de réapparaître intactes. Plusieurs théoriciens estiment désormais que le collecteur ne se contente plus de puiser de l'énergie. Il exerce une tension sur la structure même du subespace.\n\nLes responsables du projet affirment malgré tout qu'un dernier essai contrôlé démontrerait définitivement la viabilité de la technologie."
 cp26_daystrom.3.desc_suspended:0 "Même après avoir réduit le collecteur au minimum, les anomalies ont continué d'évoluer. Les motifs semblent désormais presque intentionnels, comme s'ils anticipaient nos mesures, et plusieurs équipes signalent des décalages temporels impossibles dans leurs relevés.\n\nLe conseil de Daystrom est profondément divisé. Certains exigent une fermeture définitive. D'autres soutiennent qu'un ultime essai calibré est la seule façon de comprendre ce qui a été dérangé."
 cp26_daystrom.3.a:0 "Lancer le test final."
 cp26_daystrom.3.b:0 "Réduire la puissance et poursuivre seulement la théorie."
 cp26_daystrom.3.c:0 "Fermer définitivement le projet."
 cp26_daystrom.4.title:0 "La Déchirure"
 cp26_daystrom.4.desc:0 "Les premières secondes du test final dépassent toutes les projections. La production énergétique grimpe à des niveaux jamais enregistrés.\n\nPuis toutes les mesures s'effondrent dans l'incohérence.\n\nL'espace autour de la Station Daystrom se déforme. Les communications cessent. Les relevés gravitationnels oscillent sans logique. Au cœur de l'installation, une fracture sombre s'ouvre et la station se disloque autour d'elle. La brèche n'a aucune profondeur mesurable. Ce n'est pas un phénomène naturel.\n\nDes signatures de distorsion émergent de l'autre côté.\n\nCe que nous pensions être une source d'énergie inépuisable était une barrière.\n\nNous venons de la déchirer."
 cp26_daystrom.100.title:0 "La Brèche de Daystrom"
 cp26_daystrom.100.desc:0 "Une défaillance catastrophique à la Station Daystrom a ouvert une rupture subspatiale. La station a disparu, le système est tombé aux mains d'une puissance hostile, et une force inconnue émerge désormais de la faille."
