 NAME_CP26_DAYSTROM_RIFT_COUNTRY:0 "L'Incursion subspatiale"
 NAME_CP26_DAYSTROM_RIFT_WORLD:0 "Cicatrice subspatiale"
 NAME_CP26_DAYSTROM_RIFT_FLEET:0 "Essaim d'incursion"
 NAME_CP26_DAYSTROM_RIFT_GUARD:0 "Garde de la faille"
 cp26_daystrom.1.title:0 "Projet Siphon Subspatial"
 cp26_daystrom.1.desc:0 "Depuis des mois, les chercheurs de la Station Daystrom tirent la même conclusion : malgré leurs progrès, les réacteurs conventionnels approchent de leurs limites. À mesure que nos mégastructures, nos chantiers orbitaux et nos réseaux scientifiques se développent, la demande énergétique croît plus vite que nos solutions.\n\nUne équipe de physiciens subspatiaux propose donc une idée aussi brillante qu'inquiétante : puiser directement dans les fluctuations naturelles du subespace.\n\nSi leur théorie est correcte, un Collecteur d'Énergie Subspatiale pourrait transformer l'avenir de la Fédération. Mais plusieurs experts rappellent qu'en altérer l'équilibre pourrait avoir des conséquences imprévisibles.\n\nDaystrom demande notre autorisation."
 cp26_daystrom.1.a:0 "Autoriser le projet."
 cp26_daystrom.1.b:0 "Limiter les financements."
 cp26_daystrom.1.c:0 "Abandonner cette piste."
 cp26_daystrom.2.title:0 "Un succès inattendu"
 cp26_daystrom.2.desc:0 "Après plusieurs mois d'essais prudents, le premier prototype du Collecteur d'Énergie Subspatiale a dépassé toutes les attentes. Les rapports de Daystrom décrivent une extraction remarquablement stable et un rendement inédit, sans perturbation majeure apparente.\n\nL'effet sur les équipes est immédiat. Certains parlent déjà d'une révolution énergétique pour la Fédération, et la pression monte pour accroître la puissance du dispositif.\n\nMais les capteurs les plus sensibles relèvent aussi de faibles oscillations dans le subespace autour de la station. Elles restent minimes, mais reviennent après chaque cycle et gagnent lentement en intensité.\n\nRien d'ouvertement catastrophique. Seulement une anomalie trop régulière pour être ignorée."
 cp26_daystrom.2.desc_limited:0 "Même avec un budget restreint et un calendrier plus prudent, le premier prototype a produit des résultats que beaucoup jugeaient inaccessibles. Le Collecteur extrait une énergie stable, avec une efficacité qui dépasse nettement les modèles initiaux, et les équipes de Daystrom réclament déjà davantage de moyens afin d'exploiter pleinement cette avancée.\n\nMais là encore, tout n'est pas parfaitement propre. Les capteurs les plus sensibles autour de la station ont enregistré de faibles oscillations dans le subespace local. Les lectures restent ténues, presque faciles à écarter, mais elles augmentent avec une régularité de plus en plus difficile à expliquer."
 cp26_daystrom.2.a:0 "Augmenter la puissance du collecteur."
 cp26_daystrom.2.b:0 "Maintenir les essais au niveau actuel."
 cp26_daystrom.2.c:0 "Suspendre les expériences le temps d'étudier les anomalies."
 cp26_daystrom.3.title:0 "Quelque chose répond"
 cp26_daystrom.3.desc:0 "Les dernières données de Daystrom ont changé la nature du débat. Les fluctuations ne ressemblent plus à une simple anomalie ni à une instabilité technique.\n\nElles suivent désormais un schéma. Une cadence. Une réponse.\n\nPlusieurs équipes signalent aussi des signatures apparaissant avant même l'activation des capteurs, des sondes brièvement perdues puis revenues intactes, et des décalages temporels impossibles à expliquer.\n\nLes théoriciens de Daystrom ne parlent plus seulement d'extraction. Selon eux, le Collecteur exerce désormais une tension croissante sur la structure même du subespace.\n\nMalgré cela, la direction du projet réclame un ultime essai, censé trancher définitivement la question."
 cp26_daystrom.3.desc_suspended:0 "Même après la réduction de puissance du Collecteur, les anomalies n'ont pas disparu.\n\nLes motifs relevés dans le subespace semblent presque intentionnels, comme s'ils anticipaient nos mesures. Plusieurs équipes signalent des lectures temporelles impossibles et des réponses paraissant exister avant leur propre cause.\n\nÀ Daystrom, les débats ont cédé la place à une fracture entre prudence absolue et fascination. Certains exigent un arrêt définitif. D'autres veulent un ultime essai pour comprendre ce qui a été touché."
 cp26_daystrom.3.a:0 "Lancer le test final."
 cp26_daystrom.3.b:0 "Réduire la puissance et poursuivre les recherches."
 cp26_daystrom.3.c:0 "Fermer définitivement le projet."
 cp26_daystrom.4.title:0 "La Déchirure"
 cp26_daystrom.4.desc:0 "Les premières secondes du test final semblent justifier tous les risques.\n\nLe rendement dépasse immédiatement toutes les prévisions. Pendant un bref instant, l'impossible paraît à portée de main.\n\nPuis tout cède.\n\nLes mesures deviennent incohérentes, les capteurs se contredisent, les communications tombent et l'espace autour de la Station Daystrom semble perdre sa stabilité. Au coeur de l'installation, une fissure sombre s'ouvre là où il ne devrait y avoir que du vide et de l'acier. Les instruments refusent d'en mesurer la profondeur.\n\nLa station est ravagée, éventrée par la brèche.\n\nPuis viennent les signatures : des signatures de distorsion inconnues, nettes, organisées, qui émergent de l'autre côté de la faille.\n\nCe qui paraissait être une source d'énergie inépuisable n'était pas un réservoir.\n\nC'était une frontière.\n\nEt nous venons de l'ouvrir."
 cp26_daystrom.5.title:0 "Transmission depuis la faille"
 cp26_daystrom.5.desc:0 "Le signal traverse nos canaux dans une cacophonie de parasites avant de se stabiliser.\n\n« Vous avez frappé notre domaine sans le comprendre. Vos expériences ont lacéré notre espace, tué les nôtres et ouvert un passage là où il ne devait pas en exister.\n\nVous avez tenté de nous détruire.\n\nNous allons répliquer.\n\nPeu importe qui vous êtes. »"
 cp26_daystrom.100.title:0 "La Brèche de Daystrom"
 cp26_daystrom.100.desc:0 "Une défaillance catastrophique à la Station Daystrom a ouvert une rupture subspatiale. La station a été ravagée, le système est tombé aux mains d'une puissance hostile, et une force inconnue émerge désormais de la faille."
