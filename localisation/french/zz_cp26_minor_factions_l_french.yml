l_french:
 cp26_minor_gorn_combat_doctrine: "Doctrine de combat Gorn"
 cp26_minor_gorn_combat_doctrine_desc: "Les équipages reptiliens privilégient la force brute à la finesse : coques solides, manœuvres lentes, faible esquive."
 cp26_minor_tholian_combat_doctrine: "Doctrine de combat Tholienne"
 cp26_minor_tholian_combat_doctrine_desc: "Vaisseaux cristallins articulés autour de boucliers énergétiques supérieurs et d'une régénération rapide, mais aux coques fragiles."
 cp26_minor_orion_combat_doctrine: "Doctrine de combat Orion"
 cp26_minor_orion_combat_doctrine_desc: "Flottes pirates entraînées aux frappes éclair : cadence et esquive élevées, mais leur blindage cède sous un feu soutenu."
 cp26_minor_breen_combat_doctrine: "Doctrine de combat Breen"
 cp26_minor_breen_combat_doctrine_desc: "Coques cryogéniques au blindage épais, salves perforantes redoutables, mais cadence de tir mesurée."
