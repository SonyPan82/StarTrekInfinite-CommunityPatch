 tech_cp26_klingon_jach:0 "Jach"
 tech_cp26_klingon_jach_desc:0 "Les chantiers klingons perfectionnent un modèle de croiseur de bataille plus lourd pour la fin d'ère: un briseur de ligne brutal conçu pour porter l'honneur de l'Empire au cœur des engagements décisifs."
 tech_cp26_romulan_praetor:0 "Praetor"
 tech_cp26_romulan_praetor_desc:0 "Les architectes navals romuliens élargissent la lignée moderne des oiseaux de guerre en une coque de commandement de prestige, alliant singularité, boucliers denses et puissance de frappe lourde sous camouflage."
 tech_cp26_romulan_scimitar:0 "Scimitar"
 tech_cp26_romulan_scimitar_desc:0 "Des études d'archives noires et de nouvelles percées sur les singularités permettent à l'État romulien de poursuivre un oiseau de guerre prédateur ultime: le Scimitar, une coque de terreur conçue pour les frappes écrasantes, l'approche furtive et la domination absolue du champ de bataille."
