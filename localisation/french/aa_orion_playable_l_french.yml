 orion_syndicate:0 "Syndicat Orion"
 orion_syndicate_desc:0 "Le Syndicat Orion opère dans l'ombre des grandes puissances du quadrant, contrôlant de vastes réseaux criminels, des routes de contrebande et des forces mercenaires. Depuis leur monde natal, le Syndicat négocie des accords avec quiconque est prêt à payer — et punit, discrètement, ceux qui refusent.\n\nLes Orions ne font pas la guerre ouvertement quand la subtilité sert mieux. Ils manipulent, commercent et s'étendent par le levier plutôt que par la force brute — mais quand ils sont acculés, leurs flottes sont redoutables et leur résolution implacable."
 START_SCREEN_ORION:0 "Le Syndicat Orion opère dans l'ombre des grandes puissances du quadrant, contrôlant de vastes réseaux criminels, des routes de contrebande et des forces mercenaires. Depuis leur monde natal, le Syndicat négocie des accords avec quiconque est prêt à payer — et punit, discrètement, ceux qui refusent.\n\nLes Orions ne font pas la guerre ouvertement quand la subtilité sert mieux. Ils manipulent, commercent et s'étendent par le levier plutôt que par la force brute — mais quand ils sont acculés, leurs flottes sont redoutables et leur résolution implacable."
