 cp26_ferengi_energy_consortium:0 "Bourse du Grand Nagus"
 cp26_ferengi_energy_consortium_desc:0 "Un courtage énergétique Ferengi qui étend la capacité des générateurs et booste le rendement des techniciens grâce à des incitations fondées sur le profit."

 cp26_ferengi_food_consortium:0 "Guilde des Marchands Alimentaires Ferengi"
 cp26_ferengi_food_consortium_desc:0 "Un réseau de commerçants Ferengi qui maximise la production agricole tout en transformant chaque récolte en opportunité commerciale."

 cp26_ferengi_mining_consortium:0 "Consortium Minier du DaiMon"
 cp26_ferengi_mining_consortium_desc:0 "Une opération d'extraction dirigée par des Ferengi qui étend la capacité minière et tire un profit supplémentaire de chaque gisement."
