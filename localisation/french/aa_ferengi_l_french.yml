l_french:
 auth_dictatorial_ferengi:0 "Conseil du Grand Nagus"
 auth_dictatorial_ferengi_desc:0 "L'Alliance Ferengi est gouvernée par le Grand Nagus, choisi par le Conseil des Conseillers Économiques. Le commerce et le profit guident toutes les décisions d'État."
 civic_ferengi_rules_of_acquisition:0 "Règles d'Acquisition"
 civic_ferengi_rules_of_acquisition_desc:0 "Les 285 Règles d'Acquisition forment le code sacré du commerce qui guide chaque transaction et décision politique Ferengi."
 civic_ferengi_grand_nagus:0 "Autorité du Grand Nagus"
 civic_ferengi_grand_nagus_desc:0 "Le Grand Nagus détient l'autorité commerciale et politique suprême, maintenant la population en ligne grâce aux incitations économiques et à la menace d'audit."
 ferengicorvette:0 "Maraudeur Ferengi"
