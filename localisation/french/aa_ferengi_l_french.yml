 tech_ferengi_dkora:0 "Maraudeur D'Kora"
 tech_ferengi_dkora_desc:0 "Les capitaines ferengi standardisent la ligne D'Kora comme premier vrai vaisseau de guerre a longue portée de l'Alliance, melant volume de fret, salons de negociation et juste assez de puissance de feu pour rendre chaque contrat incontournable."
 tech_ferengi_nandi:0 "Croiseur Nandi"
 tech_ferengi_nandi_desc:0 "Le schema Nandi perfectionne l'art ferengi de la guerre commerciale: une coque de croiseur plus rapide, un meilleur escortage et assez de volume interne pour soutenir des operations rentables loin de Ferenginar."
 tech_ferengi_galleon:0 "Galin"
 tech_ferengi_galleon_desc:0 "En transformant leur doctrine de convoi en un vrai navire de ligne, les Ferengi mettent en chantier le galion Zark: une coque massive d'acquisition concue pour intimider les routes commerciales et proteger les investissements majeurs."
 tech_ferengi_ooron:0 "Titan de commandement Ooron"
 tech_ferengi_ooron_desc:0 "Quand les reseaux marchands ferengi deviennent un empire du profit a l'echelle interstellaire, l'Ooron en devient le garant supreme: une forteresse-tresor mobile concue pour imposer des conditions, dissuader les rivaux et defendre les entreprises les plus lucratives de l'Alliance."
