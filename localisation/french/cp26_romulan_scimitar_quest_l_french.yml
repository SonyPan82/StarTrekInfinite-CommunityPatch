 qt_romulan_a7:0 "Forger le Scimitar"
 qt_romulan_a7_desc:0 "Les Majestus ont affirmé la puissance romulienne. À présent, le Tal Shiar et la marine impériale réclament quelque chose de plus sombre encore : un oiseau de guerre à singularité destiné à inspirer la terreur. Investissez 5500 alliages dans ce programme occulte pour débloquer la recherche du Scimitar."
