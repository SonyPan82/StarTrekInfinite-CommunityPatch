l_french:

 # --- Modificateurs de Planètes ---
 cp26_security_protocols:0 "Protocoles de Sécurité"
 cp26_security_protocols_desc:0 "Des analyses sanguines et des contrôles d'identité obligatoires ont été mis en place pour tout le personnel. Les Changelings sont traqués — mais la confiance a été érodée."
 cp26_sabotaged_infrastructure:0 "Infrastructure Sabotée"
 cp26_sabotaged_infrastructure_desc:0 "Un infiltrateur Changeling a détruit des infrastructures critiques. Les réparations sont en cours, mais les dégâts persisteront."
 cp26_ds9_damaged:0 "Dommages de Combat — Station"
 cp26_ds9_damaged_desc:0 "Deep Space Nine a subi des dommages structurels significatifs lors de l'assaut Dominion. Des équipes de réparation sont déployées, mais la restauration complète prendra du temps."

 # --- Projets Spéciaux ---
 CP26_GAMMA_EXPEDITION_SCIENCE:0 "Trou de ver de Bajor : Analyse Scientifique"
 CP26_GAMMA_EXPEDITION_SCIENCE_DESC:0 "Stationnez un vaisseau scientifique avec un scientifique dans le système Bajoran pour mener une analyse subspatiale complète du terminus du trou de ver. Les résultats seront essentiels pour comprendre ce qui se trouve de l'autre côté."
 CP26_GAMMA_EXPEDITION_MILITARY:0 "Trou de ver de Bajor : Patrouille Militaire"
 CP26_GAMMA_EXPEDITION_MILITARY_DESC:0 "Stationnez un vaisseau militaire dans le système Bajoran pour effectuer une évaluation tactique du trou de ver. Surveillez le trafic, cartographiez les signatures de capteurs et évaluez la menace posée par toute force de l'autre côté."

 # --- EVENT .100: Choix d'approche ---
 cp26_dominion_threat.100.name:0 "Le Trou de Ver de Bajor — Décision Stratégique"
 cp26_dominion_threat.100.desc:0 "Le Trou de ver de Bajor est confirmé stable. Quoi que se trouve de l'autre côté est conscient de ce terminus — et conscient de notre présence.\n\nLe commandement doit établir la façon dont nous allons aborder cette situation sans précédent. Le choix que nous faisons maintenant définira notre relation avec le Quadrant Gamma pour les années à venir.\n\nChaque approche nécessite le déploiement des ressources appropriées dans le système Bajoran."
 cp26_dominion_threat.100.a:0 "Expédition scientifique — stationner un vaisseau scientifique dans le système Bajoran."
 cp26_dominion_threat.100.b:0 "Patrouille militaire — stationner un vaisseau de guerre dans le système Bajoran."
 cp26_dominion_threat.100.c:0 "Sceller le trou de ver. Nous avons besoin de temps."

 # --- EVENT .109: Instructions Science ---
 cp26_dominion_threat.109.name:0 "Ordres : Analyse Scientifique — Système Bajoran"
 cp26_dominion_threat.109.desc:0 "Un projet d'analyse scientifique a été ouvert dans le système Bajoran. Stationnez un vaisseau scientifique commandé par un scientifique dans le système Bajoran pour commencer l'investigation.\n\nLe Quadrant Gamma n'attendra pas éternellement."
 cp26_dominion_threat.109.ok:0 "Déplacer le vaisseau scientifique vers le système Bajoran."

 # --- EVENT .119: Instructions Militaires ---
 cp26_dominion_threat.119.name:0 "Ordres : Patrouille Militaire dans le système Bajoran"
 cp26_dominion_threat.119.desc:0 "Un projet de patrouille militaire a été ouvert dans le système Bajoran. Stationnez un vaisseau de guerre dans le système Bajoran pour commencer l'évaluation tactique.\n\nQuoi que se trouve de l'autre côté de ce trou de ver, il nous observe déjà."
 cp26_dominion_threat.119.ok:0 "Déplacer la flotte vers le système Bajoran."

 # --- EVENT .102: Tension Bajorane ---
 cp26_dominion_threat.102.name:0 "Protestation Bajorane : Fermeture du Trou de Ver"
 cp26_dominion_threat.102.desc:0 "La décision de sceller le trou de ver n'est pas passée inaperçue. Le Gouvernement Provisoire Bajoran a déposé une protestation formelle — le trou de ver est considéré comme un passage sacré par le peuple Bajoran, et en restreindre l'accès est perçu comme une violation directe de leur souveraineté spirituelle.\n\nLes canaux diplomatiques sont tendus. Les Bajorans exigent un calendrier pour la réouverture."
 cp26_dominion_threat.102.a:0 "Céder. Accepter de rouvrir le trou de ver et lancer une analyse scientifique."
 cp26_dominion_threat.102.b:0 "Tenir bon. La fermeture reste en vigueur pour l'instant."

 # --- EVENT .200: Résultat de l'expédition scientifique ---
 cp26_dominion_threat.200.name:0 "Analyse Terminée : Terminus Gamma"
 cp26_dominion_threat.200.desc:0 "L'analyse scientifique du terminus du trou de ver dans le système Bajoran est terminée. Notre vaisseau a rassemblé un ensemble de données sans précédent sur le passage et la région de l'espace qui s'y trouve.\n\nLes relevés confirment une présence très organisée et technologiquement avancée du côté Gamma. De multiples contacts de vaisseaux ont été enregistrés — aucun ne s'est approché, mais tous ont observé.\n\nComment procédons-nous avec ces informations ?"
 cp26_dominion_threat.200.a:0 "Compiler les données. Rédiger un rapport complet."
 cp26_dominion_threat.200.b:0 "Utiliser nos découvertes pour tenter une transmission de premier contact formel."
 cp26_dominion_threat.200.c:0 "Les relevés sont préoccupants. Ordonner au vaisseau scientifique de se retirer."

 # --- EVENT .201: Réponse du Dominion ---
 cp26_dominion_threat.201.name:0 "Quadrant Gamma : Une Réponse"
 cp26_dominion_threat.201.desc:0 "Notre transmission de premier contact a été reçue. Après une période de silence qui s'est étirée pendant trente et un jours, une réponse est arrivée — structurée, délibérée, et clairement traduite par une IA linguistique très sophistiquée.\n\nLe message identifiait les expéditeurs comme le Dominion. Il n'exprimait aucune hostilité — seulement l'observation que notre espèce est entrée dans leur espace. Ils nous appellent §Isolides§!.\n\nLa transmission se terminait par une seule question : §IQuelles sont vos intentions ?§!"
 cp26_dominion_threat.201.a:0 "Répondre : nos intentions sont une exploration pacifique."
 cp26_dominion_threat.201.b:0 "Ne pas répondre. Fermer le canal."

 # --- EVENT .210: Résultat de l'expédition militaire ---
 cp26_dominion_threat.210.name:0 "Évaluation Militaire : Terminus du Trou de Ver"
 cp26_dominion_threat.210.desc:0 "La patrouille de notre vaisseau de guerre au terminus du trou de ver a confirmé ce que les renseignements soupçonnaient — le trou de ver est actif, stable, et surveillé depuis l'autre côté. Les balayages tactiques ont détecté les signatures énergétiques d'au moins trois vaisseaux maintenant leur position juste au-delà de la portée des capteurs.\n\nIls ne sont pas passés à l'attaque. Ils attendent de voir ce que nous ferons ensuite.\n\nLe commandement doit décider."
 cp26_dominion_threat.210.a:0 "Envoyer la flotte à travers. Établir la domination tactique du trou de ver."
 cp26_dominion_threat.210.b:0 "Tenir la position. Surveiller et fortifier l'approche du système Bajoran."
 cp26_dominion_threat.210.c:0 "Se replier. Le risque est trop grand à ce stade."

 # --- EVENT .211: Représailles Jem'Hadar ---
 cp26_dominion_threat.211.name:0 "Jem'Hadar — Incursion dans le Quadrant Alpha"
 cp26_dominion_threat.211.desc:0 "Le passage de notre flotte à travers le trou de ver n'est pas resté sans réponse. En quelques heures après notre retour, une formation de vaisseaux d'attaque Jem'Hadar a émergé du Trou de ver de Bajor et a pris position dans le système Bajoran.\n\nIls n'ont pas ouvert le feu — mais ils sont armés, et leur formation est sans équivoque agressive.\n\nC'est un message."
 cp26_dominion_threat.211.a:0 "Engager le combat. Repousser les Jem'Hadar à travers le trou de ver."
 cp26_dominion_threat.211.b:0 "Se mettre en veille. Retirer nos forces et les laisser se retirer."

 # --- Projet Spécial ---
 CP26_COLONY_INVESTIGATION:0 "Enquête : Colonie Silencieuse"
 CP26_COLONY_INVESTIGATION_DESC:0 "Stationnez un vaisseau de guerre dans le système affecté pour effectuer une analyse tactique complète, récupérer des survivants et déterminer l'étendue de l'activité Dominion dans le Quadrant Alpha."

 # --- Événements Phase 2 ---
 cp26_dominion_threat.400.name:0 "Activité Jem'Hadar dans le Quadrant Alpha"
 cp26_dominion_threat.400.desc:0 "Depuis l'ouverture du Trou de ver de Bajor, les rapports de renseignement sont de plus en plus alarmants. Des capitaines de cargos le long de la frontière Bajorane décrivent avoir été suivis par des vaisseaux ne correspondant à aucun design connu. Deux stations-relais de l'espace profond ont été déconnectées sans explication.\n\nCe matin, une colonie de la frontière a manqué son check-in planifié. Elle est silencieuse depuis onze heures.\n\nLe Dominion n'est plus satisfait d'observer depuis l'autre côté."
 cp26_dominion_threat.400.ok:0 "Augmenter le niveau de préparation à la frontière."

 cp26_dominion_threat.410.name:0 "Colonie Silencieuse"
 cp26_dominion_threat.410.desc:0 "La colonie frontière est maintenant silencieuse depuis quatre jours. La dernière transmission a été coupée en plein milieu d'une phrase. Les scans longue portée sont non concluants — soit le réseau de communications de la colonie a été détruit, soit quelque chose bloque le signal.\n\nLe Haut Commandement a trois options sur la table."
 cp26_dominion_threat.410.a:0 "Envoyer un vaisseau de guerre enquêter — le stationner dans le système colonial."
 cp26_dominion_threat.410.b:0 "Nous n'avons pas les ressources nécessaires. Ignorer le rapport."
 cp26_dominion_threat.410.c:0 "Accuser formellement Cardassia d'implication."

 cp26_dominion_threat.411.name:0 "Déni Cardassien"
 cp26_dominion_threat.411.desc:0 "Le Gul Dukat a répondu à notre accusation avec son mépris caractéristique. L'Union Cardassienne nie catégoriquement toute implication dans la disparition de la colonie, et suggère que nos services de renseignement ont une fois de plus confondu des routes de patrouille Cardassiennes avec des incursions hostiles.\n\nNos analystes sont divisés. Le déni est confiant — soit véridique, soit très bien répété."
 cp26_dominion_threat.411.a:0 "Accepter le déni. Les Cardassiens ne sont pas responsables."
 cp26_dominion_threat.411.b:0 "Rejeter le déni. Nous maintenons l'accusation."

 cp26_dominion_threat.412.name:0 "Ordres : Enquêter sur la Colonie"
 cp26_dominion_threat.412.desc:0 "Un projet d'investigation militaire a été ouvert dans le système de la colonie frontière. Stationnez un vaisseau de guerre là-bas pour effectuer un balayage tactique complet.\n\nSoyez prêts à faire face à un contact."
 cp26_dominion_threat.412.ok:0 "Compris. Déplacement des actifs vers la colonie."

 cp26_dominion_threat.413.name:0 "La Colonie a Disparu"
 cp26_dominion_threat.413.desc:0 "Trois semaines après notre décision d'ignorer le rapport, un équipage de récupération opérant dans le secteur a envoyé un rapport troublant : la colonie est vide. Pas de corps, pas de débris, pas de signes de lutte — seulement le silence et quelques effets personnels éparpillés.\n\nQuoi qu'il se soit passé, c'était chirurgical. Et une patrouille Jem'Hadar a maintenant été détectée près du système Bajoran."
 cp26_dominion_threat.413.ok:0 "Augmenter immédiatement les patrouilles à la frontière."

 cp26_dominion_threat.420.name:0 "Embuscade — Jem'Hadar à la Colonie"
 cp26_dominion_threat.420.desc:0 "Notre vaisseau de guerre est arrivé à la colonie silencieuse pour la trouver non pas vide — mais occupée. Une escadre d'assaut Jem'Hadar attendait, maintenant sa position dans la ceinture extérieure du système.\n\nDès que notre vaisseau est entré à portée des capteurs, ils se sont déplacés pour intercepter. Ce n'était pas une patrouille de reconnaissance. Ils savaient que nous venions."
 cp26_dominion_threat.420.a:0 "Engager les Jem'Hadar. Tenir le système."
 cp26_dominion_threat.420.b:0 "Se replier. Préserver le vaisseau — la colonie est perdue."

 cp26_dominion_threat.430.name:0 "Investigation Terminée : Renseignements Dominion Récupérés"
 cp26_dominion_threat.430.desc:0 "La colonie a été évacuée — pas détruite. Les colons ont été déplacés, apparemment de force, dans des structures construites selon les spécifications Dominion. L'équipage de notre vaisseau de guerre a trouvé des enregistrements extensifs de capteurs de l'activité Dominion dans le système remontant à plusieurs mois.\n\nNous disposons maintenant de données détaillées sur les schémas de patrouille Jem'Hadar, les configurations de vaisseaux et les protocoles de communication. C'est un aubaine considérable en matière de renseignement."
 cp26_dominion_threat.430.a:0 "Partager immédiatement le renseignement avec toutes les puissances alliées."
 cp26_dominion_threat.430.b:0 "Classifier les données. Garder l'avantage pour nous-mêmes."

 # --- Projets Spéciaux Phases 3-5 ---
 CP26_CHANGELING_HUNT:0 "Opération : Chasse aux Changelings"
 CP26_CHANGELING_HUNT_DESC:0 "Stationnez un vaisseau scientifique avec un scientifique dans le système Bajoran pour coordonner un balayage clandestin visant à détecter les infiltrateurs Changeling. Des scans de résonance subspaciale et des débriefings d'agents permettront de cerner le réseau d'imposteurs."
 CP26_CARDASSIA_RECON:0 "Opération : Reconnaissance Cardassia"
 CP26_CARDASSIA_RECON_DESC:0 "Stationnez un vaisseau scientifique dans le système Bajoran pour intercepter les communications Cardassiennes près de la frontière. Déterminez si les rumeurs de négociations avec le Dominion sont fondées — et à quel stade elles en sont."
 CP26_DS9_DEFENSE:0 "Défense : Deep Space Nine"
 CP26_DS9_DEFENSE_DESC:0 "Stationnez un vaisseau de guerre dans le système Bajoran pour coordonner la défense de la station face à l'armada Dominion. Chaque vaisseau compte."

 # --- Phase 3 : Infiltration Changeling ---
 cp26_dominion_threat.500.name:0 "Anomalies dans la Structure de Commandement"
 cp26_dominion_threat.500.desc:0 "Un officier supérieur a soumis un rapport classifié. Au cours des dernières semaines, trois officiers de haut rang ont agi de façon difficile à concilier avec leurs personnalités connues — des décisions annulées sans explication, des réunions auxquelles ils ont assisté sans trace dans les registres, des questions éludées qui auraient dû être répondues en quelques secondes.\n\nLes services de renseignement estiment que le Dominion a placé des agents dans notre structure de commandement. Les Changelings n'ont pas besoin de vaisseaux pour mener leur guerre."
 cp26_dominion_threat.500.ok:0 "Convoquer une révision de sécurité d'urgence."

 cp26_dominion_threat.510.name:0 "Le Problème d'Infiltration"
 cp26_dominion_threat.510.desc:0 "Le niveau d'infiltration Changeling dans nos systèmes est inconnu — et c'est la partie la plus dangereuse. Trois options sont sur la table. Chacune a son propre prix."
 cp26_dominion_threat.510.a:0 "Tests sanguins obligatoires pour tout le personnel supérieur."
 cp26_dominion_threat.510.b:0 "Préserver les libertés civiles. Nous ne deviendrons pas ce contre quoi nous nous battons."
 cp26_dominion_threat.510.c:0 "Activer la Section 31. Laissons nos ombres gérer les leurs. [300 Influence]"

 cp26_dominion_threat.511.name:0 "Résultats des Tests Sanguins"
 cp26_dominion_threat.511.desc:0 "Les analyses sont terminées. §Y[Root.GetName]§! a identifié un certain nombre d'individus dont la morphologie sanguine ne correspond pas à leurs dossiers de service. Les preuves sont concluantes.\n\nLa question est ce que nous faisons avec eux."
 cp26_dominion_threat.511.a:0 "Les détenir et les interroger. Nous avons besoin de tout ce qu'ils savent."
 cp26_dominion_threat.511.b:0 "Les éliminer discrètement. Pas de procès, pas d'exposition."

 cp26_dominion_threat.512.name:0 "Section 31 — Rapport Post-Opération"
 cp26_dominion_threat.512.desc:0 "Nos opératives sont revenus du terrain. Le réseau Changeling a été substantiellement perturbé — mais si l'opération a été un succès complet ou seulement partiel reste incertain. Ce qu'ils ont appris met soit fin à la crise, soit ouvre la phase suivante."
 cp26_dominion_threat.512.a:0 "Succès complet. Le réseau est démantelé."
 cp26_dominion_threat.512.b:0 "Succès partiel. Ils savent que nous sommes venus les chercher."

 cp26_dominion_threat.520.name:0 "Incident Changeling"
 cp26_dominion_threat.520.desc:0 "Un nouveau rapport est arrivé. Le schéma est indéniable — il y a encore des Changelings parmi nous, et ils sont toujours actifs. Quoi que nous ayons fait jusqu'à présent n'a pas suffi.\n\nUn projet d'investigation peut être ouvert dans le système Bajoran pour les traquer directement."
 cp26_dominion_threat.520.a:0 "Ouvrir une investigation Chasse aux Changelings dans le système Bajoran."
 cp26_dominion_threat.520.b:0 "Absorber les dégâts. Nous ne pouvons pas mobiliser les ressources maintenant."

 # --- Phase 4 : Alliance Cardassia/Dominion ---
 cp26_dominion_threat.600.name:0 "Mouvements Inhabituels à la Frontière Cardassienne"
 cp26_dominion_threat.600.desc:0 "Les renseignements ont signalé une série de réunions clandestines près de la frontière Bajorane. Des délégués Cardassiens ont été observés à bord de vaisseaux non enregistrés dans l'espace profond — des vaisseaux dont les signatures de moteur correspondent aux modèles Dominion connus.\n\nSi les Cardassiens négocient un accord de protection avec le Dominion, les conséquences pour le Quadrant Alpha seraient sévères."
 cp26_dominion_threat.600.a:0 "Envoyer un vaisseau scientifique intercepter les communications Cardassiennes."
 cp26_dominion_threat.600.b:0 "Ouvrir un canal diplomatique directement avec Cardassia. [200 Influence]"

 cp26_dominion_threat.610.name:0 "Cardassia Rejoint le Dominion"
 cp26_dominion_threat.610.desc:0 "Le Préfet Cardassien a fait l'annonce depuis Cardassia Prime. Un traité de protection mutuelle a été signé avec le Dominion. Les soldats Jem'Hadar sont maintenant stationnés dans tout l'espace Cardassien, et les ressources militaires Cardassiennes sont officiellement à la disposition du Dominion.\n\nL'équilibre des pouvoirs dans le Quadrant Alpha a changé — et pas en notre faveur."
 cp26_dominion_threat.610.a:0 "Se préparer à la guerre. Lancer une mobilisation militaire d'urgence."
 cp26_dominion_threat.610.b:0 "Proposer une médiation d'urgence. [400 Influence]"

 cp26_dominion_threat.620.name:0 "Une Question de Loyauté"
 cp26_dominion_threat.620.desc:0 "L'alliance Cardassie-Dominion a forcé un ajustement politique. Plusieurs de nos accords existants avec l'Union Cardassienne sont maintenant profondément problématiques — les honorer fournit au Dominion des ressources et du renseignement par procuration.\n\nLe gouvernement exige une décision claire sur notre position."
 cp26_dominion_threat.620.a:0 "Résilier tous les accords existants avec Cardassia."
 cp26_dominion_threat.620.b:0 "Maintenir une neutralité technique. Nous ne pouvons pas nous permettre des ennemis sur deux fronts."

 # --- Phase 5 : Guerre du Dominion ---
 cp26_dominion_threat.700.name:0 "La Guerre du Dominion Commence"
 cp26_dominion_threat.700.desc:0 "Les renseignements sont sans ambiguïté. Les flottes Dominion se rassemblent des deux côtés du trou de ver. Les incursions Jem'Hadar ne sont plus des actions de reconnaissance — ce sont les premiers mouvements d'une campagne.\n\nLe Quadrant Alpha est en guerre."
 cp26_dominion_threat.700.ok:0 "Alerte générale. Tous les commandements en état de préparation au combat."

 cp26_dominion_threat.701.name:0 "Raid Jem'Hadar — Frontière Bajorane"
 cp26_dominion_threat.701.desc:0 "Une aile d'attaque Jem'Hadar a traversé la frontière et engage des cibles dans le système Bajoran. Ce ne sont pas des ressources de reconnaissance — ce sont des vaisseaux d'attaque prêts au combat exécutant des frappes coordonnées.\n\nLes commandements attendent les ordres."
 cp26_dominion_threat.701.a:0 "Engager et repousser les raiders."
 cp26_dominion_threat.701.b:0 "Se replier et préserver nos forces pour les batailles à venir."

 cp26_dominion_threat.710.name:0 "Les Forces Dominion Attaquent"
 cp26_dominion_threat.710.desc:0 "Une force de frappe Dominion significative est entrée dans le système. Leurs vecteurs d'attaque suggèrent une tentative délibérée de capturer ou neutraliser l'infrastructure clé — pas un raid, mais une tentative d'occupation.\n\nLe commandement doit répondre."
 cp26_dominion_threat.710.a:0 "Défendre le système à tout prix."
 cp26_dominion_threat.710.b:0 "Évacuer ce que nous pouvons. Le système ne vaut pas ce combat."

 cp26_dominion_threat.720.name:0 "La Bataille de Deep Space Nine"
 cp26_dominion_threat.720.desc:0 "Une armada Dominion approche du système Bajoran. Deep Space Nine est directement sur leur chemin. Notre fenêtre de réponse est étroite — quoi que nous choisissions, nous le choisissons maintenant.\n\nTrois options restent."
 cp26_dominion_threat.720.a:0 "Défendre la station. Stationner un vaisseau de guerre dans le système Bajoran."
 cp26_dominion_threat.720.b:0 "Évacuer Deep Space Nine. Préserver notre équipage."
 cp26_dominion_threat.720.c:0 "Miner le trou de ver. Couper la ligne d'approvisionnement du Dominion — définitivement."

 cp26_dominion_threat.730.name:0 "Les Prophètes s'Éveillent"
 cp26_dominion_threat.730.desc:0 "La sphère de l'Orbe à bord de la station pulse avec une intensité qui n'a pas été vue depuis des années. L'équipage Bajoran de la station s'est rassemblé en silence dans le sanctuaire. Quoi que les Prophètes aient l'intention de communiquer, cela se passe maintenant — et l'armada est toujours en approche.\n\nLe choix nous appartient."
 cp26_dominion_threat.730.a:0 "Faire confiance aux Prophètes. Mettre nos armes en veille."
 cp26_dominion_threat.730.b:0 "Ce n'est pas le moment pour la religion. Notre survie est notre propre responsabilité."

 cp26_dominion_threat.731.name:0 "L'Armada Disparaît"
 cp26_dominion_threat.731.desc:0 "Les capteurs à travers tout le système Bajoran ont enregistré l'événement simultanément — une bouffée de rayonnement tachyon de l'intérieur du trou de ver, puis le silence. Quand les interférences se sont dissipées, il n'y avait rien là où l'armada Dominion avait été.\n\nIls ont disparu. Chaque vaisseau. Disparu."
 cp26_dominion_threat.731.ok:0 "Enregistrer l'événement. Toutes les stations, sortir de l'état de préparation au combat."

 # --- Fins ---
 cp26_dominion_threat.800.name:0 "Le Dominion Se Retire"
 cp26_dominion_threat.800.desc:0 "Le message est arrivé sans préambule, comme toutes les communications Dominion. Les Fondateurs ont conclu que le coût d'une invasion totale du Quadrant Alpha dépasse la valeur stratégique du résultat. Les Jem'Hadar se replient.\n\nDeep Space Nine tient. Le trou de ver reste ouvert. La guerre est terminée — du moins pour l'instant."
 cp26_dominion_threat.800.ok:0 "Commencer la reconstruction et le débriefing. Consignez-le : nous avons tenu."

 cp26_dominion_threat.810.name:0 "Le Quadrant Alpha Tombe"
 cp26_dominion_threat.810.desc:0 "Le drapeau Dominion flotte au-dessus de Deep Space Nine. Des gouverneurs Jem'Hadar ont été installés dans les systèmes clés. L'occupation est systématique, méthodique et totale — comme tout ce que fait le Dominion.\n\nIl n'y a pas de cessez-le-feu. Il n'y a que la survie, et l'espoir que la résistance soit encore possible."
 cp26_dominion_threat.810.ok:0 "Nous endurons. Commencer la planification de résistance."

 cp26_dominion_threat.820.name:0 "Cardassia Se Soulève Contre le Dominion"
 cp26_dominion_threat.820.desc:0 "Le message est fragmenté et arrive par des canaux détournés, mais son sens est clair : le peuple Cardassien combat ses occupants Dominion. Rue par rue, station par station — la rébellion est réelle.\n\nCela change tout. Si nous agissons maintenant, la guerre peut se terminer. Deux chemins sont ouverts."
 cp26_dominion_threat.820.a:0 "Soutenir la résistance Cardassienne. Envoyer ce que nous pouvons."
 cp26_dominion_threat.820.b:0 "Laisser Odo négocier. Les Fondateurs écouteront l'un des leurs."
