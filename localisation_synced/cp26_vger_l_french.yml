 cp26_vger.5.title: "V'ger"
 cp26_vger.5.desc: "Une immense entité mécanique est entrée en orbite de [event_target:cp26_vger_present_world.GetName]. Ses trajectoires, son inertie et ses balayages de surface rappellent moins une attaque qu'une analyse méthodique. Les archives les plus anciennes évoquent un contact très ancien avec V'ger, mais ce nouveau passage révèle autre chose : un signal secondaire, ancien, fragmentaire, dont les harmoniques rappellent vaguement la sonde des baleines sans pourtant s'y confondre. Une étude approfondie pourrait révéler ce que V'ger a suivi jusqu'ici."
 cp26_vger.5.a: "Lancer l'analyse"
 cp26_vger.5.b: "Observer sans intervenir"
 cp26_vger.6.title: "Échos venus des profondeurs"
 cp26_vger.6.desc: "Nos équipes ont finalement isolé la logique derrière la trajectoire de V'ger. L'entité ne cherchait pas à transformer notre peuple : elle suivait une piste. Quelque part, au fil de ses contacts avec des intelligences antiques, V'ger a effleuré un appel à l'aide dont les signatures rappellent celles de l'ancienne sonde des baleines. En remontant cette trace, nous avons découvert des survivants oubliés : les Néréens. V'ger s'éloigne à présent, laissant derrière lui ces nouveaux venus et un trésor de données."
 CP26_VGER_ANALYSIS: "Analyser V'ger"
 CP26_VGER_ANALYSIS_DESC: "V'ger maintient un stationnement prolongé au-dessus de cette colonie et diffuse un maillage de scans d'une finesse inédite. Étudier ses motifs pourrait révéler la raison véritable de son voyage."
 cp26_vger_in_orbit: "Présence de V'ger"
 cp26_vger_in_orbit_desc: "La présence silencieuse de V'ger en orbite stimule la curiosité scientifique locale et concentre les efforts de recherche."
 cp26_vger_afterglow: "Après-lueur de V'ger"
 cp26_vger_afterglow_desc: "Les données laissées par V'ger continuent d'alimenter nos laboratoires bien après son départ."
