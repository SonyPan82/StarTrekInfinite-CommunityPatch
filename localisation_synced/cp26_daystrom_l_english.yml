l_english:
 cp26_daystrom_chain_title: "Daystrom Incident"
 cp26_daystrom_chain_desc: "Experiments conducted at Daystrom Station are becoming increasingly unstable. The situation requires constant oversight."
 cp26_daystrom_station: "Daystrom Station"
 cp26_daystrom_station_DESC: "An advanced research station dedicated to subspace phenomena and high-risk experimentation."
 cp26_daystrom_rift_habitat: "Umbral Habitat"
 cp26_daystrom_rift_habitat_DESC: "An improvised structure that emerged in the wake of the subspace rupture."
 tech_cp26_daystrom_institute: "Daystrom Institute"
 tech_cp26_daystrom_institute_desc: "Developing a specialized station will allow us to push our subspace research much further."
 cp26_daystrom_requires_planet_or_moon: "Must be built around a planet or moon."
 cp26_daystrom_requires_ufop_system: "Must be built in a Federation-owned system."
 cp26_daystrom_requires_non_capital_system: "Cannot be built in the capital system."
 cp26_daystrom_requires_empty_system: "The system must not contain another megastructure."
 cp26_daystrom_requires_no_megastructure: "This celestial body already has a megastructure."
 cp26_daystrom_umbral_bootstrap: "Umbral Invasion Momentum"
 cp26_daystrom_umbral_bootstrap_desc: "The Umbrals emerged with enough reserves and military momentum to establish themselves quickly."
 cp26_daystrom_defense_mobilization: "Defensive Mobilization"
 cp26_daystrom_defense_mobilization_desc: "The Daystrom incident has triggered an empire-wide emergency mobilization."
 NAME_CP26_DAYSTROM_RIFT_WORLD: "Daystrom Rift"
 NAME_CP26_DAYSTROM_RIFT_FLEET: "Incursion Swarm"
 cp26_daystrom.1.title: "Daystrom Station"
 cp26_daystrom.1.desc: "The first experiments conducted at Daystrom Station have revealed unprecedented subspace signatures. The teams are requesting authorization to pursue a far more ambitious program, despite risks that remain difficult to measure."
 cp26_daystrom.1.a: "Authorize the full program"
 cp26_daystrom.1.b: "Limit the trials"
 cp26_daystrom.1.c: "Suspend the project"
 cp26_daystrom.2.title: "Rising Fluctuations"
 cp26_daystrom.2.desc: "Readings from Daystrom Station show steadily increasing subspace stress. The researchers believe a power adjustment could produce decisive results."
 cp26_daystrom.2.desc_limited: "Even under a restricted protocol, Daystrom Station is registering abnormal fluctuations. The researchers are asking for a new ruling before proceeding."
 cp26_daystrom.2.a: "Increase power"
 cp26_daystrom.2.b: "Maintain current parameters"
 cp26_daystrom.2.c: "Reduce operations to the bare minimum"
 cp26_daystrom.3.title: "Critical Threshold"
 cp26_daystrom.3.desc: "Daystrom Station is approaching a critical experimental threshold. The scientists believe one final test could at last explain the phenomenon."
 cp26_daystrom.3.desc_suspended: "Despite reduced operations, the instability around Daystrom Station persists. One final test might clarify the situation, but the risks remain high."
 cp26_daystrom.3.a: "Proceed with the final test"
 cp26_daystrom.3.b: "Permanently halt the experiments"
 cp26_daystrom.3.c: "Close the program and archive the data"
 cp26_daystrom.4.title: "The Rupture"
 cp26_daystrom.4.desc: "The final test ends in disaster. A subspace rupture tears open, devastates Daystrom Station, and allows an unknown force from beyond normal space to break through."
 cp26_daystrom.5.title: "Umbral Transmission"
 cp26_daystrom.5.desc: "You tried to destroy us before you even understood us. Your intrusion crossed the veil and brought war into our domain. We will return that violence, whoever you may be."
 cp26_daystrom.100.title: "Incident at Daystrom Station"
 cp26_daystrom.100.desc: "A subspace catastrophe linked to Daystrom Station has triggered the emergence of a hostile power from beyond the veil. The Umbrals have entered the galaxy and hostilities have begun."
