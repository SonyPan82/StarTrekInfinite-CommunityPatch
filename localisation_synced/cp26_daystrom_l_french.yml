l_french:
 cp26_daystrom_chain_title: "Incident Daystrom"
 cp26_daystrom_chain_desc: "Des expériences menées à la station Daystrom deviennent de plus en plus instables. La situation exige un suivi constant."
 cp26_daystrom_station: "Station Daystrom"
 cp26_daystrom_station_DESC: "Une station de recherche avancée dédiée aux phénomènes subspatiaux et aux expériences à haut risque."
 cp26_daystrom_rift_habitat: "Habitat ombral"
 cp26_daystrom_rift_habitat_DESC: "Une structure improvisée surgie après la déchirure subspatiale."
 tech_cp26_daystrom_institute: "Institut Daystrom"
 tech_cp26_daystrom_institute_desc: "Le développement d'une station spécialisée permettra de pousser plus loin nos recherches subspatiales."
 cp26_daystrom_requires_planet_or_moon: "Doit être construite autour d'une planète ou d'une lune."
 cp26_daystrom_requires_ufop_system: "Doit être construite dans un système appartenant à la Fédération."
 cp26_daystrom_requires_non_capital_system: "Ne peut pas être construite dans le système capital."
 cp26_daystrom_requires_empty_system: "Le système ne doit pas contenir d'autre mégastructure."
 cp26_daystrom_requires_no_megastructure: "Cet astre possède déjà une mégastructure."
 cp26_daystrom_umbral_bootstrap: "Élan d'invasion ombral"
 cp26_daystrom_umbral_bootstrap_desc: "Les Umbrals ont émergé avec des réserves et une dynamique de guerre suffisantes pour s'implanter rapidement."
 cp26_daystrom_defense_mobilization: "Mobilisation défensive"
 cp26_daystrom_defense_mobilization_desc: "L'incident Daystrom a déclenché une mobilisation d'urgence à l'échelle de l'empire."
 NAME_CP26_DAYSTROM_RIFT_WORLD: "Faille de Daystrom"
 NAME_CP26_DAYSTROM_RIFT_FLEET: "Essaim d'incursion"
 cp26_daystrom.1.title: "Station Daystrom"
 cp26_daystrom.1.desc: "Les premières expériences menées à la station Daystrom ont révélé des signatures subspatiales inédites. Les équipes demandent l'autorisation de poursuivre un programme plus ambitieux, malgré des risques difficiles à quantifier."
 cp26_daystrom.1.a: "Autoriser le programme complet"
 cp26_daystrom.1.b: "Limiter les essais"
 cp26_daystrom.1.c: "Suspendre le projet"
 cp26_daystrom.2.title: "Fluctuations croissantes"
 cp26_daystrom.2.desc: "Les relevés de la station Daystrom indiquent une amplification continue des tensions subspatiales. Les chercheurs estiment qu'un ajustement de puissance permettrait d'obtenir des résultats décisifs."
 cp26_daystrom.2.desc_limited: "Même avec un protocole restreint, la station Daystrom enregistre des fluctuations anormales. Les chercheurs demandent une nouvelle décision avant de poursuivre."
 cp26_daystrom.2.a: "Augmenter la puissance"
 cp26_daystrom.2.b: "Maintenir les paramètres actuels"
 cp26_daystrom.2.c: "Réduire les opérations au minimum"
 cp26_daystrom.3.title: "Le seuil critique"
 cp26_daystrom.3.desc: "La station Daystrom approche d'un seuil expérimental critique. Les scientifiques pensent qu'un dernier essai permettrait enfin de comprendre le phénomène."
 cp26_daystrom.3.desc_suspended: "Malgré la réduction des opérations, l'instabilité persiste autour de la station Daystrom. Un dernier test pourrait clarifier la situation, mais les risques restent élevés."
 cp26_daystrom.3.a: "Procéder au test final"
 cp26_daystrom.3.b: "Stopper définitivement les essais"
 cp26_daystrom.3.c: "Fermer le programme et archiver les données"
 cp26_daystrom.4.title: "La déchirure"
 cp26_daystrom.4.desc: "L'essai final tourne au désastre. Une déchirure subspatiale s'ouvre brutalement, ravage la station Daystrom et laisse passer une force inconnue venue d'au-delà de l'espace normal."
 cp26_daystrom.5.title: "Transmission des Umbrals"
 cp26_daystrom.5.desc: "Vous avez tenté de nous anéantir avant même de nous comprendre. Votre intrusion a franchi le voile et porté la guerre dans notre domaine. Nous vous rendrons cette violence, qui que vous soyez."
 cp26_daystrom.100.title: "Incident à la station Daystrom"
 cp26_daystrom.100.desc: "Une catastrophe subspatiale liée à la station Daystrom a déclenché l'apparition d'une puissance hostile venue d'au-delà du voile. Les Umbrals ont émergé dans la galaxie et les hostilités ont commencé."
